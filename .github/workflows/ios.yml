name: iOS — проверка сборки

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &mobile_paths
      - 'packages/core/**'
      - 'apps/fittimer/ios/**'
      - 'apps/fittimer/scripts/**'
      - 'apps/fittimer/src/**'
      - 'apps/fittimer/style.css'
      - 'apps/fittimer/index.html'
      - 'apps/fittimer/mobile.js'
      - 'apps/fittimer/app.config.js'
      - 'apps/fittimer/capacitor.config.json'
      - 'apps/fittimer/package.json'
      - 'apps/fittimer/package-lock.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *mobile_paths


jobs:
  simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/fittimer
    env:
      FIT_TIMER_API_URL: ${{ vars.FIT_TIMER_API_URL || 'https://fittimer99.vercel.app' }}
      FIT_TIMER_PUBLIC_URL: ${{ vars.FIT_TIMER_PUBLIC_URL || 'https://fittimer99.vercel.app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/fittimer/package-lock.json

      - name: Установить зависимости и синхронизировать Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile

      - name: Собрать для iOS Simulator без подписи
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
