name: iOS — проверка сборки

on:
  # macOS simulator is slow; web/Core-only changes use fast checks instead.
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/fittimer/ios/**'
      - 'apps/fittimer/capacitor.config.json'
      - 'apps/fittimer/scripts/check-mobile.mjs'
      - '.github/workflows/ios.yml'
      - '!**/*.md'


concurrency:
  group: ios-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/fittimer
    env:
      FIT_TIMER_API_URL: ${{ vars.FIT_TIMER_API_URL || 'https://fittimer99.vercel.app' }}
      FIT_TIMER_PUBLIC_URL: ${{ vars.FIT_TIMER_PUBLIC_URL || 'https://fittimer99.vercel.app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/fittimer/package-lock.json

      - name: Установить зависимости и синхронизировать Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile

      - name: Собрать для iOS Simulator без подписи
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
