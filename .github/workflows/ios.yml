name: iOS — проверка сборки

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Сборка для симулятора ничего не выпускает и проверяет только нативный
    # проект. Веб-код в неё не компилируется: его упаковку проверяет
    # check:mobile в source-consistency.yml.
    paths: &ios_paths
      - 'ios/**'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.mjs'
      - 'scripts/check-mobile.mjs'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *ios_paths

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true


jobs:
  simulator:
    runs-on: macos-15
    env:
      FIT_TIMER_API_URL: ${{ vars.FIT_TIMER_API_URL || 'https://fittimer99.vercel.app' }}
      FIT_TIMER_PUBLIC_URL: ${{ vars.FIT_TIMER_PUBLIC_URL || 'https://fittimer99.vercel.app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости и синхронизировать Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile

      - name: Собрать для iOS Simulator без подписи
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
