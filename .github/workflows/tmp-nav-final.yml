name: Temp navigation final integration

on:
  push:
    branches:
      - audit/navigation-transitions-20260924

concurrency:
  group: tmp-nav-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Merge latest main in workspace
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          bad="$(printf '%s\n' "$conflicts" | grep -v -E '^(app\.js|\.ai/symbol-index\.json)$' | sed '/^$/d' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected merge conflicts:"
            echo "$bad"
            exit 1
          fi
          for f in app.js .ai/symbol-index.json; do
            if printf '%s\n' "$conflicts" | grep -Fxq "$f"; then
              git checkout --ours -- "$f"
              git add "$f"
            fi
          done
          if [ "$rc" -ne 0 ] && git diff --name-only --diff-filter=U | grep -q .; then
            exit 1
          fi
      - name: Rebuild and verify generated sources
        run: |
          npm run build:sources
          npm run ai:index
          npm run check:sources
      - name: Browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          echo "FIT_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Full browser suite
        env:
          ADMIN_KEY: testadminkey123456
          GEMINI_API_KEY: test
          AI_TEST_MODE: '1'
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-browser-server.log 2>&1 &
          SERVER_PID=$!
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/fittimer-static.log 2>&1 &
          STATIC_PID=$!
          trap 'kill $SERVER_PID $STATIC_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8124/index.html >/dev/null && curl -fsS http://127.0.0.1:8123/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/run-browser-tests.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIT_TIMER_API_URL: https://fittimer99.vercel.app
      FIT_TIMER_PUBLIC_URL: https://fittimer99.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Merge latest main in workspace
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          bad="$(printf '%s\n' "$conflicts" | grep -v -E '^(app\.js|\.ai/symbol-index\.json)$' | sed '/^$/d' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected merge conflicts:"
            echo "$bad"
            exit 1
          fi
          for f in app.js .ai/symbol-index.json; do
            if printf '%s\n' "$conflicts" | grep -Fxq "$f"; then
              git checkout --ours -- "$f"
              git add "$f"
            fi
          done
          if [ "$rc" -ne 0 ] && git diff --name-only --diff-filter=U | grep -q .; then
            exit 1
          fi
      - name: Build merged web sources
        run: |
          npm run build:sources
          npm run ai:index
      - name: Dependencies and Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile
      - uses: gradle/actions/setup-gradle@v6
      - name: Android debug + unit tests
        working-directory: android
        run: ./gradlew assembleDirectDebug assemblePlayDebug testDirectDebugUnitTest --no-daemon
