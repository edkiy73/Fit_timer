name: Admin — browser smoke

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'api/admin.js'
      - 'lib/ai.js'
      - 'lib/ai-protocol.js'
      - 'tests/admin-flow.js'
      - 'tests/dev-server.js'
      - '.github/workflows/admin-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin.js'
      - 'api/admin.js'
      - 'lib/ai.js'
      - 'lib/ai-protocol.js'
      - 'tests/admin-flow.js'
      - 'tests/dev-server.js'
      - '.github/workflows/admin-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Admin smoke
        env:
          ADMIN_KEY: testadminkey123456
          GEMINI_API_KEY: test
          AI_TEST_MODE: '1'
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-admin-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8124/admin.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/admin-flow.js
