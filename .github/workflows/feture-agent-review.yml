name: FetUre — independent AI review

# Read-only second model pass. No approval, merging, deployment, or writes to code.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional FetUre agent PR number (otherwise newest open agent PR)'
        type: string
        required: false
  workflow_run:
    workflows: ['FetUre — guarded coding queue']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: feture-agent-review
  cancel-in-progress: false

jobs:
  pick:
    if: >-
      vars.FETURE_AGENT_REVIEW_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.select.outputs.pr }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: select
        env:
          REQUESTED_PR: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const valid = p => p.state === 'open' &&
              p.head.repo?.full_name === context.repo.owner + '/' + repo &&
              /^feture\/agent-\d+$/.test(p.head.ref);
            let pr;
            if (process.env.REQUESTED_PR) {
              const number = Number(process.env.REQUESTED_PR);
              if (!Number.isSafeInteger(number) || number < 1) throw Error('Invalid PR number');
              pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            } else {
              const all = await github.paginate(github.rest.pulls.list,
                {owner, repo, state: 'open', per_page: 100, sort: 'created', direction: 'desc'});
              pr = all.find(valid);
            }
            if (!pr) {core.notice('No agent PR to review.'); return;}
            if (!valid(pr)) throw Error('Refusing to review a non-agent/fork PR with API credentials');
            core.setOutput('pr', String(pr.number));
            core.setOutput('sha', pr.head.sha);

  review:
    needs: pick
    if: needs.pick.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare scoped review prompt
        env:
          PR_NUMBER: ${{ needs.pick.outputs.pr }}
        run: |
          cat > .feture-review-task.md <<'PROMPT'
          Independent FetUre code/security/UX review. Read-only. Do NOT write files or run production/network operations.
          Read AGENTS.md and apps/feture/AGENTS.md, then only changed source and relevant tests.
          Inspect the diff against origin/main. Focus on privacy leaks, account boundary, 18+ access,
          data loss, API/auth contracts, UI form states, responsive behavior and unintended scope.
          Report only actionable defects with file paths, severity and reproduction steps.
          State exactly which UI/device checks were not performed. A green build does not mean accepted.
          If no blocking issues found, say so without approving a merge.
          PROMPT
          printf '\nReview PR #%s\n' "$PR_NUMBER" >> .feture-review-task.md
      - uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          model: ${{ vars.FETURE_REVIEW_MODEL }}
          effort: high
          prompt-file: .feture-review-task.md
          allow-bots: 'true'
          allow-bot-users: 'github-actions[bot]'

  comment:
    needs: [pick, review]
    if: needs.review.result == 'success' && needs.review.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.pick.outputs.pr }}
          REVIEW: ${{ needs.review.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: '**Automated independent review — NOT merge approval**\n\n' +
                String(process.env.REVIEW || '').slice(0, 12000)
            });
