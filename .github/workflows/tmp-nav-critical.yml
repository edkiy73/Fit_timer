name: Temp navigation critical

on:
  push:
    branches:
      - audit/navigation-transitions-20260924

permissions:
  contents: write

jobs:
  critical:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refresh generated artifacts
        run: |
          npm run build:sources
          npm run ai:index
      - name: Commit generated artifacts
        run: |
          if ! git diff --quiet -- app.js style.css index.html .ai/symbol-index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js style.css index.html .ai/symbol-index.json
            git commit -m "build: refresh navigation audit artifacts [skip vercel]"
            git push
          fi
      - name: Browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          echo "FIT_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Critical navigation tests
        env:
          ADMIN_KEY: testadminkey123456
          GEMINI_API_KEY: test
          AI_TEST_MODE: '1'
        run: |
          node tests/dev-server.js 8124 >/tmp/fittimer-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8124/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/run-browser-tests.mjs nav-transitions ai-edit-carry
