name: Temp navigation audit build

on:
  push:
    branches:
      - audit/navigation-transitions-20260924

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refresh generated artifacts
        run: |
          npm run build:sources
          npm run ai:index
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- app.js style.css index.html .ai/symbol-index.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css index.html .ai/symbol-index.json
          git commit -m "build: refresh navigation audit artifacts [skip vercel]"
          git push
