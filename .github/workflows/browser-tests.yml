name: Browser tests

# Сквозные и браузерные тесты приложения. Раньше их в CI не было, и они незаметно
# ломались. Список тестов и проверка «каждый тест где-то запускается» —
# в scripts/run-browser-tests.mjs.
on:
  pull_request:
    paths: &browser_paths
      - 'packages/core/**'
      - 'apps/**'
      - 'scripts/apps.mjs'
      - 'package.json'
      - '.github/workflows/browser-tests.yml'
  push:
    branches: [main]
    paths: *browser_paths

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Браузер для тестов
        run: |
          npm run setup
          npm --prefix apps/fittimer install --no-save playwright@1.55.0
          npm --prefix apps/fittimer exec playwright install --with-deps chromium
          echo "FIT_CHROME=$(cd apps/fittimer && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      # Собирает dist, на время прогона включает тестовый мост (__FIT_TEST_MODE__,
      # см. scripts/test-bridge.mjs), поднимает tests/dev-server.js и статику,
      # гоняет scripts/run-browser-tests.mjs. Локально — то же самое: npm test -- --browser
      - name: Браузерные и сквозные тесты
        run: npm run apps:browser
