name: Browser tests

# Сквозные и браузерные тесты FitTimer. Полный набор идёт на каждом PR (main сразу
# уходит в продакшн), но разбит на параллельные части, у каждой свой сервер.
# Раскладка — scripts/browser-shards.mjs по tests/browser-timings.json.
on:
  pull_request:
    paths: &browser_paths
      - 'packages/core/**'
      - 'apps/fittimer/**'
      - 'package.json'
      - 'scripts/apps.mjs'
      - '.github/workflows/browser-tests.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
  push:
    branches: [main]
    paths: *browser_paths

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Браузер для тестов
        run: |
          npm run setup
          npm --prefix apps/fittimer install --no-save playwright@1.55.0
          cd apps/fittimer && npx playwright install --with-deps chromium && cd ../..
          echo "FIT_CHROME=$(cd apps/fittimer && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      # Собирает dist, на время прогона включает тестовый мост (__FIT_TEST_MODE__,
      # см. scripts/test-bridge.mjs), поднимает tests/dev-server.js и статику,
      # гоняет свою часть scripts/run-browser-tests.mjs. Локально — то же самое:
      # npm test -- --browser (всё) или npm test -- --browser --shard=2/4
      - name: Браузерные и сквозные тесты
        working-directory: apps/fittimer
        run: node scripts/test.mjs --browser --shard=${{ matrix.shard }}/4

  # Одна итоговая проверка с прежним именем: обязательные проверки в настройках
  # репозитория не нужно менять при изменении числа частей.
  browser:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: Все части прошли
        run: test "${{ needs.shard.result }}" = success
