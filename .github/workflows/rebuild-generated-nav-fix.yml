name: Refresh generated navigation artifacts

on:
  push:
    branches:
      - fix/nav-builder-home-20260924

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refresh generated artifacts
        run: |
          node scripts/build-sources.mjs
          node scripts/generate-ai-index.mjs
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- app.js style.css index.html .ai/symbol-index.json; then
            echo "Generated artifacts are already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css index.html .ai/symbol-index.json
          git commit -m "build: refresh generated artifacts [skip vercel]"
          git push
