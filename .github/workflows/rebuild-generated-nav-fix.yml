name: Rebuild generated navigation fix

on:
  push:
    branches:
      - fix/nav-builder-home-20260924

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Rebuild generated frontend
        run: node scripts/build-sources.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet -- app.js style.css index.html; then
            echo "Generated files are already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css index.html
          git commit -m "build: refresh generated sources [skip vercel]"
          git push
