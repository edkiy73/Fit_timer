name: Сборка APK

# Собираем вручную кнопкой и на каждый пуш в main, чтобы всегда был свежий APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK на раннере уже стоит — отдельно ставить нечего
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ключ подписи приезжает из секрета. Нет секрета — соберём debug-вариант:
      # он ставится на телефон так же, но отпечаток не совпадёт с assetlinks.json,
      # и TWA покажет адресную строку вместо полноэкранного режима.
      - name: Разобрать ключ подписи
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fittimer.keystore"
            echo "path=$RUNNER_TEMP/fittimer.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Секрета KEYSTORE_BASE64 нет — собираю debug-вариант"
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать release APK
        if: steps.keystore.outputs.signed == 'yes'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Собрать debug APK
        if: steps.keystore.outputs.signed == 'no'
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Проверить, что APK действительно подписан
        if: steps.keystore.outputs.signed == 'yes'
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: fittimer-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
