name: Android — проверка и сборка

on:
  push:
    branches: [main]
    paths: &mobile_paths
      - 'android/**'
      - 'scripts/build-web.mjs'
      - 'scripts/check-mobile.mjs'
      - 'src/**'
      - 'app.js'
      - 'style.css'
      - 'index.html'
      - 'mobile.js'
      - 'app.config.js'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: "Целый versionCode (должен расти для Google Play)"
        required: true
        default: "1"
      version_name:
        description: "Версия для пользователя"
        required: true
        default: "1.0.0"
  pull_request:
    paths: *mobile_paths

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIT_TIMER_API_URL: ${{ vars.FIT_TIMER_API_URL || 'https://fittimer99.vercel.app' }}
      FIT_TIMER_PUBLIC_URL: ${{ vars.FIT_TIMER_PUBLIC_URL || 'https://fittimer99.vercel.app' }}
      VERSION_CODE: ${{ inputs.version_code || '' }}
      VERSION_NAME: ${{ inputs.version_name || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Версия обычной push-сборки
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "VERSION_CODE=$((260000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Настроить Firebase для remote push
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Firebase config installed"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured; APK will build without remote push"
          fi

      - name: Установить зависимости и синхронизировать Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Разобрать ключ подписи
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Для release-сборки не задан KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fittimer.keystore"
          echo "path=$RUNNER_TEMP/fittimer.keystore" >> "$GITHUB_OUTPUT"

      - name: Проверочная debug-сборка
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release AAB и APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Проверить подпись APK
        if: github.event_name != 'pull_request'
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -Vr | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Выложить debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fittimer-ci-check-not-for-update
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Выложить файлы для Google Play
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fittimer-android-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Подготовить постоянный APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" FitTimer-latest.apk
          node <<'NODE'
          const fs = require('fs');
          const versionCode = Number(process.env.VERSION_CODE);
          const versionName = String(process.env.VERSION_NAME || '');
          if(!Number.isInteger(versionCode) || versionCode < 1 || !versionName){
            throw new Error('Invalid Android release metadata');
          }
          const repo = process.env.GITHUB_REPOSITORY;
          const meta = {
            versionCode,
            versionName,
            apkUrl: `https://github.com/${repo}/releases/download/latest-apk/FitTimer-latest.apk`,
            commit: process.env.GITHUB_SHA || '',
            builtAt: new Date().toISOString()
          };
          fs.writeFileSync('FitTimer-release.json', JSON.stringify(meta, null, 2) + '\n');
          NODE

      - name: Обновить постоянный релиз latest-apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag -y 2>/dev/null || true
          gh release create latest-apk \
            --target "$GITHUB_SHA" \
            --title "FitTimer — последний APK" \
            --notes "Автоматическая release-сборка из main. versionName: $VERSION_NAME | versionCode: $VERSION_CODE | Commit: $GITHUB_SHA"
          gh release upload latest-apk FitTimer-latest.apk FitTimer-release.json --clobber
