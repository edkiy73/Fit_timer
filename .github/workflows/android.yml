name: Android — проверка и сборка

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Целый versionCode (должен расти для Google Play)"
        required: true
        default: "1"
      version_name:
        description: "Версия для пользователя"
        required: true
        default: "1.0.0"
  push:
    branches: ['**']
    paths: &mobile_paths
      - 'android/**'
      - 'scripts/**'
      - 'src/**'
      - 'app.js'
      - 'style.css'
      - 'sw.js'
      - 'index.html'
      - 'mobile.js'
      - 'app.config.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *mobile_paths

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIT_TIMER_API_URL: ${{ vars.FIT_TIMER_API_URL || 'https://fittimer99.vercel.app' }}
      FIT_TIMER_PUBLIC_URL: ${{ vars.FIT_TIMER_PUBLIC_URL || 'https://fittimer99.vercel.app' }}
      VERSION_CODE: ${{ inputs.version_code || '' }}
      VERSION_NAME: ${{ inputs.version_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия обычной push-сборки
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "VERSION_CODE=$((260000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить зависимости и синхронизировать Capacitor
        run: |
          npm ci
          npm run mobile:sync
          npm run check:mobile

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Разобрать ключ подписи
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Для release-сборки не задан KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fittimer.keystore"
          echo "path=$RUNNER_TEMP/fittimer.keystore" >> "$GITHUB_OUTPUT"

      - name: Проверочная debug-сборка
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release AAB и APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Проверить подпись APK
        if: github.event_name != 'pull_request'
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -Vr | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Выложить debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fittimer-ci-check-not-for-update
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Выложить файлы для Google Play
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fittimer-android-${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
