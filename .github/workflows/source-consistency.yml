name: Source parts — consistency

on:
  pull_request:
    paths: ['src/**', 'lib/ai-protocol.js', 'app.js', 'style.css', 'index.html', 'scripts/build-sources.mjs', 'package.json', '.github/workflows/source-consistency.yml']
  push:
    branches: [main]
    paths: ['src/**', 'app.js', 'style.css', 'index.html', 'scripts/build-sources.mjs', 'package.json', '.github/workflows/source-consistency.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Собрать исходники и проверить их
        run: |
          npm run build:sources
          npm run ai:index
          npm run i18n:check
          node --check app.js
