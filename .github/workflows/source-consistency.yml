name: AppBase — all apps consistency

# Проверяет Core и только затронутые приложения (scripts/affected-apps.mjs):
# изменение packages/core или корня — всё; apps/<name> — это приложение; Markdown — ничего.
# The pull_request trigger has no path filter on purpose (security audit 06.11.2026): `check` is a required status of the
# protected `main`, so it must report on every PR, documents-only ones too (those finish fast: nothing is affected).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/ui-react/**'
      - 'apps/**'
      - 'scripts/**'
      - 'templates/**'
      - 'package.json'
      - '.github/workflows/source-consistency.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'


concurrency:
  group: appbase-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            apps/*/package-lock.json

      - name: Install only affected apps
        run: node scripts/apps.mjs setup:affected "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Install Core dependencies
        # `setup:affected` installs apps only; Core's own check (tsc) needs its devDependencies when Core is affected.
        run: npm ci --prefix packages/core --no-audit --no-fund

      - name: Test Vercel deployment filters
        run: node scripts/test-vercel-deployment-policy.mjs

      - name: Verify FitTimer check plan
        run: node scripts/test-fittimer-check-plan.mjs

      - name: Check Core and affected apps
        run: npm run check:affected -- "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Test starter build path filter
        run: node scripts/test-should-build-starter.mjs

      - name: Decide whether to compile generated starter
        id: starter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "build=$(node scripts/should-build-starter.mjs "$BASE")" >> "$GITHUB_OUTPUT"

      - name: Generate and compile clean React starter
        if: steps.starter.outputs.build == 'true'
        run: |
          npm run app:create -- starter-check "Starter Check" com.example.startercheck en
          npm ci --prefix apps/starter-check --no-audit --no-fund
          npm --prefix apps/starter-check run check
