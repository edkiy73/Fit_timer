name: AppBase — all apps consistency

# Проверяет Core и только затронутые приложения (scripts/affected-apps.mjs):
# изменение packages/core или корня — всё; apps/<name> — это приложение; Markdown — ничего.
on:
  pull_request:
    paths: &consistency_paths
      - 'packages/core/**'
      - 'apps/**'
      - 'scripts/**'
      - 'templates/**'
      - 'package.json'
      - '.github/workflows/source-consistency.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
  push:
    branches: [main]
    paths: *consistency_paths

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Core and every app
        run: npm run setup

      - name: Check Core and affected apps
        run: npm run check:affected -- "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
