name: Source parts — consistency

on:
  pull_request:
    paths: ['src/**', 'api/**', 'lib/**', 'tests/**', '.ai/**', 'scripts/**', 'check.py', 'app.js', 'style.css', 'index.html', 'admin.html', 'package.json', 'package-lock.json', '.github/workflows/source-consistency.yml']
  push:
    branches: [main]
    paths: ['src/**', 'api/**', 'lib/**', 'tests/**', '.ai/**', 'scripts/**', 'check.py', 'app.js', 'style.css', 'index.html', 'admin.html', 'package.json', 'package-lock.json', '.github/workflows/source-consistency.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Проверить canonical/generated consistency
        run: |
          npm run check:sources
          npm run check:ai-index
          npm run i18n:check
          npm run build:sources
          node --check app.js
          find api lib tests -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 check.py

      - name: Проверить серверные regression-сценарии
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/sync-api.js
          node tests/auth-abuse.js
          node tests/ai-runtime-unit.js
          node tests/push-unit.js
          node tests/analytics-unit.js
          node tests/analytics-api.js
          node tests/diagnostics-unit.js
          node tests/health-unit.js
          node tests/update-settings-unit.js
          node tests/onboarding-funnel-unit.js
          node tests/ai-recovery-unit.js
          node tests/ai-generation-guards-unit.js
          node tests/motivation-unit.js
          node tests/accessibility-unit.js
          node tests/release-ux-unit.js
          node tests/admin-ui-unit.js
          node tests/vercel-ignore-unit.js

      - name: Проверить AI API админки
        env:
          ADMIN_KEY: testadminkey123456
          GEMINI_API_KEY: test
          AI_TEST_MODE: '1'
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-ai-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/admin-ai-api.js
