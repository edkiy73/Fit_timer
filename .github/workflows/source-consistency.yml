name: AppBase — all apps consistency

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'apps/**'
      - 'scripts/apps.mjs'
      - 'package.json'
      - '.github/workflows/source-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'apps/**'
      - 'scripts/apps.mjs'
      - 'package.json'
      - '.github/workflows/source-consistency.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Core and every app
        run: npm run setup

      - name: Check Core and every app
        run: npm run check
