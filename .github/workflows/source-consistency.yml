name: Source parts — consistency

on:
  pull_request:
    paths: ['packages/core/**', 'apps/fittimer/src/**', 'apps/fittimer/api/**', 'apps/fittimer/lib/**', 'apps/fittimer/config/**', 'apps/fittimer/supabase/**', 'apps/fittimer/tests/**', 'apps/fittimer/.ai/**', 'apps/fittimer/scripts/**', 'apps/fittimer/tsconfig*.json', 'apps/fittimer/app.config.js', 'apps/fittimer/check.py', 'apps/fittimer/app.js', 'apps/fittimer/style.css', 'apps/fittimer/index.html', 'apps/fittimer/admin.html', 'apps/fittimer/admin.js', 'apps/fittimer/package.json', 'apps/fittimer/package-lock.json', '.github/workflows/source-consistency.yml']
  push:
    branches: [main]
    paths: ['packages/core/**', 'apps/fittimer/src/**', 'apps/fittimer/api/**', 'apps/fittimer/lib/**', 'apps/fittimer/config/**', 'apps/fittimer/tests/**', 'apps/fittimer/.ai/**', 'apps/fittimer/scripts/**', 'apps/fittimer/tsconfig*.json', 'apps/fittimer/app.config.js', 'apps/fittimer/check.py', 'apps/fittimer/app.js', 'apps/fittimer/style.css', 'apps/fittimer/index.html', 'apps/fittimer/admin.html', 'apps/fittimer/admin.js', 'apps/fittimer/package.json', 'apps/fittimer/package-lock.json', '.github/workflows/source-consistency.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fittimer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: AppBase Core — typecheck, boundaries, runtime and smoke tests
        working-directory: packages/core
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Установить зависимости для typecheck
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить canonical/generated consistency
        run: |
          npm run typecheck
          npm run build:esm
          node tests/appbase-foundation-unit.js
          npm run test:boundaries
          npm run check:sources
          npm run check:ai-index
          npm run i18n:check
          npm run build:sources
          node --check app.js
          find api lib tests -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 check.py

      - name: Проверить серверные regression-сценарии
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/sync-api.js
          node tests/auth-abuse.js
          node tests/ai-runtime-unit.js
          node tests/infrastructure-adapters-unit.js
          node tests/supabase-shadow-unit.js
          node tests/admin-core-observability-unit.js
          node tests/admin-core-accounts-unit.js
          node tests/admin-core-campaigns-unit.js
          node tests/admin-core-ai-settings-unit.js
          node tests/admin-core-release-unit.js
          node tests/admin-fittimer-catalog-text-unit.js
          node tests/admin-fittimer-catalog-images-unit.js
          node tests/admin-fittimer-catalog-crud-unit.js
          node tests/appbase-ui-core-unit.js
          node tests/appbase-ui-adoption-unit.js
          node tests/appbase-ui-modals-unit.js
          node tests/appbase-ui-brand-unit.js
          node tests/appbase-ui-states-unit.js
          node tests/appbase-core-bundle-unit.js
          node tests/capabilities-unit.js
          node tests/push-unit.js
          node tests/analytics-unit.js
          node tests/analytics-api.js
          node tests/diagnostics-unit.js
          node tests/health-unit.js
          node tests/update-settings-unit.js
          node tests/onboarding-funnel-unit.js
          node tests/ai-recovery-unit.js
          node tests/ai-generation-guards-unit.js
          node tests/motivation-unit.js
          node tests/accessibility-unit.js
          node tests/release-ux-unit.js
          node tests/admin-ui-unit.js
          node tests/vercel-ignore-unit.js
          node tests/ai-protocol-edit-unit.js
          node tests/progression-per-exercise-unit.js

      - name: Проверить AI API админки
        env:
          ADMIN_KEY: testadminkey123456
          GEMINI_API_KEY: test
          AI_TEST_MODE: '1'
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-ai-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/admin-ai-api.js
