name: Source parts — consistency

on:
  pull_request:
    paths: ['src/**', 'api/**', 'lib/**', 'tests/**', 'check.py', 'app.js', 'style.css', 'index.html', 'scripts/build-sources.mjs', 'package.json', '.github/workflows/source-consistency.yml']
  push:
    branches: [main]
    paths: ['src/**', 'api/**', 'lib/**', 'tests/**', 'check.py', 'app.js', 'style.css', 'index.html', 'scripts/build-sources.mjs', 'package.json', '.github/workflows/source-consistency.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Проверить canonical/generated consistency
        run: |
          npm run check:sources
          npm run check:ai-index
          npm run i18n:check
          npm run build:sources
          node --check app.js
          find api lib tests -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 check.py

      - name: Проверить серверную синхронизацию
        run: |
          node tests/dev-server.js 8124 > /tmp/fittimer-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8124/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/sync-api.js
          node tests/auth-abuse.js
          node tests/ai-runtime-unit.js
          node tests/push-unit.js
