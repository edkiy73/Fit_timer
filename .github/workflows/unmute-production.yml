name: UnMute — production readiness

# Проверяет живой https://unmute99.vercel.app: опубликованы ли курс и словарь, подключена ли база.
# Красный — ученик увидит пустое приложение. Тестовая почта и отсутствие ИИ — предупреждения.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/unmute/**'
      - '.github/workflows/unmute-production.yml'
      - '!**/*.md'

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Живой production
        run: node apps/unmute/scripts/check-production.mjs
