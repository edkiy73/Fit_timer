name: Публикация сайта

# TWA открывает сайт по https, поэтому приложение должно где-то лежать.
# Отдаём корень репозитория как есть: сборки у проекта нет, это один index.html
# плюс манифест, service worker, иконки и .well-known/assetlinks.json.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать то, что отдаём
        run: |
          mkdir -p _site/.well-known
          cp index.html manifest.webmanifest sw.js icon-*.png _site/
          cp .well-known/assetlinks.json _site/.well-known/
          ls -R _site

      # enablement: true включает Pages сам, если он ещё не включён в настройках —
      # иначе первый запуск падает с «Get Pages site failed»
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
