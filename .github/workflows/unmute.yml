name: UnMute — e2e

# Сквозной тест настоящей production-сборки UnMute (Vite) в Chromium.
# Typecheck, unit-тесты и сборку делает AppBase consistency (npm run check приложения).
on:
  pull_request:
    paths: &unmute_paths
      - 'packages/core/**'
      - 'packages/ui-react/**'
      - 'apps/unmute/**'
      - '.github/workflows/unmute.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
  push:
    branches: [main]
    paths: *unmute_paths

concurrency:
  group: unmute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Зависимости и браузер
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Проверка реального legacy English
        run: |
          npm run import:legacy -- --dry-run
          npm run test:legacy-parity

      - name: Сборка и e2e
        run: npm run test:browser


  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Dependencies and Capacitor sync
        run: |
          npm ci --no-audit --no-fund
          npm run mobile:sync

      - name: Android debug build
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Android emulator launch smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          working-directory: apps/unmute
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/smoke-android-device.sh


  ios:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Dependencies
        run: npm ci --no-audit --no-fund

      - name: iOS simulator build
        run: npm run check:ios

      - name: iOS simulator launch smoke
        run: bash scripts/smoke-ios-device.sh
