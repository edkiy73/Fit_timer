name: UnMute — e2e

# Сквозной тест настоящей production-сборки UnMute (Vite) в Chromium.
# Typecheck, unit-тесты и сборку делает AppBase consistency (npm run check приложения).
on:
  pull_request:
    paths: &unmute_paths
      - 'packages/core/**'
      - 'packages/ui-react/**'
      - 'apps/unmute/**'
      - '.github/workflows/unmute.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
  push:
    branches: [main]
    paths: *unmute_paths

concurrency:
  group: unmute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Зависимости и браузер
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Проверка реального legacy English
        run: |
          npm run import:legacy -- --dry-run
          npm run test:legacy-parity

      - name: Сборка и e2e
        run: npm run test:browser


  android:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Dependencies and Capacitor sync
        run: |
          npm ci --no-audit --no-fund
          npm run mobile:sync

      - name: Android debug build
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Android emulator
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/avdmanager' | head -n1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          test -n "$AVDMANAGER" && test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$AVDMANAGER" create avd --force --name unmute-smoke --package "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator"             -avd unmute-smoke             -no-window             -no-audio             -no-snapshot             -no-boot-anim             -gpu swiftshader_indirect             >/tmp/unmute-emulator.log 2>&1 &

      - name: Android device launch smoke
        run: bash scripts/smoke-android-device.sh


  ios:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Dependencies
        run: npm ci --no-audit --no-fund

      - name: iOS simulator build
        run: npm run check:ios

      - name: iOS simulator launch smoke
        run: bash scripts/smoke-ios-device.sh
