name: UnMute — e2e

# Сквозной тест настоящей production-сборки UnMute (Vite) в Chromium.
# Typecheck, unit-тесты и сборку делает AppBase consistency (npm run check приложения).
on:
  pull_request:
    paths: &unmute_paths
      - 'packages/core/**'
      - 'packages/ui-react/**'
      - 'apps/unmute/**'
      - '.github/workflows/unmute.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
  push:
    branches: [main]
    paths: *unmute_paths

concurrency:
  group: unmute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Зависимости и браузер
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Сборка и e2e
        run: npm run test:browser
