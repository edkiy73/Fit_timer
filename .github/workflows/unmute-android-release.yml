name: UnMute — APK для установки

# Каждое изменение UnMute в main собирает подписанный release APK и выкладывает его:
# - релиз unmute-latest: UnMute-latest.apk (постоянная ссылка для скачивания) и UnMute-release.json;
# - релиз unmute-apk-archive: неизменяемые UnMute-<versionCode>.apk (последние 20),
#   на них ссылается обновление внутри приложения.
# Подпись — тот же ключ, что у FitTimer (решение владельца 30.09.2026): секреты KEYSTORE_*.
# Ключ подписи нельзя менять: телефон не поставит обновление с другой подписью.
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/ui-react/**'
      - 'apps/unmute/**'
      - '.github/workflows/unmute-android-release.yml'
      - '!**/*.md'
      - '!apps/*/docs/**'
      - '!apps/unmute/tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unmute-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/unmute
    steps:
      - uses: actions/checkout@v7

      - name: Версия сборки
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/unmute/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Зависимости и Capacitor
        run: |
          npm ci --no-audit --no-fund
          npm run mobile:sync

      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Не задан секрет KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android :app:assembleDirectRelease :app:bundlePlayRelease --no-daemon

      - name: Проверить подпись
        run: |
          APK=$(find android/app/build/outputs/apk/direct/release -name '*.apk' | head -1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -Vr | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" UnMute-latest.apk
          cp "$APK" "UnMute-${VERSION_CODE}.apk"
          node <<'NODE'
          const fs = require('fs');
          const versionCode = Number(process.env.VERSION_CODE);
          const versionName = String(process.env.VERSION_NAME || '');
          if(!Number.isInteger(versionCode) || versionCode < 1 || !versionName) throw new Error('bad_version');
          const repo = process.env.GITHUB_REPOSITORY;
          fs.writeFileSync('UnMute-release.json', JSON.stringify({
            versionCode,
            versionName,
            apkUrl: `https://github.com/${repo}/releases/download/unmute-apk-archive/UnMute-${versionCode}.apk`,
            commit: process.env.GITHUB_SHA || '',
            builtAt: new Date().toISOString()
          }, null, 2) + '\n');
          NODE

      - name: Файл для Google Play (AAB)
        uses: actions/upload-artifact@v7
        with:
          name: unmute-play-${{ env.VERSION_NAME }}
          path: apps/unmute/android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Архив версий
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view unmute-apk-archive >/dev/null 2>&1 || gh release create unmute-apk-archive \
            --target "$GITHUB_SHA" \
            --title "UnMute — архив APK" \
            --notes "Неизменяемые APK по versionCode. Обновление внутри приложения качает отсюда ровно опубликованную версию." \
            --latest=false
          gh release upload unmute-apk-archive "UnMute-${VERSION_CODE}.apk" --clobber
          gh release view unmute-apk-archive --json assets --jq '.assets[].name' \
            | grep -E '^UnMute-[0-9]+\.apk$' | sort -t- -k2 -n | head -n -20 \
            | while read -r name; do gh release delete-asset unmute-apk-archive "$name" -y; done

      - name: Постоянная ссылка unmute-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unmute-latest --cleanup-tag -y 2>/dev/null || true
          gh release create unmute-latest \
            --target "$GITHUB_SHA" \
            --title "UnMute — последний APK" \
            --notes "Скачать и установить: UnMute-latest.apk. Версия $VERSION_NAME (versionCode $VERSION_CODE), commit $GITHUB_SHA" \
            --draft --latest=false
          gh release upload unmute-latest UnMute-latest.apk UnMute-release.json --clobber
          gh release edit unmute-latest --draft=false --latest=false
          test "$(gh release view unmute-latest --json isDraft --jq '.isDraft')" = "false"
