<style>
/* Layout: a defect tracker — sticky filter rail on wide screens, one column of issue rows that expand in place; summary strip on top. */
:root{
  --bg:#f6f4f7; --surf:#ffffff; --raise:#efebf2; --line:#e2dce7; --ink:#1d1622; --mute:#6c6274; --faint:#9a90a3;

  --ok:#1f8a5b; --oks:#e2f4ea;
  --font:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(29,22,34,.06),0 4px 16px rgba(29,22,34,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141017; --surf:#1d1722; --raise:#271f2d; --line:#342a3b; --ink:#f1ecf4; --mute:#aa9fb3; --faint:#7d7286;
  --accent:#a78bfa; --accent-ink:#160f1c; --accent-soft:#2c2340;
  --p0:#ff6b85; --p0s:#3a1620; --p1:#ff9a5c; --p1s:#3a2316; --p2:#e8c04a; --p2s:#352c12; --p3:#8fb0d6; --p3s:#1d2836;
  --ok:#56d39a; --oks:#163024; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141017; --surf:#1d1722; --raise:#271f2d; --line:#342a3b; --ink:#f1ecf4; --mute:#aa9fb3; --faint:#7d7286;
  --accent:#a78bfa; --accent-ink:#160f1c; --accent-soft:#2c2340;
  --p0:#ff6b85; --p0s:#3a1620; --p1:#ff9a5c; --p1s:#3a2316; --p2:#e8c04a; --p2s:#352c12; --p3:#8fb0d6; --p3s:#1d2836;
  --ok:#56d39a; --oks:#163024; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:650}
.sub{color:var(--mute);font-size:14px;max-width:72ch}
.mono{font-family:var(--mono);font-size:12.5px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--raise);padding:4px;border-radius:12px;margin:0 0 18px}
nav.tabs button{font:600 14px var(--font);color:var(--mute);background:none;border:0;padding:8px 14px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--mute);font-size:12.5px}
.tile.p0 b{color:var(--p0)}.tile.p1 b{color:var(--p1)}.tile.p2 b{color:var(--p2)}.tile.p3 b{color:var(--p3)}.tile.done b{color:var(--ok)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:860px){aside.filters{position:static;max-height:none}}
.fgrp{display:grid;gap:6px}
.fgrp>label,.fgrp>.lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--font);border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.7;font-size:12px}
input[type=search],select{width:100%;font:15px var(--font);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 13px var(--font);border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer}
.count{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.list{display:grid;gap:10px}
details.iss{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.iss[data-status="fixed"]{opacity:.62}
details.iss>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
details.iss>summary::-webkit-details-marker{display:none}
.pr{font:700 12px var(--mono);border-radius:6px;padding:3px 7px;white-space:nowrap}
.pr.P0{background:var(--p0s);color:var(--p0)}.pr.P1{background:var(--p1s);color:var(--p1)}.pr.P2{background:var(--p2s);color:var(--p2)}.pr.P3{background:var(--p3s);color:var(--p3)}
.st-t{font-weight:600;font-size:15px;line-height:1.35}
.st-m{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.cat{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--raise);color:var(--mute)}
.stat{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.stat.fixed{color:var(--ok)}.stat.wip{color:var(--accent)}.stat.skip{color:var(--faint)}
.body{border-top:1px solid var(--line);padding:14px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px}
@media (max-width:600px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
.kv dt{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv ol,.kv ul{margin:0;padding-left:18px}
.fix{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots button{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--raise);cursor:zoom-in;overflow:hidden;width:150px;height:110px}
.shots img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.status-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status-ctl .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rel a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:12.5px;margin-right:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surf)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;position:sticky;top:0;background:var(--surf)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);max-height:75vh}
.badge{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.badge.checked{background:var(--oks);color:var(--ok)}.badge.partial{background:var(--p2s);color:var(--p2)}.badge.unreachable{background:var(--p0s);color:var(--p0)}.badge.not-checked{background:var(--raise);color:var(--mute)}
.prose{max-width:80ch;display:grid;gap:12px}
.prose p,.prose li{margin:0}
.prose ul,.prose ol{margin:0;padding-left:20px;display:grid;gap:4px}
.phase{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.phase h3{font-size:16px}
.ids{display:flex;flex-wrap:wrap;gap:6px}
.ids a{font:600 12px var(--mono);text-decoration:none;border-radius:6px;padding:2px 6px;background:var(--raise);color:var(--ink)}
dialog#lb{border:0;padding:0;background:transparent;max-width:min(96vw,1400px);max-height:94vh}
dialog#lb::backdrop{background:rgba(10,6,14,.82)}
dialog#lb img{max-width:min(96vw,1400px);max-height:88vh;display:block;border-radius:8px;background:#fff}
dialog#lb .cap{color:#f1ecf4;font-size:13px;padding:8px 2px;display:flex;justify-content:space-between;gap:12px}
dialog#lb button{font:600 13px var(--font);background:#2a2230;color:#f1ecf4;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--surf);border:1px dashed var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

", "section": "Навигация", "component": "Кнопка «‹ Назад» в шапке экранов", "category": "functional", "priority": "P1", "state": "Любая персона, телефон; переходы между вкладками дока", "steps": ["Лента → открыть любую публикацию (F05)", "В доке нажать «Люди»", "В доке нажать «Лента» — открыта та же публикация (стек вкладки сохранён)", "Нажать «‹» в шапке публикации"], "actual": "Открывается вкладка «Люди» (D03), а не лента. Публикация остаётся в стеке ленты: повторное нажатие «Лента» снова показывает её. Кнопка «‹» вызывает `history.back()` — общую историю браузера по всем вкладкам.", "why": "Кнопка «назад» в шапке экрана по общему паттерну мобильных приложений с таб-баром возвращает на предыдущий экран той же вкладки. Переход в другую вкладку неожидан, а «застрявшая» публикация в стеке ленты заставляет нажимать «назад» несколько раз.", "expected": "«‹» в шапке снимает верхний экран со стека текущей вкладки. Системная кнопка «Назад» браузера/Android может идти по общей истории.", "fix": "В обработчике кликов (prototype-v20.html:4069) для `[data-back]` вызывать не обёрнутый `back()`, а локальный возврат: `fallbackBack()` (снятие со стека текущей вкладки) + `navNextReplace=true`, чтобы запись истории заменилась, а не добавилась. Обёртку `back()` с `history.back()` (prototype-v20.html:8055-8059) оставить только для Esc/системного «Назад». Проверить guard несохранённых изменений (confirmLeave) — он уже есть в `fallbackBack`.", "places": ["Все экраны со стрелкой «‹» (F05, P01, E03, C03, H02, P02 и др.) после переключения вкладок"], "related": ["NAV-002"], "screens": [], "verify": "Сценарий из шагов: «‹» возвращает в ленту; повторное нажатие «Лента» показывает корень ленты.", "code": "prototype-v20.html:4069, 8055-8059 back(), 8064 popstate", "source": "lead", "title": "Открывается вкладка «Люди» (D03), а не лента.", "phase_n": 0, "phase": "Этап 1", "order": 4, "status": "open"}, {"id": "NAV-002", "section": "Навигация", "component": "Восстановление прокрутки после «Назад»", "category": "ux", "priority": "P1", "state": "Любая персона, 390 px", "steps": ["Прокрутить Ленту на ~900 px", "Открыть публикацию", "Нажать «‹»", "Аналогично: открыть профиль автора из ленты, прокрутить, вернуться"], "actual": "После возврата лента всегда в самом верху (scrollTop 0 вместо 900). При переключении вкладок дока позиция сохраняется — теряется только при «‹».", "why": "Пользователь теряет место в ленте после каждого открытия поста — это главный сценарий чтения; приходится снова листать.", "expected": "После «‹» экран возвращается к прежней позиции прокрутки (как при смене вкладок).", "fix": "При записи истории сохранять scroll текущего маршрута до копирования навигации: в обёртке `go()` вызывать `saveScroll()` (он вызывает `captureNav`) до `st.push`, а в `restoreNavEntry()` (prototype-v20.html:8060) после `render('back')` выставлять `$('#main .view').scrollTop = cur().scroll`. Если делается NAV-001 (локальный возврат по стеку) — `fallbackBack()` уже рендерит с `dir='back'` и восстанавливает `r.scroll`; проверить, что `r.scroll` записан перед переходом.", "places": ["F01 → F05 → назад", "F01 → P01 → назад", "C01 → E03 → назад", "H01 → H02 → назад (проверить)", "D03 «Симпатии» → P01 → назад"], "related": ["NAV-001"], "screens": [], "verify": "Прокрутить ленту на 900 px, открыть пост, вернуться: scrollTop ≈ 900.", "code": "prototype-v20.html:3872 go(), 8060 restoreNavEntry", "source": "lead", "title": "После возврата лента всегда в самом верху (scrollTop 0 вместо 900).", "phase_n": 0, "phase": "Этап 1", "order": 5, "status": "open"}, {"id": "VIS-002", "section": "Общие компоненты", "component": "Сегмент-табы `.seg` (вкладки внутри экранов)", "category": "ui", "priority": "P1", "state": "Ширина 320–430 px; персоны full/pair", "steps": ["Открыть «Доступы» (P07) на 320 px", "Открыть «Поиск» (G01) на 390 px", "Открыть профиль Mia (P01) на 375 px и прокрутить до вкладок публикаций"], "actual": "Подписи вкладок обрезаются многоточием: P07 — «Открыто … / Открыто … / Мои запр…» (две первые вкладки становятся неразличимы); G01 — «Публ… Сооб… Соб… Инте…» даже на 390–430 px; P01 — «Публика… Активнос… Сообщес…» на 375 px; P03 «Как видят» — «С досту… Знаком…» на 320 px; Лента — «Популярн…» на 320 px.", "why": "Пользователь не понимает, какая вкладка что открывает; в «Доступах» две вкладки читаются одинаково — это функциональная потеря навигации. Компонент `.seg` растягивает 4–6 вкладок в равные колонки без прокрутки.", "expected": "Подпись каждой вкладки читается целиком на 320 px.", "fix": "Ввести единое правило для `.seg` (prototype-v20.html:248-256, 2218-2221): если сумма естественных ширин кнопок больше ширины контейнера — переключать сегмент в режим горизонтальной прокрутки: `.seg.scroll{display:flex;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent)} .seg.scroll button{flex:0 0 auto;padding:0 12px} .seg.scroll .knob{display:none} .seg.scroll button.on{background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.12)}`. Добавлять класс `scroll` в `fitTabCounters()` (prototype-v20.html:3907), когда у любой кнопки `span.scrollWidth > span.clientWidth`. Дополнительно сократить подписи: P07 «Мне открыли / Я открыл(а) / Запросы» → «Ко мне / Мои / Запросы»; G01 убрать вкладку «Всё» из ряда или оставить 4 вкладки: «Люди, Посты, Сообщества, События» + интересы в выдаче «Всё».", "places": ["P07 Доступы (320)", "G01 Поиск (320, 375, 390, 430)", "P01/P08 вкладки публикаций профиля (320, 375)", "P03 Как видят (320)", "F01 Лента «Популярное» (320)", "!topic (тот же профиль)", "X01 вкладки «Я» (см. VIS-003)"], "related": ["VIS-003"], "screens": ["issues/lead/VIS-002-p07-320.webp", "issues/lead/VIS-002-g01-390.webp", "issues/lead/VIS-002-p01-375.webp", "issues/lead/VIS-002-p03-320.webp", "issues/lead/VIS-002-f01-320.webp"], "verify": "На 320/375/390/430 px ни у одной `.seg button>span` нет scrollWidth > clientWidth; активная вкладка видна после переключения.", "code": "prototype-v20.html:248-256, 2218-2221, 3907 fitTabCounters", "source": "lead", "title": "Подписи вкладок обрезаются многоточием: P07 — «Открыто … / Открыто … / Мои запр…» (две первые вкладки…", "phase_n": 0, "phase": "Этап 1", "order": 6, "status": "open"}, {"id": "AUTH-002", "section": "Регистрация и вход", "component": "A04 Профиль → проверка занятости ника", "category": "functional", "priority": "P2", "state": "без сессии, 390px, RU; A04", "steps": ["Дойти до A04", "Ввести ник «kira» (или «leon», «tomeva», «noa», «sofi»)"], "actual": "Показано «Ник свободен», регистрация проходит. Занятыми считаются только ники из списка TAKEN (alex, admin, feture, mia, maya, support, moderator), хотя kira, leon, noa, sofi и пара tomeva — существующие участники.", "why": "Ник — единственный публичный идентификатор; поиск, подарок Premium и приглашение в пару ищут по точному нику (PEOPLE[nick]). Дубликат делает «подарок по точному нику» и приглашение в пару неоднозначными.", "expected": "Ник существующего профиля (любой ключ PEOPLE и ники пар) — «Этот ник уже занят».", "fix": "V.nick (prototype-v20.html:4054): занятость = TAKEN ∪ Object.keys(PEOPLE) ∪ ники пар (без учёта регистра).", "places": ["A04", "редактирование ника в профиле, если использует V.nick"], "related": ["AUTH-001"], "screens": ["issues/auth/a04/nick-kira-free.webp"], "verify": "Ввести kira, Leon, NOA — «Этот ник уже занят».", "code": "prototype-v20.html:4051 TAKEN, 4054 V.nick", "source": "auth", "title": "Показано «Ник свободен», регистрация проходит.", "phase_n": 0, "phase": "Этап 1", "order": 7, "status": "open"}, {"id": "AUTH-004", "section": "Регистрация и вход", "component": "A04 Профиль → чекбокс «Принимаю условия и политику приватности»", "category": "ux", "priority": "P2", "state": "A04, 390px, RU, touch", "steps": ["На A04 нажать на текст строки «Принимаю условия и политику приватности» (середину строки)"], "actual": "Середина строки — это ссылка «условия и политику приватности» (222×18 из 358×42); нажатие открывает лист «Условия и приватность», галочка не ставится. Ссылка вложена в <button role=\"checkbox\"> (вложенный интерактивный элемент).", "why": "Обычный жест «тапнуть по строке, чтобы отметить» открывает лист; пользователь закрывает его и снова попадает по ссылке. Вложенный интерактив ломает скринридеры и Tab-порядок (фокус «chk > terms > chk»).", "expected": "Тап по строке отмечает галочку; условия открываются отдельной явной ссылкой.", "fix": "SC.A04 (5151): вынести ссылку из .check: «Принимаю условия» (вся строка — чекбокс) + отдельная текстовая кнопка «Читать условия» справа или строкой ниже. Не вкладывать <a> внутрь <button>.", "places": ["A04 чекбокс условий"], "related": ["AUTH-017"], "screens": ["issues/auth/AUTH-terms-row-tap.webp"], "verify": "Тап по любому месту строки переключает галочку; условия открываются только отдельной ссылкой.", "code": "prototype-v20.html:5151 SC.A04 (.check data-v=terms)", "source": "auth", "title": "Середина строки — это ссылка «условия и политику приватности» (222×18 из 358×42); нажатие открывает лист…", "phase_n": 0, "phase": "Этап 1", "order": 8, "status": "open"}, {"id": "AUTH-005", "section": "Регистрация и вход", "component": "A03 Код из письма → счётчик попыток", "category": "functional", "priority": "P2", "state": "A03, RU", "steps": ["Дойти до A03", "Ввести 000000 пять раз подряд", "Ввести 000000 ещё раз"], "actual": "Тексты: «Осталось попыток: 4 … 3 … 2 … 1 … 0», затем снова «Осталось попыток: 4». При 0 попытках можно продолжать вводить код, блокировки и предложения запросить новый код нет.", "why": "r.tries=(r.tries||5)-1: при 0 срабатывает «||5» и счётчик сбрасывается. Обещанное ограничение не работает, текст противоречит поведению.", "expected": "После последней попытки поле блокируется: «Попытки закончились. Запроси новый код», кнопка «Отправить ещё раз» сразу активна; новый код сбрасывает счётчик.", "fix": "ACT.checkCode (5140): r.tries=(r.tries??5)-1; при r.tries<=0 — fail с текстом про исчерпанные попытки, disabled на .code input и «Подтвердить», снять таймер у #resend. ACT.resend (5147): r.tries=5.", "places": ["A03"], "related": ["AUTH-006"], "screens": ["issues/auth/a03/wrong-many.webp"], "verify": "6-я неверная попытка блокирует ввод; после «Отправить ещё раз» снова 5 попыток.", "code": "prototype-v20.html:5140 ACT.checkCode", "source": "auth", "title": "Тексты: «Осталось попыток: 4 … 3 … 2 … 1 … 0», затем снова «Осталось попыток: 4».", "phase_n": 0, "phase": "Этап 1", "order": 9, "status": "open"}, {"id": "AUTH-008", "section": "Регистрация и вход", "component": "A01 Приветствие → текст слайдов", "category": "ui", "priority": "P2", "state": "без сессии, light/dark, RU; 390×844, 375×667, 320×568", "steps": ["Открыть A01 на 390×844 и перейти на слайд 03 «Приватность»", "Открыть на 375×667 (слайды 01 и 03) и на 320×568 (все слайды)"], "actual": "Описание слайда обрезано многоточием: на 390×844 слайд 03 «…По умолчанию она…» (90 px текста в 68 px), на 375×667 — слайды 01 и 03, на 320×568 — все 6 слайдов в RU и 5 в EN (clamp 2 строки). Полный текст нигде не доступен.", "why": "На слайдах главный продуктовый смысл (приватность по умолчанию, адрес после одобрения). Комментарий в коде: «Visuals are decorative; the words carry the meaning» — а обрезаются именно слова.", "expected": "Текст слайда всегда виден полностью; ужимается иллюстрация, а не текст.", "fix": "CSS 1852/1859: убрать -webkit-line-clamp у .welcome.wv .w-txt p; вместо этого уменьшать .w-vis (min-height:96–120px на max-height:700px) и/или сократить тексты слайдов до ≤110 символов (RU). Проверить 320×568.", "places": ["A01 слайды 01–06", "320/375/390 px"], "related": ["AUTH-009"], "screens": ["issues/auth/w/A01-slide2.webp", "issues/auth/AUTH-slide-clamp-375.webp", "issues/auth/w/A01-320x568.webp"], "verify": "На 320×568, 375×667, 390×844 у всех слайдов p.scrollHeight<=clientHeight.", "code": "prototype-v20.html:1852, 1859 (.welcome.wv .w-txt p)", "source": "auth", "title": "Описание слайда обрезано многоточием: на 390×844 слайд 03 «…По 320 px.", "fix": "1) Переименовать вкладку по спецификации (см. GEN-001). 2) В правиле `.dock button span` (prototype-v20.html:159, переопределение :1202) убрать `text-overflow:ellipsis`, а для узких экранов добавить `@container stage (max-width:359px){.dock button{font-size:10px;letter-spacing:-.02em}.dock button span{padding:0}}`. Если выбранное название всё равно не помещается в 58 px — использовать короткое «Группы»/«Круги» только в доке, полное — в заголовке экрана. Проверить RU и EN («Community»).", "places": ["Док на всех экранах при ширине 320–359 px (F01, F05, F07, D03, P01, P05, P07, C01, C03, E03, E11, H01, H02, N01, X01, P02, P20, K01, B01, X02, P03, D04 и т. д.)"], "related": ["GEN-001"], "screens": ["issues/lead/VIS-001-dock-320.webp"], "verify": "Матрица 320/360/375 px: ни один `.dock button span` не имеет scrollWidth > clientWidth (RU и EN).", "code": "prototype-v20.html:158-159, 1201-1202", "source": "lead", "title": "Подпись средней вкладки обрезается до «Комьюн…» на каждом экране.", "phase_n": 0, "phase": "Этап 1", "order": 17, "status": "open"}, {"id": "VIS-003", "section": "«Я»", "component": "Вкладки «Профиль / Приватное / Видимость / Моё» с точками", "category": "ui", "priority": "P2", "state": "Персона pair (есть новое на вкладках), 320 и 390 px", "steps": ["Войти персоной «В паре»", "Открыть «Я»", "Посмотреть на ряд вкладок"], "actual": "Красная точка «есть новое» стоит вплотную к следующей подписи («Профиль•Приватное•Видимость»), подписи почти слипаются; «Приватное» обрезано на 8 px уже на 390 px (scrollWidth 82 > clientWidth 74), на 320 px шрифт падает до 12 px.", "why": "Точки читаются как разделители, а не как индикатор; обрезанная подпись на флагманском экране.", "expected": "Точка — в правом верхнем углу подписи с отступом, подписи не обрезаются.", "fix": "Точку позиционировать абсолютно относительно `span` подписи: `.seg button .dot{position:absolute;top:6px;right:4px}` и зарезервировать `padding-right:10px` только у вкладки с точкой; убрать уменьшение шрифта до 12 px. Если не помещается на 320 px — режим прокрутки из VIS-002 или короткие подписи «Профиль / Доступ / Видимость / Моё».", "places": ["X01 «Я» и «Мы» (обе персоны с парой)"], "related": ["VIS-002"], "screens": ["issues/lead/VIS-003-metabs-390.webp", "issues/lead/VIS-003-metabs-320.webp"], "verify": "На 320/390 px подписи вкладок не обрезаны, между точкой и следующей подписью ≥ 6 px.", "code": "prototype-v20.html:248-256", "source": "lead", "title": "Красная точка «есть новое» стоит вплотную к следующей подписи («Профиль•Приватное•Видимость»), подписи почти…", "phase_n": 0, "phase": "Этап 1", "order": 18, "status": "open"}, {"id": "VIS-009", "section": "Чаты", "component": "Шапка диалога (H02)", "category": "ui", "priority": "P2", "state": "Персона pair/full, диалог с Mia, 390/768/1440 px", "steps": ["Открыть Чаты → Mia", "Диалог прокручен к последним сообщениям (по умолчанию)"], "actual": "Шапка диалога прозрачная: сообщения и медиа прокручиваются под именем и просвечивают; подпись «сейчас в сети» (зелёный текст) лежит поверх тёмного фото и почти не читается, над именем виден обрывок текста сообщения («…можно один раз»).", "why": "Имя и статус собеседника — ключевой контекст диалога; наложение текста на текст снижает читаемость и выглядит как баг.", "expected": "Непрозрачная (или с сильным размытием и подложкой) шапка с разделителем, как в других экранах с `.bar.solid`.", "fix": "Для `#main[data-screen=\"H02\"] .bar` задать `background:var(--bg);border-bottom:1px solid var(--line)` (или `backdrop-filter:blur(20px)` + `background:color-mix(in srgb,var(--bg) 88%,transparent)`), а список сообщений начинать с `padding-top` = высота шапки.", "places": ["H02 диалоги (все ширины)", "проверить также C06 обсуждение и F05 публикацию с длинной лентой ответов"], "related": [], "screens": ["issues/lead/VIS-010-chathead-390.webp"], "verify": "При прокрутке сообщений под шапкой текст сообщений не виден; контраст «сейчас в сети» ≥ 4.5:1.", "code": "CSS .bar.solid / H02", "source": "lead", "title": "Шапка диалога прозрачная: сообщения и медиа прокручиваются под именем и просвечивают; подпись «сейчас в…", "phase_n": 0, "phase": "Этап 1", "order": 19, "status": "open"}, {"id": "AUTH-003", "section": "Регистрация и вход", "component": "A04 Профиль → формат ника", "category": "functional", "priority": "P3", "state": "A04, RU", "steps": ["Ввести ник «a..b», «.alex.» или «___»"], "actual": "Все три варианта получают «Ник свободен» и принимаются.", "why": "Ник из одних подчёркиваний или с точками по краям/подряд плохо читается в @-упоминаниях и ссылках, легко имитирует чужие ники.", "expected": "Ник начинается и заканчивается буквой или цифрой, без двух точек подряд, хотя бы одна буква.", "fix": "V.nick (4054): добавить /^[a-z0-9](?:[a-z0-9_]|\\.(?!\\.))*[a-z0-9]$/i и /[a-z]/i; текст ошибки «Начни и закончи буквой или цифрой, без «..»».", "places": ["A04"], "related": ["AUTH-001"], "screens": [], "verify": "a..b, .alex., ___ дают понятную ошибку; alex_b.1 проходит.", "code": "prototype-v20.html:4054", "source": "auth", "title": "Все три варианта получают «Ник свободен» и принимаются.", "phase_n": 0, "phase": "Этап 1", "order": 20, "status": "open"}, {"id": "AUTH-006", "section": "Регистрация и вход", "component": "A03 Код из письма → «Код истёк» и неверный код", "category": "ux", "priority": "P3", "state": "A03, RU", "steps": ["На A03 ввести 999999", "Посмотреть на кнопку повторной отправки", "Ввести 000000"], "actual": "Ошибка «Код истёк. Запроси новый», но кнопка справа серая и неактивна: «Новый код через 20 с». После неверного кода все 6 цифр остаются в полях, фокус стоит на первой — чтобы ввести заново, нужно стереть всё.", "why": "Сообщение просит действие, которое сейчас недоступно. Оставленные неверные цифры замедляют повторный ввод.", "expected": "При истёкшем коде «Отправить ещё раз» активна сразу. После неверного кода поля очищаются, фокус на первой ячейке.", "fix": "ACT.checkCode (5140): при 999999 — r.sent=0 (кнопка активна); при 000000 и 999999 — r.f.code=\"\" перед refresh().", "places": ["A03"], "related": ["AUTH-005"], "screens": ["issues/auth/a03/expired.webp"], "verify": "999999 → кнопка «Отправить ещё раз» активна; 000000 → поля пустые.", "code": "prototype-v20.html:5140", "source": "auth", "title": "Ошибка «Код истёк.", "phase_n": 0, "phase": "Этап 1", "order": 21, "status": "open"}, {"id": "AUTH-007", "section": "Регистрация и вход", "component": "A02 Почта → проверка адреса и лимит отправки", "category": "functional", "priority": "P3", "state": "A02, RU", "steps": ["Ввести «a..b@mail.com», «a@mail..com» или адрес с 80 символами до @ → «Получить код»", "Ввести «limit@mail.com» → «Получить код» несколько раз"], "actual": "Некорректные адреса принимаются, открывается A03. Для limit@ показывается только тост «Слишком много попыток. Новый код можно запросить через 60 секунд»; кнопка остаётся активной, отсчёта нет, при каждом нажатии тот же текст с теми же «60 секунд».", "why": "Код уйдёт на невозможный адрес. Лимит без отсчёта и с исчезающим тостом непонятен: сколько ждать, почему «много попыток» при первой попытке.", "expected": "Валидация отклоняет «..» и локальную часть >64 символов. Лимит — ошибка под полем с живым отсчётом и неактивной кнопкой до конца ожидания.", "fix": "V.email (4053): /^(?!.*\\.\\.)[^\\s@]{1,64}@[^\\s@.]+(\\.[^\\s@.]+)*\\.[^\\s@.]{2,}$/. ACT.sendCode (5104): для limit@ — setErr(\"email\", …) + r.limitUntil=Date.now()+60e3, кнопка disabled с текстом «Получить код через N с».", "places": ["A02 регистрация и вход"], "related": [], "screens": ["issues/auth/a02/limit.webp"], "verify": "a..b@mail.com — ошибка; limit@ — ошибка под полем и отсчёт на кнопке.", "code": "prototype-v20.html:4053 V.email; 5104 ACT.sendCode", "source": "auth", "title": "Некорректные адреса принимаются, открывается A03.", "phase_n": 0, "phase": "Этап 1", "order": 22, "status": "open"}, {"id": "AUTH-009", "section": "Регистрация и вход", "component": "A01 Приветствие → подзаголовок на телефоне", "category": "product", "priority": "P3", "state": "без сессии, телефон (высота ≤700 px и все узкие экраны)", "steps": ["Открыть A01 на 390×844 или 375×667"], "actual": "Подзаголовок «Соцсеть 18+: пиши, обсуждай, приходи на встречи… Знакомства — только если захочешь.» скрыт (display:none) на всех телефонах; виден только на ≥768 px.", "why": "Это единственная фраза, объясняющая, что FetUre — соцсеть, а знакомства опциональны (позиционирование из AGENTS.md). Телефон — основная платформа.", "expected": "Короткая версия позиционирования видна на телефоне.", "fix": "CSS 1764–1765: не скрывать .w-sub, а показывать короткий вариант (L(«Соцсеть 18+. Знакомства — только если захочешь.»)) с font-size:14px; освободить место за счёт .w-vis.", "places": ["A01"], "related": ["AUTH-008"], "screens": ["issues/auth/w/A01-fresh.webp"], "verify": "На 375×667 под заголовком видна строка позиционирования.", "code": "prototype-v20.html:1764-1765", "source": "auth", "title": "Подзаголовок «Соцсеть 18+: пиши, обсуждай, приходи на встречи… Знакомства — только если захочешь.» скрыт…", "phase_n": 0, "phase": "Этап 1", "order": 23, "status": "open"}, {"id": "AUTH-011", "section": "Регистрация и вход", "component": "A04 Профиль → дата рождения", "category": "ux", "priority": "P3", "state": "A04, RU", "steps": ["Открыть список «Год»", "Выбрать 31 + февраля", "Выбрать дату в будущем или возраст <18 и посмотреть подсказку до нажатия «Дальше»"], "actual": "Годы только с 2026 по 1937 (90 значений): человеку 90+ не зарегистрироваться, а проверка «Проверь год рождения» (>110) недостижима. В списке дней всегда 31 день. Ошибки «Такой даты нет», «Дата из будущего» появляются только после «Дальше» вместе с тостом «Проверь отмеченные поля»; для корректной даты сразу видно «Тебе 36.», для неверной — ничего.", "why": "Нелогичный диапазон и запаздывающая обратная связь в обязательном поле.", "expected": "Годы: от (текущий−18) до (текущий−100), U18 по-прежнему ловится по дате; дни ограничены месяцем; ошибка даты показывается сразу при выборе всех трёх значений.", "fix": "SC.A04 (5151): yy — Array.from({length:83},(_,i)=>yNow-18-i) (если нужно ловить U18 — оставить до yNow-13); dd — число дней по mm/yy; CH.dob (5168) — вызывать V.dob и setErr при заполненных трёх значениях.", "places": ["A04"], "related": [], "screens": ["issues/auth/a04/feb31.webp", "issues/auth/a04/future.webp"], "verify": "31 февраля нельзя выбрать; «Дата из будущего» видно без нажатия «Дальше».", "code": "prototype-v20.html:5151 SC.A04, 4057 V.dob", "source": "auth", "title": "Годы только с 2026 по 1937 (90 значений): человеку 90+ не зарегистрироваться, а проверка «Проверь год…", "phase_n": 0, "phase": "Этап 1", "order": 24, "status": "open"}, {"id": "AUTH-012", "section": "Регистрация и вход", "component": "A02 → листы «Вход через Apple / Google»", "category": "ux", "priority": "P3", "state": "A02 режим «Регистрация», RU", "steps": ["A01 → «Создать аккаунт» → «Продолжить с Apple»", "То же с Google"], "actual": "В режиме регистрации листы называются «Вход через Apple» / «Вход через Google». Кнопка Apple — «Продолжить с Face ID» на любом устройстве (веб, Android, ноутбук).", "why": "Пользователь регистрируется, а видит «Вход»; Face ID есть только на iPhone/iPad.", "expected": "Нейтральное «Продолжить с Apple / Google»; кнопка Apple — «Продолжить» (Face ID только в iOS-оболочке).", "fix": "ACT.oauth (5110): title — L(«Продолжить с Apple»…) / «Продолжить с Google»; foot — L(«Продолжить»,«Continue») с иконкой Apple.", "places": ["A02 Apple", "A02 Google"], "related": [], "screens": ["issues/auth/a02/apple-sheet.webp", "issues/auth/a02/google-sheet.webp"], "verify": "В обоих режимах заголовок без слова «Вход».", "code": "prototype-v20.html:5110 ACT.oauth", "source": "auth", "title": "В режиме регистрации листы называются «Вход через Apple» / «Вход через Google».", "phase_n": 0, "phase": "Этап 1", "order": 25, "status": "open"}, {"id": "AUTH-013", "section": "Регистрация и вход", "component": "A02 Вход → какой аккаунт открывается", "category": "product", "priority": "P3", "state": "A02 режим «Вход», RU", "steps": ["A01 → «У меня уже есть аккаунт»", "Ввести someone@mail.com → код 123456", "Отдельно: «Продолжить с Apple» в режиме «Вход»"], "actual": "Любая почта входит в аккаунт Alex (тост «С возвращением, Alex», в K06 почта alex@mail.com). Apple в режиме «Вход» всегда говорит «Аккаунта с этой почтой ещё нет — создадим новый», Google «Новый аккаунт» — то же. Для почты такого сценария нет.", "why": "Симуляция противоречит сама себе: Google/Apple различают новый и существующий аккаунт, а почта — нет; с неизвестной почтой пользователь оказывается в чужом профиле.", "expected": "Почта, отличная от alex@mail.com (или из списка QA), в режиме «Вход» ведёт на тот же путь, что Google «Новый аккаунт»: тост «Аккаунта с этой почтой ещё нет — создадим новый» и переход в A04. Подсказку добавить в QA-панель.", "fix": "ACT.checkCode (5140): if(r.p.mode===\"in\"&&!/^alex@/i.test(r.p.email)){toast(«Аккаунта … ещё нет»);go(\"A04\",{email,via:\"email\"});return;}", "places": ["A02/A03 вход по почте"], "related": [], "screens": ["issues/auth/a02/email-signin-result.webp"], "verify": "Вход с someone@mail.com ведёт на A04 с тостом; alex@mail.com — в аккаунт Alex.", "code": "prototype-v20.html:5140", "source": "auth", "title": "Любая почта входит в аккаунт Alex (тост «С возвращением, Alex», в K06 почта alex@mail.com).", "phase_n": 0, "phase": "Этап 1", "order": 26, "status": "open"}, {"id": "AUTH-014", "section": "Регистрация и вход", "component": "A04 / A05 → индикатор шагов", "category": "ui", "priority": "P3", "state": "A04, A05 шаг 1 и 2, 390px", "steps": ["Пройти A04 → A05 шаг 1 → шаг 2"], "actual": "Прогресс показан дважды: таблетка «1 / 3» в шапке и полоска из трёх сегментов под ней. Заголовки устроены по-разному: A04 и шаг 2 — крупный h2 в теле («Как тебя называть», «Что тебе интересно?»), шаг 1 — маленький заголовок «О тебе» в шапке, без h2.", "why": "Дублиров d": [], "screens": ["issues/lead/RESP-003-f07-320.webp"], "verify": "На 320 px у `.bar h1` scrollWidth ≤ clientWidth.", "code": "SC.F07 bar()", "source": "lead", "title": "Заголовок обрезается до «Новая публи…» из-за кнопки-пилюли «В черновик».", "phase_n": 0, "phase": "Этап 1", "order": 30, "status": "open"}, {"id": "VIS-004", "section": "Общие компоненты", "component": "Кнопка «Создать» (+)", "category": "ui", "priority": "P3", "state": "390 px, любая персона", "steps": ["Открыть Ленту — красная «+» в строке «Что у тебя нового?»", "Открыть «Комьюнити → События» — красная «+» рядом с «Мои события»"], "actual": "Две разные кнопки с одной функцией «создать»: в ленте и в сообществе 38×38 px, радиус 12 px; в «Комьюнити» (Сообщества и События) 52×52 px, радиус 18 px.", "why": "Один и тот же смысл — разные размеры и формы; визуальная несогласованность.", "expected": "Единый компонент «добавить» одного размера на всех экранах.", "fix": "Оставить один вариант `.ibtn.add` 44×44, радиус var(--r) (14 px). Удалить переопределения `.composer .ibtn.add` (prototype-v20.html:665) и `.myev .ibtn.add` (824, 2195) либо привести их к 44 px. В «Комьюнити» строку «Мои события + » выровнять по высоте 44 px.", "places": ["F01 Лента (композер)", "C03 сообщество «Начать обсуждение»", "C01 «Создать событие»", "C01 «Создать сообщество»"], "related": [], "screens": ["issues/lead/VIS-004-feed-create.webp", "issues/lead/VIS-004-comm-create.webp"], "verify": "Метрика: все `.ibtn.add` одинакового размера и радиуса.", "code": "prototype-v20.html:146, 665, 824, 2195", "source": "lead", "title": "Две разные кнопки с одной функцией «создать»: в ленте и в сообществе 38×38 px, радиус 12 px; в «Комьюнити»…", "phase_n": 0, "phase": "Этап 1", "order": 31, "status": "open"}, {"id": "VIS-005", "section": "Общие компоненты", "component": "Аватары `.av` — шкала размеров", "category": "ui", "priority": "P3", "state": "Все экраны, 390 px", "steps": ["Сравнить аватары в ленте, уведомлениях, профиле, чате, паре"], <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const ISS=D.issues, $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='feture-v20-audit-status';
let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){ST={};}
const saveST=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}};
const STATUS=[['open','Открыто'],['wip','В работе'],['fixed','Исправлено'],['skip','Отложено']];
const stOf=i=>ST[i.id]||i.status||'open';
const CAT={functional:'Функциональная',ux:'UX',ui:'UI',product:'Продуктовая'};
const PRI=['P0','P1','P2','P3'];
const F={pri:new Set(),cat:new Set(),stat:new Set(),sec:new Set(),q:''};
$('#lead').textContent=D.meta.lead;
function strip(){const c=p=>ISS.filter(i=>i.priority===p).length;const done=ISS.filter(i=>stOf(i)==='fixed').length;
 $('#strip').innerHTML=[['Всего проблем',ISS.length,''],['P0 · блокеры',c('P0'),'p0'],['P1 · серьёзные',c('P1'),'p1'],['P2 · заметные',c('P2'),'p2'],['P3 · полировка',c('P3'),'p3'],['Исправлено',done+' / '+ISS.length,'done'],['Экранов и попапов',D.meta.coverageCount,'']].map(([l,n,k])=>`<div class="tile ${k}"><b>${n}</b><span>${l}</span></div>`).join('');}
function chips(el,items,set){el.innerHTML=items.map(([v,l,n])=>`<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(l)}${n!=null?` <em>${n}</em>`:''}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));render();};}
function buildFilters(){
 chips($('#fPri'),PRI.map(p=>[p,p,ISS.filter(i=>i.priority===p).length]),F.pri);
 chips($('#fCat'),Object.entries(CAT).map(([k,l])=>[k,l,ISS.filter(i=>i.category===k).length]),F.cat);
 chips($('#fStat'),STATUS.map(([k,l])=>[k,l,ISS.filter(i=>stOf(i)===k).length]),F.stat);
 const secs=[...new Set(ISS.map(i=>i.section))].sort((a,b)=>a.localeCompare(b,'ru'));
 chips($('#fSec'),secs.map(s=>[s,s,ISS.filter(i=>i.section===s).length]),F.sec);
}
const shotUrl=s=>D.meta.shotBase+s;
function issueHTML(i){const s=stOf(i);
 const li=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'—';
 return `<details class="iss" id="${esc(i.id)}" data-status="${s}"><summary><span class="pr ${i.priority}">${i.priority}</span><span><span class="st-t">${esc(i.title||i.component)}</span><span class="st-m"><span class="mono">${esc(i.id)}</span><span>${esc(i.section)}</span><span class="cat">${CAT[i.category]||esc(i.category)}</span>${i.screens?.length?`<span>скриншотов: ${i.screens.length}</span>`:''}</span></span><span class="stat ${s}">${STATUS.find(x=>x[0]===s)[1]}</span></summary>
 <div class="body">
  <dl class="kv">
   <dt>Компонент</dt><dd>${esc(i.component)}</dd>
   <dt>Состояние</dt><dd>${esc(i.state)}</dd>
   <dt>Шаги</dt><dd>${i.steps?.length?`<ol>${i.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'—'}</dd>
   <dt>Сейчас</dt><dd>${esc(i.actual)}</dd>
   <dt>Почему плохо</dt><dd>${esc(i.why)}</dd>
   <dt>Как должно быть</dt><dd>${esc(i.expected)}</dd>
   <dt>Исправление</dt><dd class="fix">${esc(i.fix)}</dd>
   <dt>Где ещё</dt><dd>${li(i.places)}</dd>
   <dt>Проверка</dt><dd>${esc(i.verify)}</dd>
   ${i.code?`<dt>Код</dt><dd class="mono">${esc(i.code)}</dd>`:''}
   ${i.related?.length?`<dt>Связано</dt><dd class="rel">${i.related.map(r=>ISS.some(x=>x.id===r)?`<a href="#${esc(r)}" data-jump="${esc(r)}">${esc(r)}</a>`:`<span class="mono">${esc(r)}</span> `).join('')}</dd>`:''}
   ${i.phase?`<dt>Этап плана</dt><dd>${esc(i.phase)}</dd>`:''}
  </dl>
  ${i.screens?.length?`<div class="shots">${i.screens.map((s,k)=>`<button type="button" data-shot="${esc(i.id)}" data-k="${k}" aria-label="Скриншот ${k+1}"><img loading="lazy" src="${esc(shotUrl(s))}" alt="${esc(i.id)} — скриншот ${k+1}"></button>`).join('')}</div>`:''}
  <div class="status-ctl"><span class="stat">Статус:</span>${STATUS.map(([k,l])=>`<button type="button" class="chip" data-setst="${k}" data-id="${esc(i.id)}" aria-pressed="${s===k}">${l}</button>`).join('')}</div>
 </div></details>`;}
function sorted(list){const v=$('#sort').value;const pi=p=>PRI.indexOf(p);
 return [...list].sort((a,b)=>v==='id'?a.id.localeCompare(b.id):v==='sec'?a.section.localeCompare(b.section,'ru')||pi(a.priority)-pi(b.priority):v==='plan'?(a.order??999)-(b.order??999):pi(a.priority)-pi(b.priority)||(a.order??999)-(b.order??999));}
function match(i){if(F.pri.size&&!F.pri.has(i.priority))return false;if(F.cat.size&&!F.cat.has(i.category))return false;if(F.stat.size&&!F.stat.has(stOf(i)))return false;if(F.sec.size&&!F.sec.has(i.section))return false;
 if(F.q){const t=[i.id,i.title,i.section,i.component,i.actual,i.fix,i.state,(i.places||[]).join(' '),i.code].join(' ').toLowerCase();return F.q.split(/\s+/).every(w=>t.includes(w));}return true;}
function render(){const l=sorted(ISS.filter(match));$('#count').textContent=`Показано ${l.length} из ${ISS.length}`;$('#list').innerHTML=l.length?l.map(issueHTML).join(''):'<div class="empty">Нет проблем под эти фильтры.</div>';}
$('#q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();render();};
$('#sort').onchange=render;
$('#clearF').onclick=()=>{F.pri.clear();F.cat.clear();F.stat.clear();F.sec.clear();F.q='';$('#q').value='';buildFilters();render();};
$('#expandAll').onclick=e=>{const open=e.target.dataset.open!=='1';document.querySelectorAll('#list details').forEach(d=>d.open=open);e.target.dataset.open=open?'1':'0';e.target.textContent=open?'Свернуть все':'Раскрыть все';};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-setst]');if(b){ST[b.dataset.id]=b.dataset.setst;saveST();const d=b.closest('details');const keep=d.open;strip();buildFilters();const html=issueHTML(ISS.find(i=>i.id===b.dataset.id));d.outerHTML=html;const nd=document.getElementById(b.dataset.id);if(nd)nd.open=keep;return;}
 const j=e.target.closest('[data-jump]');if(j){e.preventDefault();show('issues');F.pri.clear();F.cat.clear();F.stat.clear();F.sec.clear();F.q='';$('#q').value='';buildFilters();render();const d=document.getElementById(j.dataset.jump);if(d){d.open=true;d.scrollIntoView({block:'start'});}return;}
 const s=e.target.closest('[data-shot]');if(s){openLb(s.dataset.shot,+s.dataset.k);}
});
let LB=null;function openLb(id,k){const i=ISS.find(x=>x.id===id)||D.popupShots?.[id];const list=i.screens||i;LB={list,k,id};drawLb();$('#lb').showModal();}
function drawLb(){const s=LB.list[LB.k];$('#lbImg').src=shotUrl(s);$('#lbCap').textContent=`${LB.id} · ${LB.k+1}/${LB.list.length} · ${s}`;}
$('#lbClose').onclick=()=>$('#lb').close();$('#lbPrev').onclick=()=>{LB.k=(LB.k-1+LB.list.length)%LB.list.length;drawLb();};$('#lbNext').onclick=()=>{LB.k=(LB.k+1)%LB.list.length;drawLb();};
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').close();});
document.addEventListener('keydown',e=>{if(!$('#lb').open)return;if(e.key==='ArrowRight')$('#lbNext').click();if(e.key==='ArrowLeft')$('#lbPrev').click();});
$('#exportBtn').onclick=async()=>{const txt=JSON.stringify(Object.fromEntries(ISS.map(i=>[i.id,stOf(i)])),null,1);try{await navigator.clipboard.writeText(txt);$('#exportBtn').textContent='Скопировано';}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();$('#exportBtn').textContent='Выделено — нажми Ctrl/Cmd+C';}setTimeout(()=>$('#exportBtn').textContent='Скопировать статусы',2500);};
let resetArm=false;$('#resetBtn').onclick=e=>{if(!resetArm){resetArm=true;e.target.textContent='Точно сбросить?';setTimeout(()=>{resetArm=false;e.target.textContent='Сбросить статусы';},3000);return;}ST={};saveST();resetArm=false;e.target.textContent='Сбросить статусы';strip();buildFilters();render();};
// other views
function plan(){$('#view-plan').innerHTML=`<div class="prose" style="max-width:none">${D.plan.map(p=>`<div class="phase"><h3>${esc(p.title)}</h3><p class="sub">${esc(p.text)}</p><div class="ids">${p.ids.map(id=>{const i=ISS.find(x=>x.id===id);return i?`<a href="#${esc(id)}" data-jump="${esc(id)}" title="${esc(i.title||i.component)}">${esc(id)} · ${i.priority}</a>`:'';}).join('')}</div></div>`).join('')}</div>`;}
function popups(){const P=D.popups;$('#view-popups').innerHTML=`<p class="sub" style="margin-bottom:12px">${esc(D.meta.popupLead)}</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Попап / меню / диалог</th><th>Тип</th><th>Где открывается</th><th>Чем открывается</th><th>Кнопок</th><th>Персоны</th><th>Проверка</th><th>Проблемы</th></tr></thead><tbody>${P.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.kind)}</td><td class="mono">${esc((p.from||[]).join(', '))}</td><td>${esc((p.via||[]).join('; '))}</td><td>${p.controls??''}</td><td>${esc((p.personas||[]).join(', '))}</td><td><span class="badge ${esc(p.status||'checked')}">${esc(p.statusLabel||p.status||'')}</span></td><td class="ids">${(p.issues||[]).map(id=>`<a href="#${esc(id)}" data-jump="${esc(id)}">${esc(id)}</a>`).join('')}</td></tr>`).join('')}</tbody></table></div>`;}
function coverage(){const C=D.coverage;$('#view-coverage').innerHTML=`<p class="sub" style="margin-bottom:12px">${esc(D.meta.coverageLead)}</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Тип</th><th>ID</th><th>Название</th><th>Как открыть</th><th>Персоны</th><th>Статус</th><th>Заметки</th><th>Проблемы</th></tr></thead><tbody>${C.map(c=>`<tr><td>${esc(c.type)}</td><td class="mono">${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.opened_by)}</td><td>${esc((c.personas||[]).join(', '))}</td><td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td><td>${esc(c.notes)}</td><td class="ids">${(c.issues||[]).map(id=>`<a href="#${esc(id)}" data-jump="${esc(id)}">${esc(id)}</a>`).join('')}</td></tr>`).join('')}</tbody></table></div>`;}
function overview(){$('#view-overview').innerHTML=`<div class="prose">${D.overviewHTML}</div>`;}
function show(v){document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));document.querySelectorAll('section[id^=view-]').forEach(s=>s.hidden=s.id!=='view-'+v);try{localStorage.setItem(KEY+'-tab',v);}catch(e){}}
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.view);};
strip();buildFilters();render();plan();popups();coverage();overview();
const h=(location.hash||'').slice(1);
if(h&&document.getElementById(h)&&ISS.some(i=>i.id===h)){const d=document.getElementById(h);d.open=true;d.scrollIntoView();}
else if(['plan','popups','coverage','overview','issues'].includes(h))show(h);
else{let t=null;try{t=localStorage.getItem(KEY+'-tab');}catch(e){}if(t)show(t);}
})();
</script>
