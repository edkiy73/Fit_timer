function bottom(active){const a=[['home','Я','user'],['explore','Исследовать','compass'],['community','Сообщество','users'],['people','Знакомства','heart']];return `<nav class="bottom">${a.map(([id,t,i])=>`<button class="${active===id?'active':''}" data-go="${id}" aria-label="${t}">${ic(i)}<span>${t}</span></button>`).join('')}</nav>`}
function button(txt,action='noop',klass='primary'){return `<button class="btn ${klass}" data-action="${action}">${txt}</button>`}

function content(sc,html,active){return html+(active?bottom(active):'')}
function jarColor(cat){return CATS[cat]?.color||'#e72c58'}
function jar(id){const [ci]=id.split('-').map(Number),name=FLAT.find(x=>x.id===id)?.name||'Тема',rec=PERSIST.interests[id]||{},status=rec.status||'unknown';const level=Number(rec.level)||0;const b=['boundary','dislike','unknown','neutral'].includes(status)?status==='neutral'?'unknown':status:status;const val=b==='boundary'?'×':b==='dislike'?'—':b==='unknown'?'?':`${level}%`;const statusTxt=STATUS.find(a=>a[0]===status)?.[1]||'Не изучено';return `<button class="jar-entry" data-interest="${id}" title="${esc(name)} — ${esc(statusTxt)}"><div class="jar-vessel ${b}" style="--fill:${level}%;--jar:${jarColor(ci)}">${!['boundary','dislike','unknown'].includes(b)?`<span class="jar-fill"></span>`:''}<span class="jar-number">${val}</span></div><span class="jlabel">${esc(name)}</span></button>`}

function panel(screen){const panelText={welcome:['Пространство, где можно быть собой','Познание себя и сообщество — основа продукта. Знакомства не обязательны.'],home:['Мой мир — центральный экран','Карта интересов пополняется после тестов и ручного исследования. Личные данные контролирует владелец.'],explore:['Исследование не заканчивается','12 направлений, 144 темы и 18 тематических тестов. Интерес — это не диагноз и не характеристика личности.'],community:['Люди важнее свайпов','Лента, сообщества, обсуждения, подписки и мероприятия дают повод вернуться без дейтинга.'],people:['Знакомства — третья опора','Карточки как в первой версии: фото, прокрутка подробного профиля внутри карточки, лайк, запрос доступа и чат.']};const t=panelText[screen]||['Связанная система','Исследование, приватность и общение работают вместе.'];document.getElementById('right-panel').innerHTML=`<div class="panel-kicker">MVP · концепция 3.0</div><h2>${t[0]}</h2><p>${t[1]}</p><div class="panel-card"><strong>144</strong><br><span>темы в 12 направлениях</span><div style="border-top:1px solid #594056;margin:14px 0"></div><strong>18</strong><br><span>тематических тестов</span></div><p>Все экраны связаны. Изменения интересов, подписки, записи и пройденные тесты сохраняются локально в браузере.</p><button class="panel-button" data-action="reset">Сбросить демоданные</button>`}

function home(){const n=Object.keys(PERSIST.interests).filter(x=>PERSIST.interests[x]?.status!=='neutral').length,done=Object.keys(PERSIST.tests).length;const sample=Object.keys(PERSIST.interests).slice(0,8);return content('home',headerHtml('Мой мир',false,`<button class="head-btn" data-go="settings" aria-label="Настройки">${ic('settings')}</button>`)+`<div class="scroll"><div class="flex" style="margin:3px 0 15px">${photo(1,'avatar')}<div class="grow"><div class="name">Alex <span class="pill verified">18+ · демопрофиль</span></div><div class="tiny">У тебя своя история — и свой темп</div></div><button class="head-btn" data-go="profile" aria-label="Мой профиль">${ic('chevron')}</button></div><button class="profile-hero" style="width:100%;text-align:left" data-go="map">${photo(5)}<div class="copy"><div style="font-size:10px;color:#fbc8db;font-weight:800">МОЯ ЛИЧНАЯ КАРТА</div><h2>Больше, чем анкета.</h2><p>Интересы, опыт, вопросы и новые открытия ${ic('chevron','sm')}</p></div></button><div class="summary-strip"><div><strong>${n}</strong><span>исследовано</span></div><div><strong>${done}</strong><span>тестов</span></div><div><strong>${Object.keys(PERSIST.joined).filter(k=>PERSIST.joined[k]).length}</strong><span>сообществ</span></div></div><div class="card"><div class="flex"><span class="round-mark">${ic('sparkle')}</span><div class="grow"><strong style="font-size:12px">Твоя карта только начинается</strong><p class="tiny" style="margin:4px 0 0">${n} из ${FLAT.length} тем отмечены. Ты сам решаешь, что это значит.</p></div></div><div class="progressbar" style="margin:13px 0"><span style="width:${n/FLAT.length*100}%"></span></div><button class="btn dark" data-go="map">Исследовать мою карту ${ic('chevron')}</button></div>${section('Мои баночки','map','Смотреть карту')}${jars(sample)}<div class="jar-key"><span><i style="background:#b382c7"></i>Интерес</span><span><i style="background:#e4a6b2"></i>Граница</span><span><i style="background:#d6cad3"></i>Не изучено</span></div>${section('Продолжить исследование','tests','Все тесты')}<div class="banner"><span class="eyebrow">ТЕСТ · 8 ВОПРОСОВ</span><strong>Где проходят мои границы?</strong><p>Исследуй свои предпочтения без оценок и чужих ожиданий.</p><button class="btn soft small" data-action="launchQuiz" data-id="9">Пройти тест ${ic('chevron','sm')}</button></div>${section('Твои сообщества','community','В ленту')}<div class="card"><div class="flex"><span class="round-mark mint">${ic('users')}</span><div class="grow"><strong style="font-size:12px">Люди, с которыми можно быть собой</strong><p class="tiny" style="margin:5px 0 0">Вступай в группы, делись опытом и задавай вопросы.</p></div></div><button class="btn soft" style="margin-top:12px" data-go="community">Открыть сообщество</button></div><div style="height:15px"></div></div>`,'home')}
function mapScreen(){const total=Object.keys(PERSIST.interests).length;return content('map',headerHtml('Моя карта',true,`<button class="head-btn" data-go="access">${ic('shield')}</button>`)+`<div class="scroll"><div class="topic-banner" style="background:linear-gradient(125deg,#28152a,#79518b)"><div class="eyebrow" style="color:#f6b8d1">ЛИЧНАЯ КАРТА</div><h2>${total} интересов исследовано</h2><p>Ни один интерес не делает тебя «правильным» или «неправильным». Это лишь твоя текущая карта — она может меняться.</p><div class="progressbar" style="background:#ffffff2a"><span style="width:${total/FLAT.length*100}%"></span></div></div><div class="section">Направления <span class="sub">${CATS.length} категорий</span></div>${CATS.map((c,i)=>{const n=c.items.filter((_,j)=>PERSIST.interests[`${i}-${j}`]).length;return `<button class="category" data-category="${i}"><div class="category-icon" style="--cat:${c.color};--catbg:${c.bg}">${ic(c.icon,'lg')}</div><div class="grow"><strong>${esc(c.title)}</strong><small>${n} из ${c.items.length} изучено</small><div class="progressbar" style="margin-top:7px;height:4px"><span style="width:${n/c.items.length*100}%;background:${c.color}"></span></div></div><span class="end">${ic('chevron')}</span></button>`}).join('')}<div class="section">Твоя история</div><div class="card"><div class="flex"><span class="round-mark coral">${ic('clock')}</span><div class="grow"><strong style="font-size:12px">Карта меняется вместе с тобой</strong><div class="tiny">Проходи тесты повторно, чтобы сравнить ответы.</div></div></div><button class="btn soft" style="margin-top:12px" data-go="tests">Перейти к тестам</button></div></div>`)}
function explore(){return content('explore',headerHtml('Исследовать',false,`<button class="head-btn" data-go="tests" aria-label="Тесты">${ic('spark')}</button>`)+`<div class="scroll"><div class="h2">Твой путь открытий</div><p class="lead">Никаких готовых ярлыков. Выбирай темы, исследуй опыт других и постепенно формируй свою карту.</p><button class="feature-tile" style="width:100%;text-align:left" data-go="tests">${photo(7)}<div class="text"><span class="eyebrow" style="color:#ffb4cc">18 ИССЛЕДОВАНИЙ</span><strong>Узнать себя<br>чуть глубже</strong><p>Короткие и большие тесты с результатами в личной карте.</p><span class="pill" style="background:#fff;color:#231423">Выбрать тест ${ic('chevron','sm')}</span></div></button><div class="search-wrap">${ic('search')}<input class="text-input" id="catalogSearch" placeholder="Поиск по 144 темам" aria-label="Поиск интересов" value="${esc(V.catFilter)}"></div>${section('Все направления','','')}${CATS.map((c,i)=>`<button class="category" data-category="${i}"><div class="category-icon" style="--cat:${c.color};--catbg:${c.bg}">${ic(c.icon,'lg')}</div><div class="grow"><strong>${esc(c.title)}</strong><small>${c.items.length} тем · ${c.items.filter((_,j)=>PERSIST.interests[`${i}-${j}`]).length} исследовано</small></div><span class="end">${ic('chevron')}</span></button>`).join('')}<div class="card" style="margin-top:12px"><div class="flex"><span class="round-mark">${ic('book')}</span><div class="grow"><strong>Словарь без неловких вопросов</strong><p class="tiny" style="margin:4px 0 0">Нажми на любой интерес, чтобы увидеть объяснение, варианты и публикации.</p></div></div></div></div>`,'explore')}
function catalogSearch(){const q=(V.catFilter||'').toLowerCase().trim();const matches=FLAT.filter(x=>x.name.toLowerCase().includes(q));return content('search',headerHtml('Поиск интересов',true)+`<div class="scroll"><div class="search-wrap">${ic('search')}<input class="text-input" id="catalogSearch" value="${esc(V.catFilter)}" autofocus placeholder="Название темы"></div><div class="section">Найдено: ${matches.length}</div><div class="topic-list">${matches.slice(0,80).map(x=>`<button class="topic-item ${PERSIST.interests[x.id]?'known':''}" data-interest="${x.id}"><span>${PERSIST.interests[x.id]?'<i class="dot"></i>':''}${esc(x.name)}</span><small>${esc(CATS[x.cat].title)}</small></button>`).join('')}</div></div>`)}
function categoryScreen(){const c=CATS[V.category],n=c.items.filter((_,j)=>PERSIST.interests[`${V.category}-${j}`]).length;return content('category',headerHtml(c.title,true)+`<div class="scroll"><div class="topic-banner" style="background:linear-gradient(126deg,#2b192a,${c.color})"><div class="flex">${ic(c.icon,'lg')}<span class="pill" style="background:#ffffff24;color:#fff">${c.items.length} тем</span></div><h2>${esc(c.title)}</h2><p>Исследуй тему в собственном темпе. Любопытство, практика и личные ограничения — разные вещи.</p><div class="progressbar" style="background:#ffffff2c"><span style="width:${n/c.items.length*100}%"></span></div><div style="font-size:10px;margin-top:7px;color:#f4ddeb">${n} из ${c.items.length} исследовано</div></div><div class="section">Баночки направления <span class="sub">нажми, чтобы изучить</span></div>${jars(c.items.map((_,i)=>`${V.category}-${i}`))}<div class="section">Все темы</div><div class="topic-list">${c.items.map((name,i)=>{const id=`${V.category}-${i}`,rec=PERSIST.interests[id];return `<button class="topic-item ${rec?'known':''}" data-interest="${id}"><span>${rec?'<i class="dot"></i>':''}${esc(name)}</span><small>${rec?STATUS.find(s=>s[0]===rec.status)?.[1]||'Исследовано':'Ещё не изучено'}</small></button>`}).join('')}</div><div class="section">Исследовать дальше</div><div class="card"><strong>Тест «${esc(TESTS[V.category][0])}»</strong><p class="lead" style="margin:6px 0 12px">${esc(TESTS[V.category][1])}</p><button class="btn purple" data-action="launchQuiz" data-id="${V.category}">Пройти тест ${ic('chevron')}</button></div></div>`)}
function interestScreen(){const item=FLAT.find(x=>x.id===V.interest)||FLAT[0];const c=CATS[item.cat],r=PERSIST.interests[item.id]||{status:'neutral',level:50,visibility:'private'};const known=!!PERSIST.interests[item.id];return content('interest',headerHtml(item.name,true,`<button class="head-btn" data-action="interestInfo" aria-label="О теме">${ic('info')}</button>`)+`<div class="scroll"><div class="topic-banner" style="background:linear-gradient(120deg,#291928,${c.color})"><div class="eyebrow" style="color:#fbdde9">${esc(c.title)}</div><h2>${esc(item.name)}</h2><p>Это тема для личного исследования, а не обязательный опыт. Ты определяешь её значение для себя.</p></div><div class="section">Мой статус <button data-action="interestInfo">Что означают статусы? ${ic('info','sm')}</button></div><div class="status-picker">${STATUS.map(([key,val])=>`<button class="${r.status===key?'active':''}" data-action="interestStatus" data-value="${key}">${esc(val)}</button>`).join('')}</div>${['experience','curious','fantasy'].includes(r.status)?`<div class="section">Насколько откликается <span class="sub">не показатель опыта</span></div><div class="scale">${[20,40,60,80,100].map(l=>`<button class="${Number(r.level)===l?'active':''}" data-action="interestLevel" data-value="${l}">${l/20}</button>`).join('')}</div><p class="tiny" style="line-height:1.6">Личная субъективная шкала: от «слегка интересно» до «очень важно». Не используется для оценки человека.</p>`:''}<div class="section">Кто увидит эту тему</div><div class="status-picker" style="grid-template-columns:1fr 1fr 1fr">${[['public','Всем'],['request','По запросу'],['private','Только я']].map(([k,l])=>`<button class="${r.visibility===k?'active':''}" data-action="interestVisibility" data-value="${k}">${l}</button>`).join('')}</div><div class="card" style="margin-top:15px;background:#faf7ff"><div class="flex"><span class="round-mark">${ic('shield')}</span><div class="grow"><strong>Ты управляешь видимостью</strong><div class="tiny">Незнакомые не видят скрытых ответов и границ.</div></div></div></div><div class="section">Открыть другие мнения</div><div class="card"><strong>Обсуждения в сообществе</strong><p class="lead" style="margin:7px 0 12px">Смотри разные взгляды без необходимости рассказывать о личном опыте.</p><button class="btn soft" data-go="community">Перейти к обсуждениям</button></div><div style="height:10px"></div><button class="btn primary" data-action="saveInterest">${known?'Сохранить изменения':'Добавить в мою карту'} ${ic('check')}</button></div>`)}
function testsScreen(){return content('tests',headerHtml('Исследования и тесты',true)+`<div class="scroll"><div class="h2">Ответы — начало диалога с собой.</div><p class="lead">18 тематических исследований. Можно возвращаться, повторять тесты и смотреть, как изменились ответы.</p><div class="banner" style="margin-bottom:17px"><span class="eyebrow">ПЕРСОНАЛЬНАЯ КАРТА</span><strong>Что ты узнал о себе?</strong><p>Здесь нет правильных ответов, оценок личности или диагнозов. Только твой собственный взгляд.</p><div class="flex"><span class="pill" style="color:#30142b;background:#fff">${Object.keys(PERSIST.tests).length} из ${TESTS.length} пройдено</span></div></div>${TESTS.map((t,i)=>`<button class="test-card" style="width:100%;text-align:left;cursor:pointer" data-action="launchQuiz" data-id="${i}"><span class="round-mark ${i%3===0?'coral':i%3===1?'mint':''}">${ic(CATS[t[2]].icon)}</span><span class="grow"><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p><span class="pill ${PERSIST.tests[i]?'verified':''}">${PERSIST.tests[i]?'Пройден · можно повторить':`${t[3]} вопросов · 3–4 минуты`}</span></span>${ic('chevron')}</button>`).join('')}</div>`)}
const TEST_QUESTION_COPY={
 0:['Когда кто-то берёт инициативу, мне важнее всего…','В каких ситуациях мне комфортно вести разговор?','Как я отношусь к возможности менять роли?','Если ожидания не совпадают, я предпочту…','Насколько мне интересна заранее оговорённая динамика?','Что помогает мне доверять другому человеку?','Какая степень инициативы для меня комфортна?','Хочу ли я исследовать новые роли?'],
 1:['Как я обычно проявляю нежность?','Что помогает почувствовать близость?','Нужен ли мне медленный темп?','Какие прикосновения вызывают комфорт?','Как я реагирую на непривычные формы заботы?','Что важнее в совместном отдыхе?','Как я предпочитаю обсуждать потребности?','Сколько личного пространства мне необходимо?'],
 9:['Насколько легко мне обозначать своё «нет»?','Что для меня является личной границей?','Нужны ли заранее согласованные правила?','Хочу ли я обсуждать ожидания до встречи?','Что я думаю о возможности передумать?','Насколько для меня важна конфиденциальность?','Как я предпочитаю останавливать нежелательный опыт?','Хочу ли я изучить собственные границы глубже?']
};
function quiz(){const t=TESTS[V.quiz]||TESTS[0];const idx=V.question;const c=CATS[t[2]];const item=c.items[idx%c.items.length];const question=(TEST_QUESTION_COPY[t[2]]||[])[idx]||`Что сейчас тебе ближе в теме «${item}»?`;const opts=['Очень интересно, хочу исследовать','Интересно, но без спешки','Скорее фантазия, чем реальный опыт','У меня уже есть опыт','Пока не знаю','Это моя граница'];return content('quiz',headerHtml(t[0],true)+`<div class="scroll" style="position:relative"><div class="eyebrow" style="margin-top:6px">ВОПРОС ${idx+1} ИЗ ${t[3]}</div><div class="qbar"><span style="width:${(idx+1)/t[3]*100}%"></span></div><div style="margin:25px 0 24px"><div class="h2" style="font-size:23px">${esc(question)}</div><p class="lead">Можно изменить ответ позже. Он попадёт в личную карту только после завершения теста.</p></div>${opts.map((opt,i)=>`<button class="answer ${V.choice===i?'active':''}" data-action="answer" data-value="${i}"><i></i><span>${esc(opt)}</span></button>`).join('')}<p class="tiny" style="line-height:1.7;margin-top:21px">Ответы приватны. Результаты не ставят диагнозов и не приписывают тебе определённую идентичность.</p><div style="height:20px"></div><button class="btn primary" data-action="nextQuestion" ${V.choice===null?'disabled':''}>${idx===t[3]-1?'Завершить тест':'Следующий вопрос'} ${ic('chevron')}</button><button class="btn ghost" style="margin-top:6px" data-action="skipQuestion">Пропустить вопрос</button></div>`)}
function quizResult(){const t=TESTS[V.quiz]||TESTS[0];const ids=CATS[t[2]].items.slice(0,8).map((_,i)=>`${t[2]}-${i}`);return content('quizResult',headerHtml('Твой результат',true)+`<div class="scroll"><div class="topic-banner" style="text-align:center;background:linear-gradient(125deg,#261729,#7451a6)"><span style="font-size:42px">✦</span><h2>Ещё один шаг к себе</h2><p>Тест «${esc(t[0])}» завершён. Твоя карта обновилась, и её всегда можно изменить.</p></div><div class="section">Что появилось в карте</div>${jars(ids)}<div class="card" style="margin-top:16px"><div class="flex"><span class="round-mark mint">${ic('shield')}</span><div class="grow"><strong>Результаты видишь только ты</strong><div class="tiny">Ты сам решаешь, какие темы сделать публичными.</div></div></div></div><button class="btn primary" style="margin-top:15px" data-go="map">Открыть мою карту ${ic('chevron')}</button><button class="btn soft" style="margin-top:9px" data-go="tests">Другие исследования</button></div>`)}
function community(){const posts=[...PERSIST.posts,...POSTSEED],tab=V.tab;return content('community',headerHtml('Сообщество',false,`<button class="head-btn" data-go="compose" aria-label="Написать">${ic('plus')}</button>`)+`<div class="scroll"><div class="h2">Люди, истории, открытия.</div><p class="lead">Смотри на мир глазами других, делись своим опытом или просто читай.</p><div class="tabs">${[['f','Лента'],['g','Группы'],['e','События']].map(([id,t])=>`<button class="${tab===id?'active':''}" data-action="communityTab" data-value="${id}">${t}</button>`).join('')}</div>${tab==='f'?`<button class="card" data-go="compose" style="width:100%;text-align:left;padding:13px;margin-bottom:12px"><div class="flex">${photo(1,'avatar')}<div class="grow muted" style="font-size:12px">О чём хочешь рассказать?</div><span class="round-mark coral" style="width:34px;height:34px;min-width:34px">${ic('plus')}</span></div></button><div class="chips" style="margin-bottom:10px"><span class="chip tint">Для тебя</span><button class="chip light" data-action="communityTab" data-value="g">Мои группы</button><button class="chip light" data-action="communityTab" data-value="e">События</button></div>${posts.map(postHtml).join('')}`:tab==='g'?`<div class="section">Подборка по твоим интересам <span class="sub">${GROUPS.length} групп</span></div>${GROUPS.map((g,i)=>`<div class="group-card"><div class="cover">${photo(g.image)}</div><div class="body"><div class="flex"><div class="grow"><strong>${esc(g.name)}</strong><div class="tiny">${g.members} участников</div></div><button class="btn ${PERSIST.joined[i]?'soft':'primary'} small" data-action="join" data-id="${i}">${PERSIST.joined[i]?'В группе':'Вступить'}</button></div><p>${esc(g.description)}</p><button class="chip light" data-group="${i}">Посмотреть обсуждения ${ic('chevron','sm')}</button></div></div>`).join('')}`:`<div class="section">События для исследования</div>${[['Открытый разговор о границах','Онлайн · Сб, 19:00','Бесплатно'],['Встреча сообщества: знакомимся','Офлайн · Вс, 16:00','По заявке'],['Мастер-класс по коммуникации','Онлайн · Чт, 20:00','Сообщество']].map((x,i)=>`<div class="card" style="margin-bottom:10px"><div class="flex"><span class="round-mark ${i===0?'coral':'mint'}">${ic('calendar')}</span><div class="grow"><strong style="font-size:13px">${x[0]}</strong><div class="tiny" style="margin:3px 0">${x[1]} · ${x[2]}</div></div></div><button class="btn soft" style="margin-top:12px" data-action="event">Подробнее ${ic('chevron')}</button></div>`).join('')}`}</div>`,'community')}
function postHtml(p){const liked=PERSIST.likes[p.id];return `<article class="post"><div class="post-head">${photo(p.av,'avatar round')}<div class="meta"><div class="name">${esc(p.who)}</div><div class="tiny">${esc(p.when)} · ${esc(p.group)}</div></div><span class="pill">${esc(p.aud)}</span></div><div class="post-text">${esc(p.text)}</div>${p.img>=0?`<div class="post-media">${photo(p.img)}</div>`:''}${p.id==='a'?`<div style="border-radius:14px;padding:12px;background:#f8f1fb;margin:9px 0"><div class="flex"><span class="round-mark">${ic('spark')}</span><div class="grow"><strong style="font-size:12px">Изменение личной карты</strong><div class="tiny">Новые ответы могут меняться со временем</div></div></div></div>`:''}<div class="post-actions"><button data-action="likePost" data-id="${esc(p.id)}" class="${liked?'active':''}">${ic(liked?'heartfill':'heart','sm')} ${p.likes+(liked?1:0)}</button><button data-post="${esc(p.id)}">${ic('chat','sm')} ${p.comments}</button><button data-action="share">${ic('bookmark','sm')} Сохранить</button><button class="end" data-action="follow" data-id="${esc(p.who)}">${PERSIST.following[p.who]?'Вы подписаны':ic('plus','sm')+' Подписаться'}</button></div></article>`}
function groupScreen(){const g=GROUPS[V.group];return content('group',headerHtml(g.name,true)+`<div class="scroll"><div class="photo-wrap" style="height:173px;border-radius:23px">${photo(g.image)}</div><div class="h2" style="margin-top:17px">${esc(g.name)}</div><p class="lead">${esc(g.description)} ${g.members} участников обсуждают интересующие их темы.</p><button class="btn ${PERSIST.joined[V.group]?'soft':'primary'}" data-action="join" data-id="${V.group}">${PERSIST.joined[V.group]?'Выйти из группы':'Вступить в группу'}</button><div class="section">Обсуждения группы</div>${POSTSEED.filter(p=>p.group===g.name).concat(POSTSEED.slice(0,1)).map(postHtml).join('')}<button class="btn soft" data-go="compose">Создать публикацию</button></div>`)}
function postScreen(){const p=[...PERSIST.posts,...POSTSEED].find(x=>x.id===V.post)||POSTSEED[0];return content('post',headerHtml('Обсуждение',true)+`<div class="scroll"><div>${postHtml(p)}</div><div class="section">Комментарии · ${p.comments}</div>${[['Sofi','Мне очень близка эта мысль, спасибо, что поделились.'],['Leon','Обсуждать заранее действительно меняет многое.'],['Noa','А у меня почти каждый год меняется взгляд на некоторые темы.']].map(([name,txt],i)=>`<div class="comment"><div class="flex">${photo([1,3,2][i],'avatar round')}<div><strong>${name}</strong><div class="tiny">${i+1} ч назад</div></div></div><p>${txt}</p></div>`).join('')}<div id="localComments"></div><label class="field-label" style="margin-top:19px">Добавить комментарий</label><textarea class="text-area" id="commentBody" placeholder="Напиши что-то уважительное..."></textarea><button class="btn primary" data-action="comment">Опубликовать</button></div>`)}
function compose(){return content('compose',headerHtml('Новая публикация',true)+`<div class="scroll"><div class="flex" style="margin-bottom:15px">${photo(0,'avatar round')}<div><div class="name">Alex</div><div class="tiny">Твой профиль · управляемая видимость</div></div></div><label class="field-label">Что хочешь рассказать?</label><textarea id="postBody" class="text-area" style="min-height:180px" placeholder="Мысли, вопросы, истории, открытия... Делиться опытом необязательно."></textarea><div class="section">Кто увидит публикацию</div><div class="status-picker">${[['public','Все пользователи'],['followers','Подписчики'],['request','Расширенный круг'],['private','Только я']].map(([k,t])=>`<button class="${V.aud===k?'active':''}" data-action="audience" data-value="${k}">${t}</button>`).join('')}</div><div class="card" style="margin:14px 0"><div class="flex"><span class="round-mark mint">${ic('shield')}</span><div class="grow"><strong>Контроль над публикацией</strong><div class="tiny">Личные заметки не попадают в общую ленту.</div></div></div></div><button class="btn primary" data-action="publish">${ic('send')} Опубликовать</button></div>`)}
function journal(){return content('journal',headerHtml('Личный дневник',true)+`<div class="scroll"><div class="h2">Только для тебя.</div><p class="lead">Без лайков и просмотров. Место для мыслей, изменений и вопросов к себе.</p><div class="card"><label class="field-label">Новая запись</label><textarea class="text-area" id="noteText" placeholder="О чём думаешь сегодня?"></textarea><button class="btn dark" style="margin-top:10px" data-action="note">Сохранить в дневник</button></div><div class="section">Твои записи · ${PERSIST.notes.length}</div>${PERSIST.notes.map((n,i)=>`<div class="card" style="margin-bottom:9px"><div class="flex"><span class="pill">${i===0?'Сегодня':'Личная запись'}</span><span class="pill" style="margin-left:auto">${ic('lock','sm')} Только я</span></div><p style="line-height:1.7;font-size:12px">${esc(n)}</p></div>`).join('')}</div>`)}
function profile(){return content('profile',headerHtml('Мой профиль',true,`<button class="head-btn" data-go="settings">${ic('settings')}</button>`)+`<div class="scroll"><div class="photo-wrap" style="height:245px;border-radius:24px">${photo(1)}<div style="position:absolute;z-index:2;bottom:13px;left:15px;color:#fff"><strong style="font-size:24px">Alex, 31</strong><div style="font-size:11px">он/его · би · открытые отношения</div></div></div><div class="summary-strip"><div><strong>${Object.keys(PERSIST.interests).length}</strong><span>интересов</span></div><div><strong>${Object.keys(PERSIST.tests).length}</strong><span>тестов</span></div><div><strong>${Object.keys(PERSIST.joined).filter(x=>PERSIST.joined[x]).length}</strong><span>группы</span></div></div>${section('Слои профиля','access','Настроить')}<div class="card">${[['globe','Публичный','Фото, описание и открытые интересы'],['lock','По запросу','Интересы, которые решишь раскрыть'],['book','Только я','Дневник и скрытые ответы']].map(([icon,t,s])=>`<div class="row-link"><span class="round-mark">${ic(icon)}</span><div class="grow"><strong>${t}</strong><div class="tiny">${s}</div></div></div>`).join('')}</div>${section('Мои интересы','map','Моя карта')}${jars(Object.keys(PERSIST.interests).slice(0,8))}${section('Личное пространство')}<button class="btn soft" data-go="journal">${ic('book')} Открыть дневник</button><button class="btn soft" style="margin-top:9px" data-go="tests">${ic('spark')} Все мои тесты</button></div>`)}
function settings(){return content('settings',headerHtml('Настройки',true)+`<div class="scroll"><div class="section">Личная жизнь и приватность</div><div class="card">${[['shield','Управление доступом','Публичный, закрытый и приватный слои','access'],['book','Мой дневник','Никто кроме тебя','journal'],['heart','Знакомства','Включены только по твоему выбору','datingSettings'],['eyeoff','Показывать расстояние','Выключено по умолчанию','distance']].map(([icon,t,s,go])=>`<button class="row-link" data-action="setting" data-value="${go}"><span class="round-mark">${ic(icon)}</span><span class="grow"><strong>${t}</strong><div class="tiny">${s}</div></span>${ic('chevron')}</button>`).join('')}</div><div class="section">Аккаунт и дополнительные возможности</div><div class="card"><button class="row-link" data-go="premium"><span class="round-mark coral">${ic('spark')}</span><span class="grow"><strong>FetUre Plus</strong><div class="tiny">Удобные дополнительные возможности</div></span>${ic('chevron')}</button><button class="row-link" data-action="export"><span class="round-mark mint">${ic('book')}</span><span class="grow"><strong>Экспорт демоданных</strong><div class="tiny">Получить текущие ответы и записи в JSON</div></span>${ic('chevron')}</button><button class="row-link" data-action="resetAsk"><span class="round-mark coral">${ic('repeat')}</span><span class="grow"><strong>Сбросить демонстрацию</strong><div class="tiny">Вернуть исходную карту</div></span>${ic('chevron')}</button></div><p class="tiny" style="line-height:1.7;margin-top:15px">Демо сохраняет данные только в браузере. Реальные сервер, проверка возраста, жалобы и приватные медиа здесь не подключены.</p></div>`)}
function access(){const publicN=Object.values(PERSIST.interests).filter(x=>x.visibility==='public').length,restricted=Object.values(PERSIST.interests).filter(x=>x.visibility==='request').length,privateN=Object.values(PERSIST.interests).filter(x=>x.visibility==='private').length;return content('access',headerHtml('Кто видит что',true)+`<div class="scroll"><div class="h2">Открывай только то, что хочешь.</div><p class="lead">Видимость настраивается для каждого интереса. Закрытые ответы не следует отправлять другим людям до получения доступа.</p>${[['globe','Публично',publicN,'Доступны в общем профиле','#e8f6f0'],['lock','По запросу',restricted,'Открываются только по твоему решению','#f0eaff'],['book','Только я',privateN,'Не участвуют в публичном сравнении','#f6f1f5']].map(([icon,t,n,desc,bg])=>`<div class="card" style="margin-bottom:9px"><div class="flex"><span class="round-mark" style="background:${bg}">${ic(icon)}</span><div class="grow"><strong>${t}</strong><div class="tiny">${desc}</div></div><strong style="font-size:21px">${n}</strong></div></div>`).join('')}<div class="section">Предоставленный доступ</div><div class="card"><div class="flex">${photo(2,'avatar round')}<div class="grow"><strong>Noa</strong><div class="tiny">Интересы, фотографии · ещё 5 дней</div></div><button class="chip hot" data-action="revoke">Отозвать</button></div></div><p class="tiny" style="margin-top:12px;line-height:1.6">В реальном продукте доступ проверяется на сервере. Скриншоты и внешняя съёмка не могут быть гарантированно заблокированы.</p><button class="btn soft" data-go="map">Настроить видимость интересов</button></div>`)}
function premium(){return content('premium',headerHtml('FetUre Plus',true)+`<div class="scroll"><div class="topic-banner"><div class="eyebrow" style="color:#ffb7cc">ДОПОЛНИТЕЛЬНЫЕ ВОЗМОЖНОСТИ</div><h2>Больше свободы. Никаких платных границ.</h2><p>Самопознание, безопасность, базовые интересы и участие в сообществе остаются бесплатными.</p><strong style="font-size:24px">$8.99 <small style="font-size:11px">/ месяц · пример цены</small></strong></div>${[['Тесты и личная карта','Всем доступны'],['Видимость и границы','Всем доступны'],['Сообщества и обсуждения','Всем доступны'],['Подробная история изменений','Plus'],['Расширенная статистика карты','Plus'],['Travel mode и удобная история просмотров','Plus']].map(([t,s])=>`<div class="row-link"><span class="round-mark ${s==='Plus'?'coral':'mint'}">${ic(s==='Plus'?'spark':'check')}</span><span class="grow"><strong>${t}</strong><div class="tiny">${s}</div></span></div>`).join('')}<button class="btn primary" style="margin-top:16px" data-action="demoPremium">Включить Plus (демо)</button><p class="tiny" style="line-height:1.6;margin-top:13px">Демонстрационная модель. Правила магазинов приложений и платёжных провайдеров должны быть проверены до запуска.</p></div>`)}
function datingHead(){return `<header class="top" style="gap:8px"><h1>Знакомства</h1><button class="head-btn" data-action="datingInfo">${ic('info')}</button><button class="head-btn" data-action="datingFilters">${ic('filter')}</button></header><div class="dating-nav">${[['deck','Люди'],['likes','Симпатии'],['requests','Запросы']].map(([id,t])=>`<button class="${V.peopleTab===id?'active':''}" data-action="peopleTab" data-value="${id}">${t}</button>`).join('')}</div>`}
function cardDetail(p){return `<div class="card-bottom"><div class="compatible"><strong>${p.score}%</strong><p>${esc(p.why)}<br><span style="color:#8068a2">Иллюстративный показатель, не психологический тест</span></p></div><div class="section">Совпадающие интересы</div><div class="chips">${p.tags.map(tag=>`<span class="chip tint">${esc(tag)}</span>`).join('')}</div><div class="section">Что стоит обсудить</div><div class="warn-box">${ic('alert')}<span>${esc(p.caution)} Настоящие конфликты жёстких границ должны исключать рекомендации.</span></div><div class="section">Общие баночки</div>${jars(['0-0','1-0','3-0','6-0'])}<div class="section">Последняя публикация</div><div class="card" style="background:#fcf9fb"><div style="font-size:12px;line-height:1.6">«${esc(p.posts)}»</div><button class="chip tint" style="margin-top:11px" data-action="sendLikeNote">${ic('heart','sm')} Ответить на запись</button></div><div class="section">Личное пространство</div><div class="card" style="background:linear-gradient(130deg,#f8f2fa,#f6effb);text-align:center;padding:23px 16px">${ic('lock','lg')}<strong style="display:block;margin:8px 0 4px">Расширенный профиль</strong><p class="lead">Больше интересов, приватные фото и ответы. Владелец решает, что и на какой срок открыть.</p><button class="btn dark small" data-action="reqAccess">Запросить доступ ${ic('chevron','sm')}</button></div><div class="section">О человеке</div><div class="flex" style="margin-bottom:15px"><span class="round-mark mint">${ic('shield')}</span><div class="grow"><strong style="font-size:12px">Верифицированный профиль</strong><div class="tiny">Возраст и фото проверяются отдельно в реальном продукте</div></div></div><button class="btn soft" data-action="follow" data-id="${esc(p.name)}">${PERSIST.following[p.name]?'Вы подписаны':'Подписаться на публикации'}</button><button class="btn ghost" style="margin-top:8px" data-action="chatOpen">Начать общение ${ic('chat')}</button></div>`}
function datingCard(p,next=false){const selected=V.personPhoto%p.photos.length;return `<article class="dating-card ${next?'next':''}" ${next?'inert aria-hidden="true"':''} data-deck="${V.person}"><div class="card-scroll"><div class="dating-picture">${photo(p.photos[selected])}<div class="photo-step">${p.photos.map((_,i)=>`<span class="${i===selected?'active':''}"></span>`).join('')}</div><button class="photo-hit left" data-action="photoPrev" aria-label="Предыдущее фото"></button><button class="photo-hit right" data-action="photoNext" aria-label="Следующее фото"></button><div class="dating-score"><b>${p.score}%</b><small>совместимость</small></div><div class="dating-info"><h2>${esc(p.name)} ${p.age?`<span>${p.age}</span>`:''}</h2><p>${esc(p.pron)} · ${esc(p.ident)}<br>${esc(p.city)}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><button class="card-reveal" data-action="scrollPerson">${ic('down','sm')} Смотреть профиль внутри карточки</button></div></div>${cardDetail(p)}</div></article>`}
function people(){if(!PERSIST.dating)return content('people',datingHead()+`<div class="scroll"><div class="photo-wrap" style="height:218px;border-radius:24px;margin-top:8px">${photo(2)}<div style="position:absolute;z-index:2;left:17px;bottom:15px;color:#fff"><span class="pill" style="background:#ffedf2;color:#cf2d53">Необязательный режим</span><div style="font-size:22px;letter-spacing:-.7px;font-weight:850;margin-top:8px">Знакомства — когда захочешь.</div></div></div><div class="h2" style="margin-top:22px">Твоя карта — твои правила.</div><p class="lead">Ищи людей, если сейчас этого хочешь. Профиль, тесты и сообщество доступны без знакомств. Позже можно снова скрыться из выдачи.</p><div class="card"><div class="flex"><span class="round-mark mint">${ic('shield')}</span><div class="grow"><strong>Контроль над поиском</strong><div class="tiny">Выдача взаимная: кого ищешь ты и кто хочет быть найденным тобой.</div></div></div></div><button class="btn primary" style="margin-top:17px" data-action="datingOn">Включить знакомства ${ic('heart')}</button><button class="btn ghost" style="margin-top:7px" data-go="community">Пока исследовать сообщество</button></div>`,'people');if(V.peopleTab==='likes')return content('people',datingHead()+`<div class="scroll"><div class="h2">Люди, которым ты интересен</div><p class="lead">Симпатия сама по себе не даёт доступа к закрытой части профиля.</p><div class="liker-grid">${[0,1,2,3].map(i=>`<button class="like-card" data-action="openPerson" data-id="${i}">${photo(PEOPLE[i].photo)}<div class="cap">${esc(PEOPLE[i].name)}${PEOPLE[i].age?', '+PEOPLE[i].age:''}<small>${PEOPLE[i].score}% совпадение</small></div></button>`).join('')}</div><button class="btn soft" style="margin-top:15px" data-go="premium">Больше возможностей Plus</button></div>`,'people');if(V.peopleTab==='requests')return content('people',datingHead()+`<div class="scroll"><div class="h2">Запросы доступа</div><p class="lead">Раскрытие интересов, фото и альбомов — отдельное действие. Ты решаешь, что и кому открыть.</p>${[['Noa',2,'Интересы и приватный альбом','Хочу сначала узнать, совпадаем ли мы по границам.'],['Leon',3,'Подробные интересы','Интересно обсудить общие темы.']].map(([name,ph,w,n],i)=>`<div class="request-card"><div class="flex">${photo(ph,'avatar round')}<div class="grow"><strong>${name}</strong><div class="tiny">Просит: ${w}</div></div><span class="pill warn">Новый</span></div><p>«${n}»</p><div class="flex"><button class="btn primary small" data-action="grantAccess" data-id="${i}">Настроить доступ</button><button class="btn soft small" data-action="declineAccess">Отклонить</button></div></div>`).join('')}${V.requestSent?`<div class="pill verified" style="display:inline-flex;margin-top:8px">Твой запрос отправлен</div>`:''}</div>`,'people');const p=PEOPLE[V.person];return content('people',datingHead()+`<div class="dating-main">${p?`<div class="deck">${V.person+1<PEOPLE.length?datingCard(PEOPLE[V.person+1],true):''}${datingCard(p)}<div class="dating-actions"><button class="round-action small" data-action="undo" aria-label="Вернуть">${ic('repeat')}</button><button class="round-action big" data-action="skip" aria-label="Пропустить">${ic('close')}</button><button class="round-action small" data-action="reqAccess" aria-label="Запросить доступ">${ic('lock')}</button><button class="round-action big yes" data-action="likePerson" aria-label="Нравится">${ic('heartfill')}</button></div></div>`:`<div class="dating-state">${ic('heart','lg')}<h2>Пока просмотрены все</h2><p class="lead">Новые люди появятся позже. Ты можешь вернуться к исследованиям и сообществу.</p><button class="btn primary" data-action="startDeck">Посмотреть заново</button></div>`}</div>`,'people')}
function matchScreen(){const p=PEOPLE[Math.min(V.person,PEOPLE.length-1)];return `<div class="welcome"><div class="welcome-bg">${photo(p.photo)}</div><div class="welcome-content" style="text-align:center"><div class="welcome-top">Fet<strong style="color:#ff5d81">Ure</strong></div><div class="welcome-spacer"></div><div style="font-size:52px;margin-bottom:9px">♡</div><div class="welcome-kicker" style="align-self:center">Взаимная симпатия</div><h1 style="font-size:39px">Есть контакт!</h1><p>Похоже, вы заинтересовали друг друга. Но знакомиться и открывать личные материалы можно только по взаимному согласию.</p><button class="btn primary" data-go="chat">Написать сообщение</button><button class="btn secondary" data-go="people">Продолжить смотреть</button></div></div>`}
function chat(){const p=PEOPLE[Math.min(V.person,PEOPLE.length-1)];return content('chat',headerHtml(p.name,true,`<button class="head-btn" data-action="reqAccess">${ic('lock')}</button>`)+`<div class="scroll" style="padding-bottom:92px"><div style="text-align:center;margin:7px 0 17px">${photo(p.photo,'avatar round')}<div style="margin-top:6px;font-weight:800">${esc(p.name)}</div><div class="tiny">Переписка началась после взаимного интереса</div></div><div class="chat-list">${V.chats.map((m,i)=>`<div class="bubble ${i%2===1?'mine':''}">${esc(m)}</div>`).join('')}</div></div><form class="input-dock" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Написать сообщение…"><button class="send" aria-label="Отправить">${ic('send')}</button></form>`)}
function datingSettings(){return content('datingSettings',headerHtml('Настройки знакомств',true)+`<div class="scroll"><div class="h2">Твой темп — твой выбор.</div><p class="lead">Скрытый режим означает, что тебя не показывают в разделе знакомств. Сообщество и профиль продолжают работать.</p><div class="card"><div class="flex"><span class="round-mark coral">${ic('heart')}</span><div class="grow"><strong>Участвовать в знакомствах</strong><div class="tiny">${PERSIST.dating?'Сейчас включено':'Сейчас выключено'}</div></div><button class="chip ${PERSIST.dating?'hot':'light'}" data-action="datingToggle">${PERSIST.dating?'Выключить':'Включить'}</button></div></div><div class="section">Основные фильтры</div><div class="card">${[['Кого показывать','Людей и пары'],['Возраст','24–42 года'],['Расстояние','До 25 км'],['Формат отношений','Открытые · поли · общение'],['Жёсткие границы','Исключать конфликты']].map(([a,b])=>`<div class="row-link"><div class="grow"><strong>${a}</strong><div class="tiny">${b}</div></div>${ic('chevron')}</div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="flex"><span class="round-mark mint">${ic('shield')}</span><div class="grow"><strong>Безопасность бесплатна</strong><div class="tiny">Базовые фильтры, скрытие профиля и контроль доступа доступны каждому.</div></div></div></div><button class="btn dark" style="margin-top:15px" data-go="people">К карточкам знакомств</button></div>`)}
function sideNav(){const groups=[['Старт',[['welcome','Приветствие','spark'],['intro','Быстрое начало','compass']]],['Личное',[['home','Мой мир','user'],['map','Моя карта','layers'],['profile','Профиль','user'],['journal','Дневник','book'],['access','Приватность','shield']]],['Исследовать',[['explore','Каталог интересов','compass'],['category','Направление','layers'],['interest','Одна баночка','spark'],['tests','Все тесты','book'],['quiz','Прохождение теста','check']]],['Сообщество',[['community','Лента и группы','users'],['compose','Создать публикацию','plus'],['post','Обсуждение','chat']]],['Знакомства',[['people','Карточки · свайп','heart'],['chat','Переписка','chat'],['datingSettings','Режим знакомств','sliders']]],['Система',[['settings','Настройки','settings'],['premium','Plus','spark']]]];const node=document.getElementById('screen-nav');node.innerHTML=`<div class="brand">Fet<strong>Ure</strong></div><p class="tagline">Исследуй себя. Открывай других. Находи своих.</p><div style="border:1px solid #614252;border-radius:13px;padding:11px 12px;font-size:11px;color:#e6c4d9">MVP-концепция · версия 3.0<br><span style="color:#a68eaa">20+ интерактивных сценариев</span></div>${groups.map(([g,items])=>`<div class="side-group">${g}</div>${items.map(([id,name,icon])=>`<button class="screen-link ${V.screen===id?'active':''}" data-go="${id}">${ic(icon)} ${name}</button>`).join('')}`).join('')}<div class="side-footer">Демо работает автономно. Фотографии Unsplash подгружаются при наличии интернета; офлайн остаются локальные иллюстрации.</div>`}
const SCREENS={welcome,intro,home,map:mapScreen,profile,explore,search:catalogSearch,category:categoryScreen,interest:interestScreen,tests:testsScreen,quiz,quizResult,community,group:groupScreen,post:postScreen,compose,journal,people,match:matchScreen,chat,settings,access,premium,datingSettings};
let renderedKey='';
function render(){
 const key=[V.screen,V.screen==='quiz'?V.question:'',V.screen==='people'?V.person+'-'+V.peopleTab:''].join(':');
 const old=key===renderedKey;
 const oldMain=old?ROOT.querySelector('.scroll')?.scrollTop??0:0;
 const oldCard=old?ROOT.querySelector('.card-scroll')?.scrollTop??0:0;
 const screen=SCREENS[V.screen]||home;
 ROOT.innerHTML=screen();if(V.modal)ROOT.insertAdjacentHTML('beforeend',V.modal);
 sideNav();panel(V.screen);upgradePhotos();renderedKey=key;
 if(old){const a=ROOT.querySelector('.scroll');if(a)a.scrollTop=oldMain;const b=ROOT.querySelector('.card-scroll');if(b)b.scrollTop=oldCard;}
}
function toast(msg){document.getElementById('toastLayer')?.remove();const el=document.createElement('div');el.id='toastLayer';el.className='toast';el.textContent=msg;ROOT.appendChild(el);setTimeout(()=>el.remove(),2800)}
function sheet(content){V.modal=`<div class="modal-cover" data-action="closeSheet"><div class="sheet" data-action="noop"><div class="sheet-handle"></div>${content}</div></div>`;ROOT.insertAdjacentHTML('beforeend',V.modal);upgradePhotos()}
function closeSheet(){V.modal='';document.querySelector('.modal-cover')?.remove()}
function goInterest(id){V.interest=id;V.history.push(V.screen);V.screen='interest';render()}
let quizAnswers=[];
function finishQuiz(){const t=TESTS[V.quiz];quizAnswers.forEach((num,i)=>{const id=`${t[2]}-${i}`;if(num===null||num===undefined)return;const opts=[['curious',100],['curious',60],['fantasy',65],['experience',85],['neutral',0],['boundary',0]];const [status,level]=opts[num];PERSIST.interests[id]={status,level,visibility:status==='boundary'?'private':'private'}});PERSIST.tests[V.quiz]={doneAt:new Date().toISOString(),answers:quizAnswers};save();V.history.push(V.screen);V.screen='quizResult';render()}
function handleAction(action,el){switch(action){case'back':back();break;case'noop':break;case'closeSheet':closeSheet();break;case'resetAsk':sheet(`<h2>Сбросить демонстрацию?</h2><p>Пройденные тесты, интересы, записи и публикации в этом браузере вернутся к начальному состоянию.</p><button class="btn primary" data-action="reset">Сбросить</button><button class="btn soft" data-action="closeSheet" style="margin-top:9px">Отмена</button>`);break;case'reset':localStorage.removeItem('feture3-demo');location.reload();break;
case'launchQuiz':V.quiz=Math.min(TESTS.length-1,Math.max(0,Number(el.dataset.id)||0));V.question=0;V.choice=null;quizAnswers=[];nav('quiz');break;case'answer':V.choice=Number(el.dataset.value);render();break;case'nextQuestion':if(V.choice===null)return;quizAnswers[V.question]=V.choice;if(V.question>=TESTS[V.quiz][3]-1){finishQuiz()}else{V.question++;V.choice=null;render()}break;case'skipQuestion':quizAnswers[V.question]=null;if(V.question>=TESTS[V.quiz][3]-1)finishQuiz();else{V.question++;V.choice=null;render()}break;
case'interestStatus':{const r=PERSIST.interests[V.interest]||{status:'neutral',level:60,visibility:'private'};r.status=el.dataset.value;if(['boundary','dislike','neutral'].includes(r.status))r.level=0;else if(!r.level)r.level=60;PERSIST.interests[V.interest]=r;save();render();break}case'interestLevel':{const r=PERSIST.interests[V.interest]||{status:'curious',visibility:'private'};r.level=Number(el.dataset.value);PERSIST.interests[V.interest]=r;save();render();break}case'interestVisibility':{const r=PERSIST.interests[V.interest]||{status:'neutral',level:0};r.visibility=el.dataset.value;PERSIST.interests[V.interest]=r;save();render();break}case'saveInterest':save();toast('Интерес сохранён в твоей карте');break;case'interestInfo':sheet(`<h2>О чём говорит баночка?</h2><p>Это личная запись об интересе, а не тест «нормальности».</p><div class="card"><strong>Интерес / опыт / фантазия</strong><p>Отдельные статусы; значение шкалы показывает только твою субъективную заинтересованность.</p><strong>Не моё / граница</strong><p>Не превращаются в высокий процент. Жёсткая граница исключает неподходящие рекомендации.</p><strong>Пока не знаю</strong><p>Тема остаётся неоценённой, это тоже нормальный результат.</p></div><button class="btn dark" style="margin-top:12px" data-action="closeSheet">Понятно</button>`);break;
case'communityTab':V.tab=el.dataset.value;render();break;case'join':{const id=el.dataset.id;PERSIST.joined[id]=!PERSIST.joined[id];save();render();toast(PERSIST.joined[id]?'Ты вступил(а) в группу':'Ты вышел(ла) из группы');break}case'likePost':{const id=el.dataset.id;PERSIST.likes[id]=!PERSIST.likes[id];save();render();break}case'follow':{const name=el.dataset.id;PERSIST.following[name]=!PERSIST.following[name];save();render();toast(PERSIST.following[name]?'Подписка оформлена':'Подписка отменена');break}case'audience':V.aud=el.dataset.value;render();break;
case'publish':{const body=document.getElementById('postBody')?.value.trim();if(!body)return toast('Напиши хотя бы одно предложение');if(V.aud==='private'){PERSIST.notes.unshift(body);save();nav('journal');toast('Сохранено только для тебя');return}PERSIST.posts.unshift({id:'u'+Date.now(),who:'Alex',av:0,when:'только что',group:'Мой профиль',aud:V.aud==='public'?'Всем':V.aud==='followers'?'Подписчикам':'Расширенный круг',text:body,img:-1,likes:0,comments:0});save();V.tab='f';nav('community');toast('Публикация добавлена');break}case'note':{const txt=document.getElementById('noteText')?.value.trim();if(!txt)return toast('Сначала напиши заметку');PERSIST.notes.unshift(txt);save();render();toast('Сохранено в личном дневнике');break}case'comment':{const txt=document.getElementById('commentBody')?.value.trim();if(!txt)return toast('Напиши комментарий');const target=document.getElementById('localComments');if(target)target.insertAdjacentHTML('beforeend',`<div class="comment"><strong>Alex · только что</strong><p>${esc(txt)}</p></div>`);document.getElementById('commentBody').value='';toast('Комментарий добавлен в демо');break}case'share':toast('Сохранено в закладки (демо)');break;case'event':sheet(`<h2>Событие сообщества</h2><p>Демонстрационная карточка. В реальном продукте здесь будут организатор, место, правила участия, дата и возможность записаться.</p>${button('Понятно','closeSheet','dark')}`);break;
case'datingOn':PERSIST.dating=true;save();V.peopleTab='deck';V.person=0;V.personPhoto=0;render();break;case'datingToggle':PERSIST.dating=!PERSIST.dating;save();render();break;case'peopleTab':V.peopleTab=el.dataset.value;render();break;case'scrollPerson':{const a=ROOT.querySelector('.dating-card:not(.next) .card-scroll');if(a)a.scrollTo({top:Math.max(200,a.querySelector('.dating-picture')?.offsetHeight-80||420),behavior:'smooth'});break}case'photoPrev':V.personPhoto=(V.personPhoto-1+PEOPLE[V.person].photos.length)%PEOPLE[V.person].photos.length;render();break;case'photoNext':V.personPhoto=(V.personPhoto+1)%PEOPLE[V.person].photos.length;render();break;case'openPerson':V.peopleTab='deck';V.person=Number(el.dataset.id);V.personPhoto=0;render();break;case'undo':V.person=Math.max(0,V.person-1);V.personPhoto=0;render();break;case'skip':V.person++;V.personPhoto=0;render();break;case'likePerson':if(V.person===0){nav('match');}else{V.person++;V.personPhoto=0;render();toast('Симпатия отправлена')}break;case'startDeck':V.person=0;V.personPhoto=0;render();break;case'chatOpen':nav('chat');break;case'sendLikeNote':nav('chat');break;case'reqAccess':sheet(`<h2>Запросить доступ</h2><p>Можно попросить открыть отдельную часть профиля. Решение всегда остаётся за владельцем.</p><div class="status-picker">${[['Интересы','interest'],['Приватные фото','photos'],['Альбомы','albums'],['Границы','bounds']].map(([t,k])=>`<button class="${V.access[k]?'active':''}" data-action="accessPick" data-value="${k}">${t}</button>`).join('')}</div><label class="field-label" style="margin-top:17px">Сообщение (необязательно)</label><textarea id="reqMsg" class="text-area" placeholder="Почему хочешь узнать больше?"></textarea><button class="btn primary" data-action="sendRequest" style="margin-top:10px">Отправить запрос</button>`);break;case'accessPick':V.access[el.dataset.value]=!V.access[el.dataset.value];closeSheet();handleAction('reqAccess',el);break;case'sendRequest':V.requestSent=true;closeSheet();toast('Запрос отправлен (демо)');break;case'grantAccess':sheet(`<h2>Что открыть и на какой срок?</h2><p>Запрос не означает автоматическое согласие. Можно выбрать только часть данных.</p><div class="status-picker"><button class="active" data-action="noop">Интересы</button><button data-action="noop">Фото</button><button data-action="noop">Альбомы</button><button data-action="noop">Границы</button></div><div class="section">Срок доступа</div><div class="chips"><button class="chip selected">24 часа</button><button class="chip">7 дней</button><button class="chip">Без срока</button></div><button class="btn primary" style="margin-top:16px" data-action="grantFinish">Предоставить выбранное</button>`);break;case'grantFinish':closeSheet();toast('Доступ открыт (демо)');break;case'declineAccess':toast('Запрос отклонён');break;case'revoke':toast('Доступ отозван (демо)');break;case'datingInfo':sheet(`<h2>Знакомства — по желанию</h2><p>Пользователь может полностью отключить участие в поиске, не теряя доступ к тестам и сообществу.</p><p>В карточке можно листать фотографии и прокручивать весь профиль до симпатии или сообщения.</p><button class="btn dark" data-go="datingSettings">Настроить режим знакомств</button>`);break;case'datingFilters':nav('datingSettings');break;
case'setting':{const x=el.dataset.value;if(x==='distance'){PERSIST.hiddenDist=!PERSIST.hiddenDist;save();toast(PERSIST.hiddenDist?'Расстояние скрыто':'Расстояние показано')}else nav(x);break}case'demoPremium':PERSIST.premium=true;save();toast('Plus включён для демонстрации');break;case'export':{const blob=new Blob([JSON.stringify(PERSIST,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='feture-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);break}
default:toast('Демонстрационный сценарий')}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-go],[data-interest],[data-category],[data-post],[data-group]');if(!el)return;e.preventDefault();if(el.dataset.action){handleAction(el.dataset.action,el);return}if(el.dataset.go){nav(el.dataset.go);return}if(el.dataset.interest){goInterest(el.dataset.interest);return}if(el.dataset.category!==undefined){V.category=Number(el.dataset.category);nav('category');return}if(el.dataset.post){V.post=el.dataset.post;nav('post');return}if(el.dataset.group){V.group=Number(el.dataset.group);nav('group');return}});
document.addEventListener('input',e=>{if(e.target.id==='catalogSearch'){V.catFilter=e.target.value;const pos=e.target.selectionStart;V.screen='search';render();const newField=document.getElementById('catalogSearch');newField.focus();newField.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const v=document.getElementById('chatInput').value.trim();if(v){V.chats.push(v);render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.modal)closeSheet()});

let swipeStart=null,lastSwipeAt=0;
document.addEventListener('pointerdown',e=>{
 if(V.screen!=='people'||V.peopleTab!=='deck'||!PERSIST.dating||V.modal)return;
 if(e.target.closest('.dating-card:not(.next)')&&!e.target.closest('button'))swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};
},{passive:true});
document.addEventListener('pointerup',e=>{
 if(!swipeStart||swipeStart.id!==e.pointerId)return;
 const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;
 if(Math.abs(dx)<85||Math.abs(dx)<Math.abs(dy)*1.45)return;
 lastSwipeAt=Date.now();handleAction(dx>0?'likePerson':'skip',e.target);
},{passive:true});
document.addEventListener('click',e=>{if(Date.now()-lastSwipeAt<400&&e.target.closest('.photo-hit')){e.preventDefault();e.stopImmediatePropagation()}},true);

render();

</script></body></html>
