import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Native branding is sourced from the same product metadata as the web app.
def productConfig = new JsonSlurper().parse(rootProject.file('../config/product.json'))
def unmuteBrandBackground = productConfig.brand.background.toString()
def generatedBrandResDir = file("$buildDir/generated/unmuteBrand/res")

android {
    namespace = "app.unmute.english"
    compileSdk = rootProject.ext.compileSdkVersion
    // direct — APK из GitHub, обновляется внутри приложения; play — для магазинов, без права ставить APK.
    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_UPDATES", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_UPDATES", "false"
        }
    }
    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.res.srcDir generatedBrandResDir
    }

    defaultConfig {
        applicationId "app.unmute.english"
        resValue "color", "unmute_brand_background", unmuteBrandBackground
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = System.getenv("VERSION_NAME") ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && new File(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Google Services plugin not applied. Remote push won't work")
}


// Keep the supplied UnMute artwork, but give it ~15% more safe area so launcher masks never crop it.
// The generated raster is a separate resource, so no adaptive-icon XML can shadow it on One UI.
def generateUnMuteLauncherIcon = tasks.register("generateUnMuteLauncherIcon") {
    def sourceIcon = file("src/main/res/mipmap-xxxhdpi/ic_launcher.png")
    def outputIcon = file("$generatedBrandResDir/mipmap-xxxhdpi/unmute_launcher.png")
    inputs.file sourceIcon
    inputs.property("brandBackground", unmuteBrandBackground)
    outputs.file outputIcon
    doLast {
        outputIcon.parentFile.mkdirs()
        def source = javax.imageio.ImageIO.read(sourceIcon)
        int width = source.width
        int height = source.height
        def canvas = new java.awt.image.BufferedImage(width, height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = canvas.createGraphics()
        try {
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setColor(java.awt.Color.decode(unmuteBrandBackground))
            graphics.fillRect(0, 0, width, height)
            int scaledWidth = Math.round(width * 0.85f)
            int scaledHeight = Math.round(height * 0.85f)
            int x = (width - scaledWidth) / 2
            int y = (height - scaledHeight) / 2
            graphics.drawImage(source, x, y, scaledWidth, scaledHeight, null)
        } finally {
            graphics.dispose()
        }
        javax.imageio.ImageIO.write(canvas, "png", outputIcon)
    }
}

tasks.named("preBuild").configure {
    dependsOn generateUnMuteLauncherIcon
}
