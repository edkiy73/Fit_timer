import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def productConfig = new JsonSlurper().parse(rootProject.file('../config/product.json'))
def fitTimerBrandBackground = productConfig.brand.background.toString()
def generatedBrandResDir = file("$buildDir/generated/fittimerBrand/res")

android {
    namespace = "ru.fittimer.app"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_UPDATES", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_UPDATES", "false"
        }
    }
    sourceSets {
        main.res.srcDir generatedBrandResDir
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "ru.fittimer.app"
        resValue "color", "fittimer_brand_background", fitTimerBrandBackground
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && new File(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation project(':capacitor-android')
    // Continuous offline command recognition. The Russian model is downloaded once
    // on first use and then stays in app-private storage.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.play:review:2.0.2'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


// The GitHub connector used by this repo is text-safe but has corrupted direct binary
// resource uploads before. Keep the user-supplied FitTimer artwork as Base64 text and
// reconstruct the WebP byte-for-byte before Android resource compilation.
def generateFitTimerLauncherIcon = tasks.register("generateFitTimerLauncherIcon") {
    def encodedIcon = file("branding/fittimer_launcher_v6.webp.b64")
    def outputIcon = file("$generatedBrandResDir/mipmap-xhdpi/fittimer_launcher_v6.webp")
    inputs.file encodedIcon
    outputs.file outputIcon
    doLast {
        byte[] bytes = java.util.Base64.getDecoder().decode(encodedIcon.getText("UTF-8").trim())
        if (bytes.length < 12 ||
            new String(bytes, 0, 4, java.nio.charset.StandardCharsets.US_ASCII) != "RIFF" ||
            new String(bytes, 8, 4, java.nio.charset.StandardCharsets.US_ASCII) != "WEBP") {
            throw new GradleException("FitTimer launcher source is not a valid WebP")
        }
        outputIcon.parentFile.mkdirs()
        outputIcon.bytes = bytes
    }
}

tasks.named("preBuild").configure {
    dependsOn generateFitTimerLauncherIcon
}
