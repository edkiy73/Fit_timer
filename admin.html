<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fit Timer — админка</title>
<!--
  Админка каталога. Отдельная страница, а не часть приложения: у неё другой
  зритель (один человек), другая задача (разбирать поток) и другой ключ. Внутри
  приложения она была бы кодом, который никогда не выполняется у пользователей,
  но всегда едет им в загрузке.

  Ключ хранится в браузере и уходит заголовком, а не в адресе: адрес попадает
  в историю и в журналы, заголовок — нет.
-->
<style>
  :root{
    color-scheme:light dark;
    --bg:#F4F2FB; --card:#fff; --ink:#1B1630; --muted:#6C6785; --line:#E6E2F2;
    --ok:#1F9D63; --danger:#C22F4C; --warn:#B8791B; --accent:#6B3FE0; --soft:#F0ECFB;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141020;--card:#1E1930;--ink:#EEEAF7;--muted:#9A94B4;--line:#2E2745;
          --ok:#3ED598;--danger:#FF6079;--warn:#F5B93B;--accent:#9C7BFF;--soft:#241E3A}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 10px;
         border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0 0 12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--muted);
       border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin:14px 0}
  .card.ban{opacity:.6}
  .top{display:flex;gap:12px;align-items:flex-start}
  .name{font-size:17px;font-weight:600;margin:0}
  .who{color:var(--accent);font-size:13px;text-decoration:none}
  .tags{color:var(--muted);font-size:13px;margin:6px 0 10px}
  .gives{margin:0 0 10px}
  img.cover{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none}
  details{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;
      padding:12px;font-size:12.5px;line-height:1.5;max-height:320px;overflow:auto;margin:10px 0 0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button.b,a.b{border:1px solid var(--line);border-radius:10px;padding:10px 14px;
       font-size:14px;font-weight:600;color:var(--ink);background:var(--card);cursor:pointer;
       text-decoration:none;display:inline-block}
  .b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .b.no{color:var(--danger);border-color:var(--danger)}
  .b.quiet{font-weight:400;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;
        letter-spacing:.06em;text-transform:uppercase}
  input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);
       border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
  textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 140px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .err{color:var(--danger);font-size:13px;margin:8px 0 0}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;
        padding:2px 9px;font-size:11.5px;color:var(--muted);margin-left:6px}
  .pill.ban{color:var(--danger);border-color:var(--danger)}
  .pill.pro{color:var(--accent);border-color:var(--accent)}
  /* Флажок с пояснением: «только по подписке» решает, увидит ли человек состав
     вообще, и одного слова тут мало. */
  /* Общее правило для label делает подписи капсом — здесь это обычная строка,
     а не заголовок поля, поэтому перебиваем: и регистр, и цвет, и раскладку. */
  label.check{
    display:grid;grid-template-columns:20px 1fr;gap:4px 10px;align-items:center;
    margin:14px 0 2px;font-size:15px;color:var(--ink);font-weight:500;
    letter-spacing:0;text-transform:none;cursor:pointer;line-height:1.35;
  }
  label.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
  label.check small{
    grid-column:2;font-weight:400;color:var(--muted);font-size:12.5px;
    letter-spacing:0;text-transform:none;line-height:1.4;
  }
  .gate{max-width:380px;margin:80px auto;padding:0 16px}
  .lang-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;background:var(--bg)}
  .lang-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .lang-head b{font-size:15px}
  .lang-state{font-size:12px;color:var(--muted)}
  .lang-state.ok{color:var(--ok)}
  .translate-tools{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .translate-box{margin-top:10px}
  .translate-box textarea{min-height:110px}
  /* Картинки. Правка каталога без них — полдела: обложка решает, откроют ли строку,
     а фото упражнения объясняет движение быстрее любого описания. */
  .pics{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .pic{position:relative;width:88px}
  .pic .ph{width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--soft);
           border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
           color:var(--muted);font-size:11px;text-align:center;cursor:pointer;padding:6px}
  .pic .ph img{width:100%;height:100%;object-fit:cover}
  .pic small{display:block;font-size:11px;color:var(--muted);margin-top:4px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pic .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
          border:1px solid var(--line);background:var(--card);color:var(--danger);
          font-size:13px;line-height:1;cursor:pointer;padding:0}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h1>Админка Fit Timer</h1>
  <p class="muted">Введи ключ. Он хранится только в этом браузере.</p>
  <label>Ключ</label>
  <input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY">
  <p class="err" id="gateErr"></p>
  <div class="acts"><button class="b ok" id="enter">Войти</button></div>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <h1>Админка Fit Timer</h1>
    <div class="tabs">
      <button class="tab on" data-tab="pending">На проверке <span id="nPending"></span></button>
      <button class="tab" data-tab="approved">В каталоге <span id="nApproved"></span></button>
      <button class="tab" data-tab="trainers">Тренеры <span id="nTrainers"></span></button>
      <button class="tab" data-tab="add">Добавить</button>
      <button class="tab" data-tab="settings">ИИ и тариф</button>
      <button class="tab" id="out" style="margin-left:auto">Выйти</button>
    </div>
  </div></header>
  <div class="wrap" id="body"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const GOALS = [['slim','Похудеть'],['tone','Подтянуть всё тело'],['glut','Ягодицы и пресс'],
  ['core','Плоский живот'],['power','Сила и выносливость'],['relief','Рельеф мышц'],
  ['flex','Растяжка и гибкость'],['back','Осанка и спина'],['post','После родов'],
  ['cardio','Кардио и энергия']];
const LEVELS = ['Новичок','Средний','Продвинутый'];
const goalName = id => (GOALS.find(g => g[0] === id) || [id, id])[1];

const LANGS = ['ru','en'];
const langName = lang => lang === 'en' ? 'EN' : 'RU';
function sourceLocaleOf(c){
  if(c && (c.sourceLocale === 'ru' || c.sourceLocale === 'en')) return c.sourceLocale;
  if(c && c.locales && c.locales.en && !c.locales.ru) return 'en';
  return 'ru';
}
function localeBlock(c, lang){
  const hit = c && c.locales && c.locales[lang];
  if(hit) return {name:hit.name || '', gives:hit.gives || '', text:hit.text || ''};
  const source = sourceLocaleOf(c);
  if(c && lang === source) return {name:c.name || '', gives:c.gives || '', text:c.text || ''};
  if(c && !c.locales && lang === 'ru') return {name:c.name || '', gives:c.gives || '', text:c.text || ''};
  return {name:'', gives:'', text:''};
}
function localeReady(c, lang){
  const x = localeBlock(c, lang);
  return x.name.trim().length >= 3 && x.gives.trim().length >= 20 && x.text.length >= 60;
}
function localeMarks(c){
  return LANGS.map(lang => langName(lang) + ' ' + (localeReady(c, lang) ? '✓' : '—')).join(' · ');
}
function translationPrompt(source, from, to){
  const names = {ru:'Russian', en:'English'};
  return 'Translate this Fit Timer catalog entry from ' + names[from] + ' to ' + names[to] + '.\n'
    + 'Return ONLY valid JSON with exactly the keys name, gives, text.\n'
    + 'Inside text keep every protocol label before the colon exactly unchanged (ПРОГРАММА, ДНИ, КРУГИ, УПРАЖНЕНИЕ, ОПИСАНИЕ, ФОРМАТ, ЗНАЧЕНИЕ, ПОДХОДЫ, ОТДЫХ, ШАГ, ПОТОЛОК and the other service labels).\n'
    + 'Keep line order, blank lines, numbers, day tokens, boolean/control values and format values unchanged. Translate only human-readable names and prose. Do not add/remove/reorder exercises or change workout mechanics.\n\nSOURCE JSON:\n'
    + JSON.stringify(source, null, 2);
}

let KEY = localStorage.getItem('adminKey') || '';
let data = {pending: [], approved: [], trainers: [], settings: null, providers: {}};
let tab = 'pending';

async function api(action, extra){
  const res = await fetch('/api/admin', {
    method: 'POST',
    // Ключ кодируем: в заголовок можно положить только ASCII, и ключ с кириллицей
    // или пробелом ронял САМ запрос — человек видел «нет связи» вместо «ключ не тот».
    headers: {'Content-Type': 'application/json', 'X-Admin-Key': encodeURIComponent(KEY)},
    cache: 'no-store',
    body: JSON.stringify(Object.assign({action}, extra || {}))
  });
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw Object.assign(new Error(j.error || res.status), j);
  return j;
}

function showGate(msg){
  $('app').hidden = true; $('gate').hidden = false;
  $('gateErr').textContent = msg || '';
  $('key').value = '';
}

async function load(){
  try{
    data = await api('overview');
  }catch(e){
    if(e.message === 'bad_key') return showGate('Ключ не подошёл.');
    if(e.message === 'no_admin_key') return showGate('На сервере не задана переменная ADMIN_KEY.');
    if(e.message === 'no_store') return showGate('Хранилище не подключено — см. /api/health');
    return showGate('Не получилось связаться с сервером.');
  }
  $('gate').hidden = true; $('app').hidden = false;
  $('nPending').textContent = data.pending.length || '';
  $('nApproved').textContent = data.approved.length || '';
  $('nTrainers').textContent = data.trainers.length || '';
  render();
}

function render(){
  const b = $('body');
  b.innerHTML = '';
  if(tab === 'add') return renderAdd(b);
  if(tab === 'trainers') return renderTrainers(b);
  if(tab === 'settings') return renderSettings(b);
  const list = tab === 'pending' ? data.pending : data.approved;
  if(!list.length){
    b.innerHTML = `<div class="empty">${tab === 'pending'
      ? 'Пусто — всё разобрано.'
      : 'В каталоге пока ничего нет.<br><br><button class="b" id="seed">Залить пять тестовых программ</button>'}</div>`;
    const sd = document.getElementById('seed');
    if(sd) sd.onclick = () => act('seed', {});
    return;
  }
  list.slice().reverse().forEach(c => b.appendChild(itemCard(c)));
}

function itemCard(c){
  const el = document.createElement('div');
  el.className = 'card';
  const pending = c.status === 'pending';
  el.innerHTML = `
    <div class="top">
      ${c.cover ? `<img class="cover" src="${esc(c.cover)}" alt="">` : ''}
      <div style="flex:1;min-width:0">
        <p class="name">${esc(c.name)}${c.pro ? '<span class="pill pro">премиум</span>' : ''}</p>
        ${c.by ? `<a class="who" href="/api/trainer/${encodeURIComponent(c.by)}" target="_blank" rel="noopener">${esc(c.by)}</a>` : '<span class="muted">от нас</span>'}
        <p class="tags">${esc(goalName(c.cat))} · ${esc(c.level)} · ${esc(c.min)} мин${c.exCount ? ' · ' + esc(c.exCount) + ' упражнений' : ''}${
          c.media && Object.keys(c.media).length ? ' · ' + Object.keys(c.media).length + ' фото' : ''} · ${esc(localeMarks(c))}</p>
      </div>
    </div>
    <p class="gives">${esc(c.gives)}</p>
    <details><summary>Что внутри</summary><pre>${esc(c.text)}</pre></details>
    <div class="acts"></div>`;
  const acts = el.querySelector('.acts');
  const btn = (label, cls, fn) => {
    const x = document.createElement('button');
    x.className = 'b ' + (cls || '');
    x.textContent = label;
    x.onclick = fn;
    acts.appendChild(x);
    return x;
  };
  if(pending){
    const ready = localeReady(c, 'ru') && localeReady(c, 'en');
    btn(ready ? 'Проверить RU / EN' : 'Подготовить RU / EN', '', () => {
      tab = 'add'; render(); fillForm(c);
    });
    // Сервер тоже проверяет оба языка: скрытие кнопки здесь только убирает ложное действие.
    if(ready){
      btn('Взять в каталог', 'ok', () => act('approve', {id: c.id, pro: false}));
      btn('Взять в премиум', 'ok', () => act('approve', {id: c.id, pro: true}));
    }
    btn('Отклонить', 'no', () => act('reject', {id: c.id}));
  } else {
    btn(c.pro ? 'Открыть всем' : 'Сделать премиум', '', () => act('pro', {id: c.id, pro: !c.pro}));
    btn('Изменить', '', () => { tab = 'add'; render(); fillForm(c); });
    btn('Убрать из каталога', 'no', () => {
      if(confirm(`Убрать «${c.name}» из каталога?`)) act('remove', {id: c.id});
    });
  }
  if(c.by){
    btn('Закрыть автора', 'quiet', () => {
      if(confirm(`Закрыть ${c.by}? Его программы больше не будут приниматься.`))
        act('ban', {handle: c.by});
    });
  }
  return el;
}

function renderTrainers(b){
  if(!data.trainers.length){
    b.innerHTML = '<div class="empty">Тренеров пока нет.</div>';
    return;
  }
  const day = v => v ? new Date(v).toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'}) : '—';
  data.trainers.slice().reverse().forEach(t => {
    const el = document.createElement('div');
    el.className = 'card' + (t.banned ? ' ban' : '');
    el.innerHTML = `
      <p class="name">${esc(t.name || t.handle)}${t.banned ? '<span class="pill ban">закрыт</span>' : ''}</p>
      <a class="who" href="/api/trainer/${encodeURIComponent(t.handle)}" target="_blank" rel="noopener">${esc(t.handle)}</a>
      <p class="tags">${t.years ? t.years + ' лет стажа · ' : ''}${t.programs} программ · ${t.opens} взяли<br>
        появился ${esc(day(t.since))} · последняя активность ${esc(day(t.seen))}</p>
      ${t.about ? `<p class="gives">${esc(t.about)}</p>` : ''}
      ${t.links ? `<p class="muted">${esc(t.links)}</p>` : ''}
      <div class="acts"></div>`;
    const x = document.createElement('button');
    x.className = 'b ' + (t.banned ? '' : 'no');
    x.textContent = t.banned ? 'Вернуть' : 'Закрыть приём программ';
    x.onclick = () => act(t.banned ? 'unban' : 'ban', {handle: t.handle});
    el.querySelector('.acts').appendChild(x);
    b.appendChild(el);
  });
}

function renderSettings(b){
  const s = data.settings || {}, lim = s.limits || {}, pay = s.payment || {};
  const route = (type, which, label) => {
    const x = (s[type] && s[type][which]) || {};
    return `<div><label>${label} · провайдер</label><select id="${type}_${which}_provider">
      ${['gemini','openai'].map(p => `<option value="${p}"${x.provider === p ? ' selected' : ''}>${p}</option>`).join('')}
      </select></div><div><label>${label} · модель</label><input id="${type}_${which}_model" value="${esc(x.model || '')}" maxlength="100"></div>`;
  };
  const status = p => data.providers && data.providers[p] ? '✓ ключ подключён' : '✗ ключ не задан на сервере';
  const currencies = Object.entries(s.prices || {}).map(([cur,p]) => `<div class="row">
    <div><label>${cur} · месяц</label><input id="price_${cur}_month" type="number" min="0.01" step="0.01" value="${esc(p.month)}"></div>
    <div><label>${cur} · год</label><input id="price_${cur}_year" type="number" min="0.01" step="0.01" value="${esc(p.year)}"></div></div>`).join('');
  b.innerHTML = `<div class="card">
    <p class="name">ИИ для Premium</p>
    <p class="muted">Ключи не показываются и не сохраняются здесь: GEMINI_API_KEY и OPENAI_API_KEY задаются на сервере.</p>
    <p class="muted">Gemini: ${status('gemini')} · OpenAI: ${status('openai')}</p>
    <label class="check"><input id="aiEnabled" type="checkbox"${s.enabled !== false ? ' checked' : ''}> Генерация включена</label>
    <div class="row">${route('text','primary','Текст · основной')}</div>
    <div class="row">${route('text','backup','Текст · резервный')}</div>
    <div class="row">${route('image','primary','Картинки · основной')}</div>
    <div class="row">${route('image','backup','Картинки · резервный')}</div>
    <div class="row">
      <div><label>Программы / месяц</label><input id="limHeavy" type="number" min="0" value="${esc(lim.heavy)}"></div>
      <div><label>Упражнения / месяц</label><input id="limLight" type="number" min="0" value="${esc(lim.light)}"></div>
      <div><label>Картинки / месяц</label><input id="limImage" type="number" min="0" value="${esc(lim.image)}"></div>
      <div><label>Хранение запросов, дней</label><input id="retention" type="number" min="1" max="30" value="${esc(s.retentionDays || 30)}"></div>
    </div>
    <div class="acts"><button class="b" id="testText">Проверить текстовый ИИ</button><button class="b" id="testImage">Проверить картинки</button></div>
    <p class="err" id="aiResult"></p>
  </div>
  <div class="card"><p class="name">Цена Premium</p>${currencies}</div>
  <div class="card"><p class="name">Платёжная система</p>
    <p class="muted">Поля уже готовы для подключения стора. Само списание включается только после серверной проверки покупки.</p>
    <label>Статус / провайдер</label><input id="payProvider" value="${esc(pay.provider || 'not_connected')}" maxlength="40">
    <div class="row"><div><label>Android · месяц</label><input id="androidMonth" value="${esc(pay.androidMonth || '')}"></div><div><label>Android · год</label><input id="androidYear" value="${esc(pay.androidYear || '')}"></div></div>
    <div class="row"><div><label>iOS · месяц</label><input id="iosMonth" value="${esc(pay.iosMonth || '')}"></div><div><label>iOS · год</label><input id="iosYear" value="${esc(pay.iosYear || '')}"></div></div>
    <p class="err" id="settingsErr"></p><div class="acts"><button class="b ok" id="saveSettings">Сохранить настройки</button></div>
  </div>`;
  $('saveSettings').onclick = saveSettings;
  $('testText').onclick = () => testAI('text');
  $('testImage').onclick = () => testAI('image');
}

function settingsFromForm(){
  const s = JSON.parse(JSON.stringify(data.settings || {}));
  s.enabled = $('aiEnabled').checked;
  ['text','image'].forEach(type => ['primary','backup'].forEach(which => {
    s[type][which] = {provider:$(`${type}_${which}_provider`).value, model:$(`${type}_${which}_model`).value.trim()};
  }));
  s.limits = {heavy:+$('limHeavy').value, light:+$('limLight').value, image:+$('limImage').value};
  s.retentionDays = +$('retention').value;
  Object.keys(s.prices || {}).forEach(cur => { s.prices[cur] = {month:+$(`price_${cur}_month`).value,year:+$(`price_${cur}_year`).value}; });
  s.payment = {provider:$('payProvider').value.trim(),androidMonth:$('androidMonth').value.trim(),androidYear:$('androidYear').value.trim(),iosMonth:$('iosMonth').value.trim(),iosYear:$('iosYear').value.trim()};
  return s;
}
async function saveSettings(){
  try{ const r = await api('save_settings',{settings:settingsFromForm()}); data.settings = r.settings; $('settingsErr').textContent = '✓ Сохранено'; }
  catch(e){ $('settingsErr').textContent = 'Не сохранилось: ' + e.message; }
}
async function testAI(type){
  const el = $('aiResult'); el.textContent = 'Проверяю…';
  try{ await api('save_settings',{settings:settingsFromForm()}); const r = await api('test_ai',{type}); el.textContent = `✓ ${r.provider} / ${r.model}${r.fallback ? ' (резерв)' : ''}: ${r.result}`; }
  catch(e){ el.textContent = '✗ ' + (e.detail || e.message); }
}

let editing = null;
let form = {cover: null, media: {}};   // картинки живут отдельно от полей ввода

/* Уменьшаем картинку прямо в браузере. Не ради экономии места, а потому что
   запись в хранилище не резиновая: три фотографии с телефона по четыре мегабайта
   не поместятся никуда, и отправлять их незачем — на экране они всё равно
   размером с ноготь. */
function shrinkPic(file, maxSide, cb){
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try{ cb(c.toDataURL('image/jpeg', .82)); }catch(e){ cb(null); }
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => cb(null);
  img.src = URL.createObjectURL(file);
}

// Один выбор файла на всю страницу: кто его ждёт, тот и получит.
let pickTo = null;
function pickPic(fn){
  pickTo = fn;
  const f = $('fFile');
  f.value = '';
  f.click();
}

// Названия упражнений — из текста программы. Другого источника нет и не нужно:
// фото привязано к названию, и расходиться им нельзя.
function exNames(){
  const out = [];
  ($('fText').value.match(/^УПРАЖНЕНИЕ:\s*(.+)$/gmi) || []).forEach(l => {
    const n = l.replace(/^УПРАЖНЕНИЕ:\s*/i, '').trim();
    if(n && !out.includes(n)) out.push(n);
  });
  return out;
}

function renderPics(){
  const cover = $('fCoverBox');
  cover.innerHTML = '';
  cover.appendChild(picBox('Обложка', form.cover, d => { form.cover = d; renderPics(); }));

  const names = exNames();
  const box = $('fPics');
  box.innerHTML = '';
  $('fPicsHint').textContent = names.length
    ? 'Нажми на квадрат, чтобы выбрать фото. Картинка уменьшается сама.'
    : 'Названия берутся из текста программы — впиши упражнения, и здесь появятся места под фото.';
  names.forEach(n => box.appendChild(
    picBox(n, form.media[n], d => { if(d) form.media[n] = d; else delete form.media[n]; renderPics(); })));
  // фото упражнений, которых в тексте больше нет, держать незачем
  Object.keys(form.media).forEach(k => { if(!names.includes(k)) delete form.media[k]; });
}

function picBox(label, data, set){
  const el = document.createElement('div');
  el.className = 'pic';
  el.innerHTML = `<div class="ph">${data ? `<img src="${esc(data)}" alt="">` : 'выбрать'}</div>`
    + `<small>${esc(label)}</small>`
    + (data ? '<button class="x" title="Убрать">✕</button>' : '');
  el.querySelector('.ph').onclick = () => pickPic(set);
  const x = el.querySelector('.x');
  if(x) x.onclick = e => { e.stopPropagation(); set(null); };
  return el;
}
function renderAdd(b){
  b.innerHTML = `<div class="card">
    <p class="name" id="formTitle">Новая программа</p>
    <p class="muted">Программа задаётся тем же текстом, что приходит от нейросети и от тренеров.</p>
    <label>Название</label><input id="fName" maxlength="60">
    <div class="row">
      <div><label>Цель</label><select id="fCat">${GOALS.map(g => `<option value="${g[0]}">${g[1]}</option>`).join('')}</select></div>
      <div><label>Уровень</label><select id="fLevel">${LEVELS.map(l => `<option>${l}</option>`).join('')}</select></div>
      <div><label>Минут</label><input id="fMin" type="number" min="1" max="180" value="20"></div>
    </div>
    <label>Ник автора (можно пусто — тогда «от нас»)</label><input id="fBy" maxlength="40" placeholder="@lena.doma">
    <label class="check"><input type="checkbox" id="fPro"> Только по подписке
      <small>Состав будет закрыт заглушкой, добавить себе — только с Премиумом</small></label>
    <label>Что она даёт</label><textarea id="fGives" style="min-height:70px;font-family:inherit;font-size:15px" maxlength="300"></textarea>
    <label>Текст программы</label><textarea id="fText" maxlength="60000" placeholder="ПРОГРАММА: …&#10;ДНИ: Пн, Чт&#10;КРУГИ: 3&#10;&#10;УПРАЖНЕНИЕ: …"></textarea>
    <label>Обложка</label>
    <div class="pics" id="fCoverBox"></div>
    <label>Фото упражнений</label>
    <p class="muted" id="fPicsHint">Названия берутся из текста программы — впиши упражнения, и здесь появятся места под фото.</p>
    <div class="pics" id="fPics"></div>
    <input type="file" id="fFile" accept="image/*" hidden>
    <p class="err" id="fErr"></p>
    <div class="acts">
      <button class="b ok" id="fSave">Сохранить</button>
      <button class="b quiet" id="fClear">Очистить</button>
    </div>
  </div>`;
  $('fSave').onclick = saveForm;
  $('fClear').onclick = () => { editing = null; form = {cover: null, media: {}}; render(); };
  if(editing == null) $('fPro').checked = false;
  // Места под фото пересобираются, пока правишь текст: добавил упражнение — сразу
  // видно, куда класть картинку.
  $('fText').oninput = renderPics;
  $('fFile').onchange = e => {
    const file = e.target.files && e.target.files[0];
    if(!file || !pickTo) return;
    // Обложку режем крупнее: она показывается большим квадратом на странице программы.
    shrinkPic(file, 640, d => { pickTo(d); pickTo = null; });
  };
  renderPics();
}

function fillForm(c){
  editing = c.id;
  form = {cover: c.cover || null, media: Object.assign({}, c.media || {})};
  $('formTitle').textContent = 'Изменить: ' + c.name;
  $('fName').value = c.name || '';
  $('fCat').value = c.cat || 'tone';
  $('fLevel').value = c.level || 'Новичок';
  $('fMin').value = c.min || 20;
  $('fBy').value = c.by || '';
  $('fGives').value = c.gives || '';
  $('fText').value = c.text || '';
  $('fPro').checked = !!c.pro;
  renderPics();
}

async function saveForm(){
  const item = {
    name: $('fName').value.trim(), cat: $('fCat').value, level: $('fLevel').value,
    min: +$('fMin').value, by: $('fBy').value.trim(), gives: $('fGives').value.trim(),
    text: $('fText').value,
    exCount: exNames().length,
    pro: $('fPro').checked,
    cover: form.cover, media: form.media
  };
  try{
    if(editing) await api('edit', {id: editing, item});
    else await api('add', {item});
    editing = null;
    form = {cover: null, media: {}};
    tab = 'approved';
    await load();
  }catch(e){
    $('fErr').textContent = e.miss ? 'Не хватает: ' + e.miss.join(', ') : 'Не сохранилось: ' + e.message;
  }
}

async function act(action, extra){
  try{ await api(action, extra); await load(); }
  catch(e){ alert('Не получилось: ' + e.message); }
}

document.querySelectorAll('.tab[data-tab]').forEach(t => {
  t.onclick = () => {
    tab = t.dataset.tab;
    document.querySelectorAll('.tab[data-tab]').forEach(x => x.classList.toggle('on', x === t));
    render();
  };
});
$('out').onclick = () => { localStorage.removeItem('adminKey'); KEY = ''; showGate(''); };
$('enter').onclick = () => {
  KEY = $('key').value.trim();
  localStorage.setItem('adminKey', KEY);
  load();
};
$('key').onkeydown = e => { if(e.key === 'Enter') $('enter').click(); };

if(KEY) load(); else showGate('');
