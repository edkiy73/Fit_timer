<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fit Timer — админка</title>
<!--
  Админка каталога. Отдельная страница, а не часть приложения: у неё другой
  зритель (один человек), другая задача (разбирать поток) и другой ключ. Внутри
  приложения она была бы кодом, который никогда не выполняется у пользователей,
  но всегда едет им в загрузке.

  Ключ хранится в браузере и уходит заголовком, а не в адресе: адрес попадает
  в историю и в журналы, заголовок — нет.
-->
<style>
  :root{
    color-scheme:light dark;
    --bg:#F4F2FB; --card:#fff; --ink:#1B1630; --muted:#6C6785; --line:#E6E2F2;
    --ok:#1F9D63; --danger:#C22F4C; --warn:#B8791B; --accent:#6B3FE0; --soft:#F0ECFB;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141020;--card:#1E1930;--ink:#EEEAF7;--muted:#9A94B4;--line:#2E2745;
          --ok:#3ED598;--danger:#FF6079;--warn:#F5B93B;--accent:#9C7BFF;--soft:#241E3A}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 10px;
         border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0 0 12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--muted);
       border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin:14px 0}
  .card.ban{opacity:.6}
  .top{display:flex;gap:12px;align-items:flex-start}
  .name{font-size:17px;font-weight:600;margin:0}
  .who{color:var(--accent);font-size:13px;text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer}
  .tags{color:var(--muted);font-size:13px;margin:6px 0 10px}
  .gives{margin:0 0 10px}
  img.cover{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none}
  details{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;
      padding:12px;font-size:12.5px;line-height:1.5;max-height:320px;overflow:auto;margin:10px 0 0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button.b,a.b{border:1px solid var(--line);border-radius:10px;padding:10px 14px;
       font-size:14px;font-weight:600;color:var(--ink);background:var(--card);cursor:pointer;
       text-decoration:none;display:inline-block}
  .b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .b.no{color:var(--danger);border-color:var(--danger)}
  .b.quiet{font-weight:400;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;
        letter-spacing:.06em;text-transform:uppercase}
  input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);
       border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
  textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 140px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .err{color:var(--danger);font-size:13px;margin:8px 0 0}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;
        padding:2px 9px;font-size:11.5px;color:var(--muted);margin-left:6px}
  .pill.ban{color:var(--danger);border-color:var(--danger)}
  .pill.pro{color:var(--accent);border-color:var(--accent)}
  /* Флажок с пояснением: «только по подписке» решает, увидит ли человек состав
     вообще, и одного слова тут мало. */
  /* Общее правило для label делает подписи капсом — здесь это обычная строка,
     а не заголовок поля, поэтому перебиваем: и регистр, и цвет, и раскладку. */
  label.check{
    display:grid;grid-template-columns:20px 1fr;gap:4px 10px;align-items:center;
    margin:14px 0 2px;font-size:15px;color:var(--ink);font-weight:500;
    letter-spacing:0;text-transform:none;cursor:pointer;line-height:1.35;
  }
  label.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
  label.check small{
    grid-column:2;font-weight:400;color:var(--muted);font-size:12.5px;
    letter-spacing:0;text-transform:none;line-height:1.4;
  }
  .gate{max-width:380px;margin:80px auto;padding:0 16px}
  .lang-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;background:var(--bg)}
  .lang-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .lang-head b{font-size:15px}
  .lang-state{font-size:12px;color:var(--muted)}
  .lang-state.ok{color:var(--ok)}
  .translate-tools{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .translate-box{margin-top:10px}
  .translate-box textarea{min-height:110px}
  /* Картинки. Правка каталога без них — полдела: обложка решает, откроют ли строку,
     а фото упражнения объясняет движение быстрее любого описания. */
  .pics{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .pic{position:relative;width:88px}
  .pic .ph{width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--soft);
           border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
           color:var(--muted);font-size:11px;text-align:center;cursor:pointer;padding:6px}
  .pic .ph img{width:100%;height:100%;object-fit:cover}
  .pic small{display:block;font-size:11px;color:var(--muted);margin-top:4px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pic .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
          border:1px solid var(--line);background:var(--card);color:var(--danger);
          font-size:13px;line-height:1;cursor:pointer;padding:0}

  /* Рабочая админка: desktop sidebar + mobile drawer. */
  body{padding:0}
  .admin-shell{min-height:100vh}
  .side{
    position:fixed;inset:0 auto 0 0;width:228px;background:var(--card);
    border-right:1px solid var(--line);padding:18px 12px;z-index:30;overflow:auto
  }
  .brand-admin{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 18px}
  .brand-admin b{font-size:16px}
  .nav-group{margin:12px 0 18px}
  .nav-label{padding:0 10px 6px;color:var(--muted);font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase}
  .nav-btn{
    width:100%;border:0;background:transparent;color:var(--ink);border-radius:10px;
    padding:9px 10px;margin:2px 0;text-align:left;font:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:8px
  }
  .nav-btn:hover{background:var(--soft)}
  .nav-btn.on{background:var(--soft);color:var(--accent);font-weight:700}
  .nav-count{min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;
    background:var(--bg);font-size:11px;color:var(--muted)}
  .nav-btn.on .nav-count{color:var(--accent)}
  .main{margin-left:228px;min-width:0}
  .topbar-admin{
    position:sticky;padding:0;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)
  }
  .topbar-inner{max-width:980px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .topbar-inner h1{font-size:18px;margin:0}
  .topbar-inner small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
  .menu-btn{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
  .content{max-width:980px;margin:auto;padding:14px 20px 72px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 12px}
  .page-head h2{font-size:20px;line-height:1.2;margin:0}
  .page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .card{padding:13px;margin:9px 0;border-radius:12px}
  .list-card{padding:12px}
  .list-card .tags{margin:3px 0 6px}
  .list-card .gives{font-size:13px;margin:5px 0}
  .list-card .acts{margin-top:9px}
  button.b,a.b{padding:8px 11px;border-radius:9px;font-size:13px}
  .acts{gap:6px;margin-top:10px}
  label{margin-top:8px}
  input,select,textarea{padding:10px 11px;border-radius:9px}
  textarea{min-height:100px}
  .row{gap:8px}
  .section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .section-grid .card{margin:0}
  .status-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .status-chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;
    padding:4px 8px;font-size:12px;color:var(--muted)}
  .status-chip.ok{color:var(--ok)}
  .sticky-save{
    position:sticky;bottom:10px;z-index:15;margin:14px 0 0;padding:0;
    background:transparent;border:0;box-shadow:none;backdrop-filter:none;
    display:flex;align-items:center;justify-content:flex-end;gap:10px
  }
  .sticky-save .save-state{color:var(--muted);font-size:12px;min-height:18px}
  .sticky-save .save-actions{display:flex;gap:6px;margin-left:auto}
  .compact-note{margin:4px 0;color:var(--muted);font-size:12px}
  .nav-shade{display:none}
  .gate .card{padding:18px}
  @media(max-width:760px){
    .side{transform:translateX(-102%);transition:transform .2s ease;width:min(84vw,300px);
      box-shadow:18px 0 45px rgba(0,0,0,.22)}
    .side.open{transform:none}
    .nav-shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;
      opacity:0;pointer-events:none;transition:opacity .2s}
    body.nav-open .nav-shade{opacity:1;pointer-events:auto}
    .main{margin-left:0}
    .menu-btn{display:block;flex:none}
    .topbar-inner{padding:10px 12px}
    .content{padding:10px 10px 72px}
    .page-head{align-items:flex-start;margin-top:2px}
    .page-head h2{font-size:18px}
    .section-grid{grid-template-columns:1fr}
    .card{padding:11px;margin:7px 0;border-radius:11px}
    .list-card{padding:10px}
    img.cover{width:48px;height:48px;border-radius:8px}
    .name{font-size:15px}
    .tags,.muted{font-size:12px}
    .gives{font-size:13px}
    .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
    .acts .b{width:100%;text-align:center;padding:9px 8px}
    .row{display:grid;grid-template-columns:1fr}
    .row>*{min-width:0}
    .lang-card{padding:10px;margin:9px 0}
    .sticky-save{bottom:8px;margin:12px 0 0;padding:0}
    .sticky-save .save-actions{display:grid;grid-auto-flow:column}
    .pics{gap:8px}
    .pic,.pic .ph{width:74px}
    .pic .ph{height:74px}
    pre{max-height:240px;padding:9px}
  }


  /* Workbench UI: lists are tables, forms are grouped, secondary actions stay quiet. */
  .toolbar{display:flex;align-items:center;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
  .toolbar .grow{flex:1 1 240px}
  .toolbar input,.toolbar select{background:var(--card)}
  .inline-create{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;align-items:end}
  .table-shell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:visible}
  .data-table{width:100%;border-collapse:collapse;font-size:13px}
  .data-table th{padding:9px 11px;text-align:left;color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--line)}
  .data-table td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
  .data-table tr:last-child td{border-bottom:0}
  .data-table tr.ban{opacity:.58}
  .data-table tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
  .cell-main{font-weight:650;color:var(--ink);line-height:1.25}
  .cell-sub{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.3}
  .cell-cover{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--soft);display:block}
  .cell-cover.empty{display:grid;place-items:center;color:var(--muted);font-size:10px}
  .td-actions{width:44px;text-align:right;position:relative}
  details.row-menu{position:relative;display:inline-block}
  details.row-menu>summary{list-style:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:17px}
  details.row-menu>summary::-webkit-details-marker{display:none}
  .row-menu-pop{position:fixed;z-index:80;min-width:190px;padding:5px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 38px rgba(0,0,0,.18)}
  .row-menu-pop button,.row-menu-pop a{display:block;width:100%;border:0;background:transparent;color:var(--ink);
    text-decoration:none;text-align:left;padding:9px 10px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
  .row-menu-pop button:hover,.row-menu-pop a:hover{background:var(--soft)}
  .row-menu-pop .danger{color:var(--danger)}
  .row-menu-pop .positive{color:var(--ok)}
  .metric{font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;padding:3px;background:var(--soft);border-radius:9px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 10px;
    font:inherit;font-size:12px;font-weight:650;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
  .form-card-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;gap:10px}
  .form-card-head h3{font-size:14px;margin:0}
  .form-card-body{padding:12px 14px}
  .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .field-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .field-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .field-grid label{margin-top:0}
  .inline-switch{display:flex;align-items:center;gap:8px;min-height:40px}
  .inline-switch input{width:18px;height:18px;accent-color:var(--accent)}
  .inline-switch span{font-size:13px}
  .lang-pane[hidden]{display:none!important}
  .editor-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .editor-tools .b{padding:7px 9px}
  .program-text{min-height:260px}
  .compact-text{min-height:74px;font-family:inherit;font-size:14px}
  details.form-fold{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  details.form-fold>summary{padding:12px 14px;border:0;margin:0;color:var(--ink);font-weight:650;font-size:14px}
  details.form-fold[open]>summary{border-bottom:1px solid var(--line)}
  .fold-body{padding:12px 14px}
  .route-table{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px 10px;align-items:end}
  .route-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
  .route-label{font-weight:650;padding-bottom:10px}
  .pair{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px}
  .price-table input,.payment-table input,.payment-table select{min-width:0;padding:8px 9px}
  .price-table td:first-child,.payment-table td:first-child{font-weight:650}
  .toggle{width:18px!important;height:18px;accent-color:var(--accent)}
  .channel-row{display:flex;align-items:center;gap:14px;min-height:38px;flex-wrap:wrap}
  .channel-row label{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:13px;
    text-transform:none;letter-spacing:0}
  .channel-row input{width:18px;height:18px;accent-color:var(--accent)}
  .danger-text{color:var(--danger)}
  .mobile-only{display:none}
  @media(max-width:760px){
    .toolbar{margin:5px 0 9px}
    .inline-create{grid-template-columns:1fr auto}
    .table-shell{border-radius:10px;overflow:visible}
    .data-table thead{display:none}
    .data-table,.data-table tbody,.data-table tr,.data-table td{display:block;width:100%}
    .data-table tr{position:relative;padding:9px 42px 9px 10px;border-bottom:1px solid var(--line)}
    .data-table tr:last-child{border-bottom:0}
    .data-table td{padding:2px 0;border:0}
    .data-table td[data-label]:before{content:attr(data-label) ' · ';color:var(--muted);font-size:11px}
    .data-table .td-primary{padding-bottom:5px}
    .data-table .td-actions{position:absolute;right:8px;top:8px;width:32px;padding:0}
    .data-table .td-cover{float:left;width:50px;margin-right:9px}
    .data-table .td-cover+.td-primary{min-height:46px}
    .cell-cover{width:42px;height:42px}
    .row-menu-pop{min-width:190px;max-width:calc(100vw - 16px);
      border-radius:10px;padding:6px;box-shadow:0 14px 50px rgba(0,0,0,.32)}
    .price-table tr{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr);gap:6px 8px}
    .price-table tr .td-primary{grid-column:1;grid-row:1}
    .price-table tr td:nth-child(2){grid-column:2;grid-row:1}
    .price-table tr td:nth-child(3){grid-column:3;grid-row:1}
    .price-table tr td:nth-child(4){grid-column:2/4;grid-row:2;padding-top:0}
    .price-table tr td:nth-child(2):before{content:'Месяц';display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
    .price-table tr td:nth-child(3):before{content:'Год';display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
    .row-menu-pop button,.row-menu-pop a{padding:11px 12px;font-size:14px}
    .field-grid,.field-grid.three,.field-grid.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .field-grid .wide{grid-column:1/-1}
    .route-table{grid-template-columns:1fr}
    .route-head{display:none}
    .route-label{padding:8px 0 0}
    .pair{grid-template-columns:110px minmax(0,1fr)}
    .form-card-head,.form-card-body,.fold-body{padding:10px}
    details.form-fold>summary{padding:10px}
    .program-text{min-height:220px}
    .desktop-only{display:none!important}
    .mobile-only{display:block}
    .sticky-save .save-state{max-width:42%;line-height:1.2}
  }
  @media(max-width:430px){
    .field-grid,.field-grid.three,.field-grid.four{grid-template-columns:1fr 1fr}
    .inline-create{grid-template-columns:1fr}
    .inline-create .b{width:100%}
    .pair{grid-template-columns:105px minmax(0,1fr)}
  }


  .user-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .user-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
  .user-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-right:38px}
  .user-card-email{font-size:14px;font-weight:700;line-height:1.25;word-break:break-word}
  .user-card-handle{font-size:12px;color:var(--muted);margin-top:2px}
  .user-card .td-actions{position:absolute;right:10px;top:10px;width:32px}
  .user-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
  .user-meta-item{background:var(--soft);border-radius:9px;padding:7px 8px;min-width:0}
  .user-meta-item b{display:block;font-size:12px;line-height:1.2}
  .user-meta-item span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ai-box{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}

<body>
<div id="gate" class="gate" hidden>
  <h1>Админка Fit Timer</h1>
  <p class="muted">Введи ключ. Он хранится только в этом браузере.</p>
  <label>Ключ</label>
  <input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY">
  <p class="err" id="gateErr"></p>
  <div class="acts"><button class="b ok" id="enter">Войти</button></div>
</div>

<div id="app" hidden>
  <div class="admin-shell">
    <aside class="side" id="adminNav">
      <div class="brand-admin"><b>FIT / ADMIN</b><button class="b quiet" id="out">Выйти</button></div>
      <div class="nav-group">
        <div class="nav-label">Каталог</div>
        <button class="nav-btn on" data-tab="pending"><span>На проверке</span><span class="nav-count" id="nPending"></span></button>
        <button class="nav-btn" data-tab="approved"><span>В каталоге</span><span class="nav-count" id="nApproved"></span></button>
        <button class="nav-btn" data-tab="add"><span>Добавить программу</span></button>
        <button class="nav-btn" data-tab="trainers"><span>Тренеры</span><span class="nav-count" id="nTrainers"></span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Аккаунты</div>
        <button class="nav-btn" data-tab="users"><span>Пользователи</span></button>
        <button class="nav-btn" data-tab="campaigns"><span>Рассылки</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Система</div>
        <button class="nav-btn" data-tab="ai"><span>ИИ</span></button>
        <button class="nav-btn" data-tab="pricing"><span>Premium и цены</span></button>
        <button class="nav-btn" data-tab="payments"><span>Платежи</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar-admin">
        <div class="topbar-inner">
          <button class="menu-btn" id="navOpen" aria-label="Меню">☰</button>
          <div><h1 id="pageTitle">На проверке</h1><small>Fit Timer · админка</small></div>
        </div>
      </header>
      <div class="content" id="body"></div>
    </main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const GOALS = [['slim','Похудеть'],['tone','Подтянуть всё тело'],['glut','Ягодицы и пресс'],
  ['core','Плоский живот'],['power','Сила и выносливость'],['relief','Рельеф мышц'],
  ['flex','Растяжка и гибкость'],['back','Осанка и спина'],['post','После родов'],
  ['cardio','Кардио и энергия']];
const LEVELS = ['Новичок','Средний','Продвинутый'];
const goalName = id => (GOALS.find(g => g[0] === id) || [id, id])[1];

const LANGS = ['ru','en'];
const langName = lang => lang === 'en' ? 'EN' : 'RU';
function sourceLocaleOf(c){
  if(c && (c.sourceLocale === 'ru' || c.sourceLocale === 'en')) return c.sourceLocale;
  if(c && c.locales && c.locales.en && !c.locales.ru) return 'en';
  return 'ru';
}
function localeBlock(c, lang){
  const hit = c && c.locales && c.locales[lang];
  if(hit) return {name:hit.name || '', gives:hit.gives || '', text:hit.text || ''};
  const source = sourceLocaleOf(c);
  if(c && lang === source) return {name:c.name || '', gives:c.gives || '', text:c.text || ''};
  if(c && !c.locales && lang === 'ru') return {name:c.name || '', gives:c.gives || '', text:c.text || ''};
  return {name:'', gives:'', text:''};
}
function localeReady(c, lang){
  const x = localeBlock(c, lang);
  return x.name.trim().length >= 3 && x.gives.trim().length >= 20 && x.text.length >= 60;
}
function localeMarks(c){
  return LANGS.map(lang => langName(lang) + ' ' + (localeReady(c, lang) ? '✓' : '—')).join(' · ');
}
function translationPrompt(source, from, to){
  const names = {ru:'Russian', en:'English'};
  return 'Translate this Fit Timer catalog entry from ' + names[from] + ' to ' + names[to] + '.\n'
    + 'Return ONLY valid JSON with exactly the keys name, gives, text.\n'
    + 'Inside text keep every protocol label before the colon exactly unchanged (ПРОГРАММА, ДНИ, КРУГИ, УПРАЖНЕНИЕ, ОПИСАНИЕ, ФОРМАТ, ЗНАЧЕНИЕ, ПОДХОДЫ, ОТДЫХ, ШАГ, ПОТОЛОК and the other service labels).\n'
    + 'Keep line order, blank lines, numbers, day tokens, boolean/control values and format values unchanged. Translate only human-readable names and prose. Do not add/remove/reorder exercises or change workout mechanics.\n\nSOURCE JSON:\n'
    + JSON.stringify(source, null, 2);
}

let KEY = localStorage.getItem('adminKey') || '';
let data = {pending: [], approved: [], trainers: [], settings: null, providers: {}};
let usersCache = null;
const savedTab = localStorage.getItem('adminTab');
let tab = ['pending','approved','add','trainers','users','campaigns','ai','pricing','payments'].includes(savedTab) ? savedTab : 'pending';

const PAGE_TITLES = {
  pending:'На проверке', approved:'Каталог', add:'Добавить программу', trainers:'Тренеры',
  users:'Пользователи', campaigns:'Рассылки', ai:'ИИ', pricing:'Premium и цены', payments:'Платежи'
};
function closeNav(){
  document.body.classList.remove('nav-open');
  $('adminNav').classList.remove('open');
}
function setTab(next){
  closeRowMenus();
  tab = next;
  localStorage.setItem('adminTab', tab);
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  $('pageTitle').textContent = PAGE_TITLES[tab] || 'Админка';
  closeNav();
  render();
}
function closeRowMenus(except){
  document.querySelectorAll('details.row-menu[open]').forEach(d=>{if(d!==except)d.open=false;});
}
function positionRowMenu(details){
  const summary=details.querySelector('summary'), pop=details.querySelector('.row-menu-pop');
  if(!summary||!pop||!details.open)return;
  const r=summary.getBoundingClientRect();
  pop.style.visibility='hidden';
  pop.style.left='0px'; pop.style.top='0px';
  requestAnimationFrame(()=>{
    const w=pop.offsetWidth||200,h=pop.offsetHeight||160,gap=6,pad=8;
    let left=Math.min(window.innerWidth-pad-w,Math.max(pad,r.right-w));
    let top=r.bottom+gap;
    if(top+h>window.innerHeight-pad) top=Math.max(pad,r.top-gap-h);
    pop.style.left=Math.round(left)+'px';
    pop.style.top=Math.round(top)+'px';
    pop.style.visibility='visible';
  });
}
function wireRowMenus(root){
  (root||document).querySelectorAll('details.row-menu').forEach(d=>{
    if(d.dataset.wired)return;
    d.dataset.wired='1';
    d.addEventListener('toggle',()=>{
      if(d.open){closeRowMenus(d);positionRowMenu(d);}
      else{
        const pop=d.querySelector('.row-menu-pop');
        if(pop)pop.style.visibility='';
      }
    });
    const pop=d.querySelector('.row-menu-pop');
    if(pop)pop.addEventListener('click',()=>{d.open=false;});
  });
}
function openTrainerInAdmin(handle){
  setTab('trainers');
  requestAnimationFrame(()=>{
    const s=$('trainerSearch');
    if(s){s.value=handle||'';s.dispatchEvent(new Event('input'));}
  });
}

async function api(action, extra){
  const res = await fetch('/api/admin', {
    method: 'POST',
    // Ключ кодируем: в заголовок можно положить только ASCII, и ключ с кириллицей
    // или пробелом ронял САМ запрос — человек видел «нет связи» вместо «ключ не тот».
    headers: {'Content-Type': 'application/json', 'X-Admin-Key': encodeURIComponent(KEY)},
    cache: 'no-store',
    body: JSON.stringify(Object.assign({action}, extra || {}))
  });
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw Object.assign(new Error(j.error || res.status), j);
  return j;
}

function showGate(msg){
  $('app').hidden = true; $('gate').hidden = false;
  $('gateErr').textContent = msg || '';
  $('key').value = '';
}

async function load(){
  try{
    data = await api('overview');
  }catch(e){
    if(e.message === 'bad_key') return showGate('Ключ не подошёл.');
    if(e.message === 'no_admin_key') return showGate('На сервере не задана переменная ADMIN_KEY.');
    if(e.message === 'no_store') return showGate('Хранилище не подключено — см. /api/health');
    return showGate('Не получилось связаться с сервером.');
  }
  $('gate').hidden = true; $('app').hidden = false;
  $('nPending').textContent = data.pending.length || '';
  $('nApproved').textContent = data.approved.length || '';
  $('nTrainers').textContent = data.trainers.length || '';
  if(tab !== 'users') usersCache = null;
  $('pageTitle').textContent = PAGE_TITLES[tab] || 'Админка';
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  render();
  if(tab === 'add'){
    const editId=localStorage.getItem('adminEditingId');
    const item=[...(data.pending||[]),...(data.approved||[])].find(x=>String(x.id)===String(editId));
    if(item) fillForm(item);
  }
}

function pageHead(title, text, right){
  return `<div class="page-head"><div><h2>${title}</h2><p>${text||''}</p></div>${right||''}</div>`;
}
const fmtDay = v => v ? new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}) : '—';

function render(){
  const b = $('body');
  b.innerHTML = '';
  if(tab === 'add') return renderAdd(b);
  if(tab === 'trainers') return renderTrainers(b);
  if(tab === 'users') return renderUsers(b);
  if(tab === 'campaigns') return renderCampaigns(b);
  if(tab === 'ai') return renderAI(b);
  if(tab === 'pricing') return renderPricing(b);
  if(tab === 'payments') return renderPayments(b);
  return renderCatalog(b);
}

function renderCatalog(b){
  const pending=tab==='pending';
  const list=(pending?data.pending:data.approved).slice().reverse();
  b.innerHTML=pageHead(
    pending?'На проверке':'Каталог',
    pending?'Заявки тренеров: локализации, доступ и модерация.':'Опубликованные программы и доступ Premium.',
    !pending?'<button class="b ok" id="catalogAdd">+ Добавить</button>':''
  );
  if(!pending)$('catalogAdd').onclick=()=>setTab('add');
  if(!list.length){
    b.insertAdjacentHTML('beforeend',`<div class="empty">${pending?'Новых заявок нет.':'В каталоге пока ничего нет.<br><br><button class="b" id="seed">Залить пять тестовых программ</button>'}</div>`);
    const sd=$('seed');if(sd)sd.onclick=()=>act('seed',{});
    return;
  }
  b.insertAdjacentHTML('beforeend',`
    <div class="toolbar"><div class="grow"><input id="catalogSearch" type="search" placeholder="Поиск по программе или автору"></div><span class="status-chip">${list.length} шт.</span></div>
    <div class="entity-grid" id="catalogCards"></div>`);
  const box=$('catalogCards');

  list.forEach(item=>{
    const ready=localeReady(item,'ru')&&localeReady(item,'en');
    const card=document.createElement('article');
    card.className='entity-card';
    card.dataset.search=((item.name||'')+' '+(item.by||'')+' '+goalName(item.cat)).toLowerCase();
    const cover=item.cover?`<img class="catalog-cover" src="${esc(item.cover)}" alt="">`:'<span class="catalog-cover empty">FIT</span>';
    const menu=pending
      ? `<details class="row-menu"><summary>•••</summary><div class="row-menu-pop">
          <button data-act="edit">Проверить и изменить</button>
          ${ready?'<button class="positive" data-act="approve">В каталог</button><button class="positive" data-act="approvePro">В Premium</button>':''}
          <button class="danger" data-act="reject">Отклонить</button>
          ${item.by?'<button class="danger" data-act="ban">Закрыть автора</button>':''}
        </div></details>`
      : `<details class="row-menu"><summary>•••</summary><div class="row-menu-pop">
          <button data-act="edit">Изменить</button>
          <button data-act="togglePro">${item.pro?'Открыть всем':'Сделать Premium'}</button>
          <button class="danger" data-act="remove">Убрать из каталога</button>
          ${item.by?'<button class="danger" data-act="ban">Закрыть автора</button>':''}
        </div></details>`;

    card.innerHTML=`
      <div class="entity-card-head">
        ${cover}
        <div style="min-width:0;flex:1">
          <div class="entity-card-title">${esc(item.name||'Без названия')}</div>
          <div class="entity-card-sub">${esc(item.gives||'').slice(0,120)}</div>
        </div>
      </div>
      <div class="td-actions">${menu}</div>
      <div class="entity-tags">
        <span class="status-chip">${esc(goalName(item.cat))}</span>
        <span class="status-chip">${esc(item.level)}</span>
        <span class="status-chip">${item.min||0} мин</span>
        <span class="status-chip ${ready?'ok':''}">${esc(localeMarks(item))}</span>
        ${item.pro?'<span class="pill pro">Premium</span>':'<span class="status-chip">Free</span>'}
      </div>
      <div class="entity-meta">
        <div><b>${item.exCount||0}</b><span>упражнений</span></div>
        <div><b>${item.media?Object.keys(item.media).length:0}</b><span>фото</span></div>
        <div><b>${item.by?`<button class="who" data-trainer="${esc(item.by)}">${esc(item.by)}</button>`:'Fit Timer'}</b><span>автор</span></div>
      </div>`;

    const author=card.querySelector('[data-trainer]');
    if(author)author.onclick=()=>openTrainerInAdmin(author.dataset.trainer);
    card.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>{
      const a=btn.dataset.act;
      if(a==='edit'){setTab('add');fillForm(item);return;}
      if(a==='approve')return act('approve',{id:item.id,pro:false});
      if(a==='approvePro')return act('approve',{id:item.id,pro:true});
      if(a==='reject')return act('reject',{id:item.id});
      if(a==='togglePro')return act('pro',{id:item.id,pro:!item.pro});
      if(a==='remove'&&confirm(`Убрать «${item.name}» из каталога?`))return act('remove',{id:item.id});
      if(a==='ban'&&confirm(`Закрыть ${item.by}? Его программы больше не будут приниматься.`))return act('ban',{handle:item.by});
    });
    box.appendChild(card);
  });

  wireRowMenus(box);
  $('catalogSearch').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    box.querySelectorAll('.entity-card').forEach(card=>card.hidden=!!q&&!card.dataset.search.includes(q));
  };
}

function renderTrainers(b){
  const list=data.trainers.slice().reverse();
  b.innerHTML=pageHead('Тренеры','Публичные профили, активность и доступ к отправке программ.');
  if(!list.length){b.insertAdjacentHTML('beforeend','<div class="empty">Тренеров пока нет.</div>');return;}
  b.insertAdjacentHTML('beforeend',`
    <div class="toolbar"><div class="grow"><input id="trainerSearch" type="search" placeholder="Поиск по имени или нику"></div><span class="status-chip">${list.length} тренеров</span></div>
    <div class="entity-grid" id="trainerCards"></div>`);
  const box=$('trainerCards');
  list.forEach(t=>{
    const card=document.createElement('article');
    card.className='entity-card'+(t.banned?' ban':'');
    card.dataset.search=((t.name||'')+' '+(t.handle||'')).toLowerCase();
    card.innerHTML=`
      <div class="entity-card-head">
        <div style="min-width:0;flex:1">
          <div class="entity-card-title">${esc(t.name||t.handle)}</div>
          <div class="entity-card-sub"><button class="who" type="button" data-open-trainer="${esc(t.handle)}">${esc(t.handle)}</button></div>
        </div>
        ${t.banned?'<span class="pill ban">закрыт</span>':'<span class="status-chip ok">активен</span>'}
      </div>
      <div class="td-actions"><details class="row-menu"><summary>•••</summary><div class="row-menu-pop">
        <button class="${t.banned?'positive':'danger'}" data-toggle>${t.banned?'Вернуть доступ':'Закрыть приём программ'}</button>
      </div></details></div>
      ${t.about?`<div class="entity-card-sub" style="margin-top:8px">${esc(t.about)}</div>`:''}
      <div class="entity-meta">
        <div><b>${t.years?esc(t.years)+' лет':'—'}</b><span>стаж</span></div>
        <div><b>${t.programs||0}</b><span>программ</span></div>
        <div><b>${t.opens||0}</b><span>добавили</span></div>
      </div>
      <div class="entity-tags">
        <span class="status-chip">активность · ${esc(fmtDay(t.seen))}</span>
        <span class="status-chip">с ${esc(fmtDay(t.since))}</span>
      </div>`;
    card.querySelector('[data-toggle]').onclick=()=>act(t.banned?'unban':'ban',{handle:t.handle});
    const oh=card.querySelector('[data-open-trainer]');if(oh)oh.onclick=()=>openTrainerInAdmin(t.handle);
    box.appendChild(card);
  });
  wireRowMenus(box);
  $('trainerSearch').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    box.querySelectorAll('.entity-card').forEach(card=>card.hidden=!!q&&!card.dataset.search.includes(q));
  };
}

async function renderUsers(b){
  b.innerHTML=pageHead('Пользователи','Аккаунты, Premium, AI-лимиты и тестовый вход.')+`
    <div class="toolbar">

async function sendCampaign(){
  const btn=$('campSend'),state=$('campState');
  const copy={
    ru:{title:$('campRuTitle').value.trim(),body:$('campRuBody').value.trim()},
    en:{title:$('campEnTitle').value.trim(),body:$('campEnBody').value.trim()}
  };
  if(!copy.ru.title||!copy.ru.body||!copy.en.title||!copy.en.body){alert('Заполни RU и EN тексты.');return;}
  if(!$('campPush').checked&&!$('campEmail').checked){alert('Выбери хотя бы один канал.');return;}
  if(!confirm('Запустить рассылку?'))return;
  btn.disabled=true;
  let cursor=0,total=0,pushSent=0,emailSent=0,skipped=0,failed=0;
  try{
    do{
      const r=await api('campaign_send',{kind:$('campKind').value,push:$('campPush').checked,email:$('campEmail').checked,copy,cursor});
      cursor=r.cursor;total=r.total;pushSent+=r.pushSent||0;emailSent+=r.emailSent||0;skipped+=r.skipped||0;failed+=r.failed||0;
      state.textContent=`Обработано ${Math.min(cursor,total)} / ${total} · Push ${pushSent} · Email ${emailSent} · пропущено ${skipped} · ошибок ${failed}`;
      if(r.done)break;
    }while(true);
    state.textContent+=' · готово';
  }catch(e){alert('Рассылка остановлена: '+e.message);}
  finally{btn.disabled=false;}
}

/* Уменьшаем картинку прямо в браузере. Не ради экономии места, а потому что
   запись в хранилище не резиновая: три фотографии с телефона по четыре мегабайта
   не поместятся никуда, и отправлять их незачем — на экране они всё равно
   размером с ноготь. */
function shrinkPic(file, maxSide, cb){
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try{ cb(c.toDataURL('image/jpeg', .82)); }catch(e){ cb(null); }
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => cb(null);
  img.src = URL.createObjectURL(file);
}

// Названия упражнений — из текста программы. Другого источника нет и не нужно:
// фото привязано к названию, и расходиться им нельзя.
function exerciseBlocks(lang){
  const field=lang==='en' ? $('fTextEn') : $('fTextRu');
  const text=field?field.value:'';
  const lines=text.split(/\r?\n/);
  const starts=[];
  lines.forEach((line,i)=>{if(/^УПРАЖНЕНИЕ:\s*/i.test(line))starts.push(i);});
  return starts.map((start,idx)=>{
    const end=idx+1<starts.length?starts[idx+1]:lines.length;
    const chunk=lines.slice(start,end);
    const value=key=>{
      const row=chunk.find(x=>new RegExp('^'+key+':\\s*','i').test(x));
      return row?row.replace(new RegExp('^'+key+':\\s*','i'),'').trim():'';
    };
    return {
      name:value('УПРАЖНЕНИЕ'),
      description:value('ОПИСАНИЕ'),
      format:value('ФОРМАТ'),
      value:value('ЗНАЧЕНИЕ'),
      start,end
    };
  }).filter(x=>x.name);
}

  return exerciseBlocks(form.sourceLocale).map(x=>x.name);
}

async function translateCatalogForm(from,to){
  pasteDirection={from,to};
  $('fErr').textContent='Перевожу '+langName(from)+' → '+langName(to)+'…';
  try{
    const r=await api('translate_catalog',{from,to,locale:localeFromForm(from)});
    setLocaleForm(to,r.locale||{});
    updateLocaleStates();renderExerciseCards();renderPics();
    $('fErr').textContent='✓ Перевод '+langName(from)+' → '+langName(to)+' готов. Проверь перед сохранением.';
  }catch(e){
    $('fErr').textContent='ИИ не перевёл: '+(e.detail||e.message)+'. Можно вставить перевод вручную.';
  }
}
async function copyTranslationSource(){
  const from=editorLang,to=editorLang==='ru'?'en':'ru';
  pasteDirection={from,to};
  const txt=translationPrompt(localeFromForm(from),from,to);
  try{
    await navigator.clipboard.writeText(txt);
    $('fErr').textContent='✓ Промпт '+langName(from)+' → '+langName(to)+' скопирован.';
  }catch(e){
    $('fPasteJson').value=txt;$('fPasteWrap').hidden=false;
    $('fErr').textContent='Буфер недоступен — текст показан ниже.';
  }
}
function applyPastedTranslation(){
  const d=pasteDirection;
  let raw=$('fPasteJson').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  try{
    const x=JSON.parse(raw);
    setLocaleForm(d.to,x);
    $('fPasteWrap').hidden=true;$('fPasteJson').value='';
    updateLocaleStates();renderExerciseCards();renderPics();
    $('fErr').textContent='✓ Перевод вставлен.';
  }catch(e){$('fErr').textContent='Не получилось прочитать JSON. Нужны поля name, gives и text.';}
}
async function aiEditProgram(lang,exercise){
  const question=exercise
    ? 'Что изменить в упражнении «'+exercise+'»?'
    : 'Что изменить в программе '+langName(lang)+'?';
  const instruction=prompt(question,'');
  if(!instruction)return;
  $('fErr').textContent=exercise?'ИИ редактирует упражнение…':'ИИ редактирует программу…';
  try{
    const r=await api('catalog_ai_edit',{
      mode:exercise?'exercise':'program',
      locale:localeFromForm(lang),
      exercise:exercise||'',
      instruction
    });
    setLocaleForm(lang,r.locale||{});
    updateLocaleStates();renderExerciseCards();renderPics();
    $('fErr').textContent='✓ Изменения ИИ применены к '+langName(lang)+'. Проверь и сохрани.';
  }catch(e){$('fErr').textContent='ИИ не изменил: '+(e.detail||e.message);}
}
function renderExerciseCards(){
  const box=$('exerciseCards');if(!box)return;
  const list=exerciseBlocks(editorLang);
  box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="compact-note">Упражнения появятся здесь после заполнения протокола.</div>';return;}
  list.forEach(ex=>{
    const card=document.createElement('div');
    card.className='exercise-card';
    card.innerHTML=`
      <div class="exercise-card-head"><div class="exercise-card-title">${esc(ex.name)}</div><button class="b quiet" type="button">Изменить через ИИ</button></div>
      ${ex.description?`<p>${esc(ex.description)}</p>`:''}
      ${ex.format||ex.value?`<div class="entity-tags"><span class="status-chip">${esc(ex.format||'формат')}</span>${ex.value?`<span class="status-chip">${esc(ex.value)}</span>`:''}</div>`:''}`;
    card.querySelector('button').onclick=()=>aiEditProgram(editorLang,ex.name);
    box.appendChild(card);
  });
}
function shrinkGeneratedPic(data,cb){
  const img=new Image();
  img.onload=()=>{
    const maxSide=640,k=Math.min(1,maxSide/Math.max(img.width,img.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*k));canvas.height=Math.max(1,Math.round(img.height*k));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    try{cb(canvas.toDataURL('image/jpeg',.82));}catch(_){cb(data);}
  };
  img.onerror=()=>cb(data);img.src=data;
}
async function generateCatalogPic(kind,name,description,set,el){
  const ph=el&&el.querySelector('.ph');if(ph)ph.classList.add('generating');
  $('fErr').textContent='Генерирую '+(kind==='cover'?'обложку':'фото «'+name+'»')+'…';
  try{
    const r=await api('catalog_ai_image',{kind,name,description,program:localeFromForm(form.sourceLocale).name});
    shrinkGeneratedPic(r.image,pic=>{set(pic);$('fErr').textContent='✓ Картинка готова. Не забудь сохранить программу.';});
  }catch(e){
    if(ph)ph.classList.remove('generating');
    $('fErr').textContent='ИИ не сгенерировал картинку: '+(e.detail||e.message);
  }
}
async function generateMedia(mode){
  const source=form.sourceLocale;
  const exercises=exerciseBlocks(source);
  const jobs=[];
  if(mode==='all'||!form.cover)jobs.push({kind:'cover',name:'',description:'',set:d=>{form.cover=d;}});
  exercises.forEach(ex=>{
    if(mode==='all'||!form.media[ex.name])jobs.push({kind:'exercise',name:ex.name,description:ex.description,set:d=>{form.media[ex.name]=d;}});
  });
  if(!jobs.length){$('fErr').textContent='Все изображения уже есть.';return;}
  for(let i=0;i<jobs.length;i++){
    const j=jobs[i];
    $('fErr').textContent='Генерация изображений '+(i+1)+' / '+jobs.length+'…';
    try{
      const r=await api('catalog_ai_image',{kind:j.kind,name:j.name,description:j.description,program:localeFromForm(source).name});
      await new Promise(resolve=>shrinkGeneratedPic(r.image,pic=>{j.set(pic);renderPics();resolve();}));
    }catch(e){$('fErr').textContent='Остановлено на '+(i+1)+' / '+jobs.length+': '+(e.detail||e.message);return;}
  }
  $('fErr').textContent='✓ Изображения сгенерированы. Сохрани программу.';
  renderPics();
}
function renderPics(){
  const cover=$('fCoverBox');if(!cover)return;
  cover.innerHTML='';
  cover.appendChild(picBox('Обложка',form.cover,d=>{form.cover=d;renderPics();},'cover',''));

  const blocks=exerciseBlocks(form.sourceLocale),names=blocks.map(x=>x.name);
  const box=$('fPics');box.innerHTML='';
  $('fPicsHint').textContent=names.length?'Клик по картинке — генерация через ИИ. «Загрузить» — своё фото.':'Добавь упражнения в протокол — здесь появятся карточки фото.';
  blocks.forEach(ex=>box.appendChild(picBox(ex.name,form.media[ex.name],d=>{if(d)form.media[ex.name]=d;else delete form.media[ex.name];renderPics();},'exercise',ex.description)));
  Object.keys(form.media).forEach(k=>{if(!names.includes(k))delete form.media[k];});
}
function picBox(label,data,set,kind,description){
  const el=document.createElement('div');el.className='pic';
  el.innerHTML=`<div class="ph">${data?`<img src="${esc(data)}" alt="">`:'ИИ'}</div>
    <small>${esc(label)}</small>
    <div class="pic-tools"><button type="button" data-upload>Загрузить</button>${data?'<button type="button" data-remove>Убрать</button>':''}</div>`;
  el.querySelector('.ph').onclick=()=>generateCatalogPic(kind,label,description,set,el);
  el.querySelector('[data-upload]').onclick=()=>pickPic(set);
  const rm=el.querySelector('[data-remove]');if(rm)rm.onclick=()=>set(null);
  return el;
}

let editorLang='ru';
function setEditorLang(lang){
  editorLang=lang==='en'?'en':'ru';
  document.querySelectorAll('[data-editor-lang]').forEach(x=>x.classList.toggle('on',x.dataset.editorLang===editorLang));
  const ru=$('editorRu'),en=$('editorEn');
  if(ru)ru.hidden=editorLang!=='ru';
  if(en)en.hidden=editorLang!=='en';
  renderExerciseCards();
}
function cancelProgramEdit(){
  const back=editingStatus==='pending'?'pending':'approved';
  editing=null;editingStatus=null;form={cover:null,media:{},sourceLocale:'ru'};editorLang='ru';
  localStorage.removeItem('adminEditingId');
  setTab(back);
}

    <div class="form-card">

      <div class="form-card-body">

          <div><label>Уровень</label><select id="fLevel">${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div>

        <div class="seg">
          <button type="button" data-editor-lang="ru" class="${editorLang==='ru'?'on':''}">RU <span id="fStateRu"></span></button>
          <button type="button" data-editor-lang="en" class="${editorLang==='en'?'on':''}">EN <span id="fStateEn"></span></button>
        </div>
      </div>

            <div class="wide"><label>Протокол программы</label><textarea id="fTextRu" class="program-text" maxlength="60000" placeholder="ПРОГРАММА: …&#10;ДНИ: Пн, Чт&#10;КРУГИ: 3&#10;&#10;УПРАЖНЕНИЕ: …"></textarea></div>
          </div>
        </div>
        <div id="editorEn" class="lang-pane"${editorLang==='en'?'':' hidden'}>
          <div class="field-grid">
            <div class="wide"><label>Name</label><input id="fNameEn" maxlength="60"></div>
            <div class="wide"><label>What it gives</label><textarea id="fGivesEn" class="compact-text" maxlength="300"></textarea></div>
            <div class="wide"><label>Program protocol</label><textarea id="fTextEn" class="program-text" maxlength="60000"></textarea></div>
          </div>
        </div>

        <div class="translate-tools">

            <button class="b" id="fTranslateEnRu">EN → RU</button>

  $('fSave').onclick=saveForm;

    $(id).oninput=()=>{updateLocaleStates();renderExerciseCards();renderPics();};
  });
  $('fTranslateRuEn').onclick=()=>translateCatalogForm('ru','en');
  $('fTranslateEnRu').onclick=()=>translateCatalogForm('en','ru');

  $('fCopyTranslate').onclick=copyTranslationSource;
  $('fPasteToggle').onclick=()=>{$('fPasteWrap').hidden=!$('fPasteWrap').hidden;};
  $('fPasteApply').onclick=applyPastedTranslation;
  $('genMissing').onclick=()=>generateMedia('missing');
  $('genAll').onclick=()=>{if(confirm('Перегенерировать обложку и все фото упражнений?'))generateMedia('all');};

    const file=e.target.files&&e.target.files[0];
    if(!file||!pickTo)return;
    shrinkPic(file,640,pic=>{pickTo(pic);pickTo=null;});
  };

function fillForm(c){
  editing=c.id;
  editingStatus=c.status||null;
  localStorage.setItem('adminEditingId', editing);
  form={cover:c.cover||null,media:Object.assign({},c.media||{}),sourceLocale:sourceLocaleOf(c)};
  editorLang=form.sourceLocale;
  $('fCat').value=c.cat||'tone';
  $('fLevel').value=c.level||'Новичок';
  $('fMin').value=c.min||20;
  $('fBy').value=c.by||'';
  $('fPro').checked=!!c.pro;
  $('programAccessState').textContent=c.pro?'Premium':'Free';
  $('programAccessState').className='status-chip'+(c.pro?' ok':'');
  setLocaleForm('ru',localeBlock(c,'ru'));
  setLocaleForm('en',localeBlock(c,'en'));
  $('fSourceHint').textContent='Исходник заявки: '+langName(form.sourceLocale)+' · RU и EN можно переводить в обе стороны';
  updateLocaleStates();setEditorLang(editorLang);renderPics();
}

async function saveForm(){
  const saveBtn=$('fSave'), saveState=$('programSaveState');
  if(saveBtn) saveBtn.disabled=true;
  if(saveState) saveState.textContent='Сохраняю…';
  const source = form.sourceLocale === 'en' ? 'en' : 'ru';
  const locales = {ru: localeFromForm('ru'), en: localeFromForm('en')};
  const src = locales[source];
  const item = {
    sourceLocale: source, locales,
    // Верхний уровень оставляем для совместимости со старыми клиентами и записями.
    name: src.name, gives: src.gives, text: src.text,
    cat: $('fCat').value, level: $('fLevel').value,
    min: +$('fMin').value, by: $('fBy').value.trim(),
    exCount: exNames().length, pro: $('fPro').checked,
    cover: form.cover, media: form.media
  };
  try{
    if(editing) await api('edit', {id: editing, item});
    else await api('add', {item});
    const backTo = editingStatus === 'pending' ? 'pending' : 'approved';
    editing = null; editingStatus = null;
    localStorage.removeItem('adminEditingId');
    form = {cover:null, media:{}, sourceLocale:'ru'};
    tab = backTo;
    localStorage.setItem('adminTab', tab);
    await load();
  }catch(e){
    $('fErr').textContent = e.miss ? 'Не хватает: ' + e.miss.join(', ') : 'Не сохранилось: ' + e.message;
    if(saveState) saveState.textContent='Ошибка сохранения';
    if(saveBtn) saveBtn.disabled=false;
  }
}

async function act(action, extra){
  try{ await api(action, extra); await load(); }
  catch(e){
    const details = Array.isArray(e.miss) && e.miss.length
      ? '\n\n— ' + e.miss.join('\n— ')
      : '';
    const head = action === 'approve'
      ? 'Не получилось опубликовать программу'
      : 'Не получилось выполнить действие';
    alert(head + details + (details ? '' : ': ' + e.message));
  }
}

document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('details.row-menu')) closeRowMenus();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRowMenus();});
window.addEventListener('resize',()=>closeRowMenus());
window.addEventListener('scroll',()=>closeRowMenus(),true);

document.querySelectorAll('[data-tab]').forEach(t => {
  t.onclick = () => {
    if(t.dataset.tab==='add'){
      editing=null;editingStatus=null;localStorage.removeItem('adminEditingId');
      form={cover:null,media:{},sourceLocale:'ru'};editorLang='ru';
    }
    setTab(t.dataset.tab);
  };
});
$('navOpen').onclick = () => {
  document.body.classList.add('nav-open');
  $('adminNav').classList.add('open');
};
$('navShade').onclick = closeNav;
$('out').onclick = () => { localStorage.removeItem('adminKey'); KEY = ''; closeNav(); showGate(''); };
$('enter').onclick = () => {
  KEY = $('key').value.trim();
  localStorage.setItem('adminKey', KEY);
  load();
};
$('key').onkeydown = e => { if(e.key === 'Enter') $('enter').click(); };

if(KEY) load(); else showGate('');
</script>
